# Default values for commons.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.

# ── Global ────────────────────────────────────────────────────────────────────
global:
    mode: prod                 # prod | dev  (dev allows image.tag override; see common.image)
    containerRegistry: egovio

# ── Workload defaults ───────────────────────────────────────────────────────────
namespace: egov
replicas: 1
httpPort: 8080
appType: ""

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  gateway: false
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
  waf:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/lua-resty-waf: "active"
      nginx.ingress.kubernetes.io/lua-resty-waf-debug: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-score-threshold: "10"
      nginx.ingress.kubernetes.io/lua-resty-waf-allow-unknown-content-types: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-process-multipart-body: "false"

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  pullPolicy: IfNotPresent

# ── Affinity ──────────────────────────────────────────────────────────────────
affinity:
    preferSpreadAcrossAZ: true

# ── Init containers ─────────────────────────────────────────────────────────────
initContainers:
  dbMigration:
    enabled: false
    image:
      pullPolicy: IfNotPresent
      tag: latest
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
                name: db
                key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
                name: db
                key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
                name: egov-config
                key: flyway-locations

  gitSync:
    enabled: false
    image:
      repository: registry.k8s.io/git-sync/git-sync
      tag: v4.4.0
      pullPolicy: IfNotPresent
    env: |
        - name: "GIT_SYNC_REPO"
          value: "{{ .Values.initContainers.gitSync.repo }}"
        - name: "GIT_SYNC_BRANCH"
          value: "{{ .Values.initContainers.gitSync.branch }}"
        - name: "GIT_SYNC_DEPTH"
          value: "1"
        - name: "GIT_SYNC_ONE_TIME"
          value: "true"
        - name: "GIT_SYNC_SSH"
          value: "true"
        - name: "GIT_SYNC_ROOT"
          value: "/work-dir"

# ── Health checks ───────────────────────────────────────────────────────────────
healthChecks:
    enabled: false
    livenessProbe: |
        httpGet:
            path: "/{{ .Values.ingress.context }}{{ .Values.healthChecks.livenessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 60
        successThreshold: 1
        failureThreshold: 5
    readinessProbe: |
        httpGet:
            path: "/{{ .Values.ingress.context }}{{ .Values.healthChecks.readinessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 30
        successThreshold: 1
        failureThreshold: 5

# ── Lifecycle ─────────────────────────────────────────────────────────────────
lifecycle:
    preStop:
        exec:
            command:
            - sh
            - -c
            - "sleep 10"

# ── Resources ─────────────────────────────────────────────────────────────────
cpu_requests: "100m"
memory_requests: "256Mi"
cpu_limits: "300m"
memory_limits: "512Mi"
resources: |
  {{- if eq .Values.appType "java" -}}
  requests:
    {{- if index .Values "cpu_requests" }}
    cpu: {{ index .Values "cpu_requests" | quote }}
    {{- end }}
    {{- if index .Values "memory_requests" }}
    memory: {{ .Values.memory_requests | quote }}
    {{- end }}
  limits:
    {{- if index .Values "cpu_limits" }}
    cpu: {{ index .Values "cpu_limits" | quote }}
    {{- end }}
    {{- if index .Values "memory_limits" }}
    memory: {{ .Values.memory_limits | quote }}
    {{- end }}
  {{- end -}}

# ── Extra env ─────────────────────────────────────────────────────────────────
## Allows specification of additional environment variables
extraEnv:
  # Injected into every appType "java" service (one gate, one block). Datasource +
  # Hikari pool come from egov-config and the db Secret; the platform defaults are
  # read by digit3 application.properties. Services inherit this - do not redefine
  # the datasource at service level. (OTel is separate below: it has its own gate.)
  java: |
      # -- datasource + Hikari pool --
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: db
            key: username
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db
            key: password
      - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: "org.postgresql.Driver"
      - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-pool-max-size
      - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-pool-min-idle
      - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-pool-connection-timeout-ms
      # -- platform defaults (flyway off in-app; the db-migration init container owns migrations) --
      - name: FLYWAY_ENABLED
        value: "false"
      - name: SPRING_FLYWAY_ENABLED
        value: {{ .Values.spring_flyway_enabled | default "false" | quote }}
      - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
        value: "/"
      - name: APP_TIMEZONE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: timezone
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: kafka-brokers
      - name: SPRING_JPA_SHOW_SQL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-jpa-show-sql
      - name: IS_ENVIRONMENT_CENTRAL_INSTANCE
        value: "false"
  # OpenTelemetry: injected only when tracing is enabled. Toggle + endpoint from egov-config
  # (otel-enabled defaults "false"); service-name/version/sampling keep the app's own defaults.
  otel: |
      - name: OTEL_ENABLED
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: otel-enabled
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: otel-exporter-otlp-endpoint
  # promote (optional, per service): appended LAST so its entries override earlier duplicates.

# ── Extra containers / volumes ──────────────────────────────────────────────────
## Additional init containers
extraInitContainers: |

## Additional sidecar containers
extraContainers: |

## Add additional volumes and mounts, e. g. for custom themes
extraVolumes: |
extraVolumeMounts: |

additionalLabels: {}

# ── Security ──────────────────────────────────────────────────────────────────
podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# ── Service ───────────────────────────────────────────────────────────────────
service:
  additionalAnnotations: {}

serviceMonitor:
  honorLabels: true
  # interval: 2m

# ── Cron ──────────────────────────────────────────────────────────────────────
cron:
  namespace: egov
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure
  httpPort: 8080
  ## Additional sidecar containers
  extraContainers: |

  ## Add additional volumes and mounts
  extraVolumes: |

  ## Add additional mounts
  extraVolumeMounts: |
