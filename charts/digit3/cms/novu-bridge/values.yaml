# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "novu-bridge"
  group: "cms"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
# NOT behind the gateway: only the exact public paths below are routed, straight to the
# bridge (templates/ingress.yaml). They authenticate inside the bridge (Bearer header).
# Everything else (/tenants, /messages machine APIs, /health) stays cluster-internal.
ingress:
  namespace: egov
  enabled: true
  gateway: false
  context: "novu-bridge"
  publicPaths:
    - logs
    - integrations
    - preferences
    - providers
    - providers/catalog
    - providers/templates
    - providers/twilio-templates
    - providers/verify
    - providers/test-send
    - providers/_update
    - providers/_delete
    - receipts/novu
    - receipts/smscountry
    - contract/envelope
    - contract/openapi
    - contract/thin-event
    - config/source
    - dispatch/_resolve

# ── Init container (flyway DB migration) ──────────────────────────────────────
# novu-bridge, novu-bridge-db, pgr-services and pgr-services-db must come from the same
# build; in prod mode all of them run Chart.appVersion.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "novu_bridge_schema"
    image:
      repository: "novu-bridge-db"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "novu-bridge"
replicas: 1
appType: "java"
heap: "-Xmx192m -Xms192m"
java-args: "-Dspring.profiles.active=monitoring"
tracing-enabled: false

# ── Resources ─────────────────────────────────────────────────────────────────
cpu_requests: "100m"
memory_requests: "256Mi"
cpu_limits: "300m"
memory_limits: "1024Mi"

# ── Health checks ─────────────────────────────────────────────────────────────
healthChecks:
  enabled: true
  livenessProbePath: "/health"     # common prepends ingress.context -> /novu-bridge/health
  readinessProbePath: "/health"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""                   # blank -> /<ingress.context>

# kafka. The envelope's eventType (never the topic) decides handling.
kafka-input-topics: "complaints.domain.events,notifications.events"
core-sms-topic: "egov.core.notification.sms"
dlq-topic: "novu-bridge.dlq"
max-retries: "3"

# messages
default-locale: "en_IN"
# Last-resort country code (e.g. "+254") for a phone with none. Blank: such messages are
# SKIPPED / NB_CONTACT_INVALID rather than sent with a wrong prefix.
core-sms-country-code: ""
dispatch-log-enabled: "true"

# user preferences (false sends without consulting a user's notification preferences)
preference-enabled: true
preference-check-path: "/user-preference/v1/_search"
preference-code: "USER_NOTIFICATION_PREFERENCES"

# DIGIT lookups
user-search-path: "/user/_search"
mdms-search-path: "/mdms-v2/v2/_search"

# novu
novu-base-url: "http://novu-api.novu:3000"
# Blank -> read from the Secret novu-bridge-novu-api-key/api-key (optional), which the novu
# release's bootstrap Job creates. Prefer that over pinning a key in values.
novu-api-key: ""
# Must match the novu worker's worker.digitProviders.enabled (global.novuWorkerDigitProviders
# wins when set). false = the bridge hides/refuses SMSCountry/Ozeki/Jasmin provider types.
digit-worker-providers: true
# Extra state tenants (comma-separated) whose admins may manage providers.
provider-admin-tenants: ""
# Shared secret for delivery-receipt webhooks. Blank = app default.
receipts-secret: ""

# Per-tenant Novu accounts: one Novu organization per root tenant. OFF by default.
# Needs the Secret named below (never committed). Keys: novu-admin-email,
# novu-admin-password, encryption-key (>= 32 chars), encryption-key-previous (optional),
# internal-admin-token, internal-send-token (optional). The bridge fails closed when the
# feature is on and the Secret is incomplete.
tenant-accounts:
  enabled: false
  secretName: "novu-bridge-tenant-accounts"
  environment: "Development"

# legacy tracer
tracer-detailed-tracing-enabled: "false"
tracer-errors-send-to-kafka: "false"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: TRACER_DETAILED_TRACING_ENABLED
    value: {{ index .Values "tracer-detailed-tracing-enabled" | quote }}
  - name: TRACER_ERRORS_SEND_TO_KAFKA
    value: {{ index .Values "tracer-errors-send-to-kafka" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-config, key: kafka-brokers }
  - name: NOVU_BRIDGE_KAFKA_INPUT_TOPICS
    value: {{ index .Values "kafka-input-topics" | quote }}
  - name: NOVU_BRIDGE_CORE_SMS_TOPIC
    value: {{ index .Values "core-sms-topic" | quote }}
  - name: NOVU_BRIDGE_KAFKA_DLQ_TOPIC
    value: {{ index .Values "dlq-topic" | quote }}
  - name: NOVU_BRIDGE_MAX_RETRIES
    value: {{ index .Values "max-retries" | quote }}

  # ── Messages ─────────────────────────────────────────────────────────────
  # Tenant a core SMS (login OTP, password reset) is attributed to when the producer
  # does not carry one: the deployment's state root.
  - name: NOVU_BRIDGE_CORE_SMS_DEFAULT_TENANT
    valueFrom:
      configMapKeyRef: { name: egov-config, key: state-level-tenant-id }
  - name: NOVU_BRIDGE_CORE_SMS_COUNTRY_CODE
    value: {{ index .Values "core-sms-country-code" | quote }}
  - name: NOVU_BRIDGE_DEFAULT_LOCALE
    value: {{ index .Values "default-locale" | quote }}
  - name: NOVU_BRIDGE_DISPATCH_LOG_ENABLED
    value: {{ index .Values "dispatch-log-enabled" | quote }}
  - name: NOVU_BRIDGE_RECEIPTS_SECRET
    value: {{ index .Values "receipts-secret" | default "" | quote }}

  # ── User preferences ─────────────────────────────────────────────────────
  - name: NOVU_BRIDGE_PREFERENCE_ENABLED
    value: {{ index .Values "preference-enabled" | toString | quote }}
  - name: NOVU_BRIDGE_PREFERENCE_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: digit-user-preferences-service }
  - name: NOVU_BRIDGE_PREFERENCE_CHECK_PATH
    value: {{ index .Values "preference-check-path" | quote }}
  - name: NOVU_BRIDGE_PREFERENCE_CODE
    value: {{ index .Values "preference-code" | quote }}

  # ── DIGIT services ───────────────────────────────────────────────────────
  - name: NOVU_BRIDGE_USER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-user }
  - name: NOVU_BRIDGE_USER_SEARCH_PATH
    value: {{ index .Values "user-search-path" | quote }}
  - name: NOVU_BRIDGE_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-localization }
  - name: NOVU_BRIDGE_MDMS_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: mdms-service-v2 }
  - name: NOVU_BRIDGE_MDMS_SEARCH_PATH
    value: {{ index .Values "mdms-search-path" | quote }}

  # ── Novu ─────────────────────────────────────────────────────────────────
  - name: NOVU_BASE_URL
    value: {{ index .Values "novu-base-url" | quote }}
  - name: NOVU_API_KEY
  {{- if index .Values "novu-api-key" }}
    value: {{ index .Values "novu-api-key" | quote }}
  {{- else }}
    valueFrom:
      secretKeyRef: { name: novu-bridge-novu-api-key, key: api-key, optional: true }
  {{- end }}
  - name: NOVU_BRIDGE_DIGIT_WORKER_PROVIDERS
    value: {{ if hasKey (.Values.global | default dict) "novuWorkerDigitProviders" }}{{ .Values.global.novuWorkerDigitProviders | toString | quote }}{{ else }}{{ index .Values "digit-worker-providers" | toString | quote }}{{ end }}
  - name: NOVU_BRIDGE_PROVIDER_ADMIN_TENANTS
    value: {{ index .Values "provider-admin-tenants" | default "" | quote }}

  # ── Per-tenant Novu accounts ─────────────────────────────────────────────
  - name: NOVU_BRIDGE_TENANT_ACCOUNTS_ENABLED
    value: {{ index .Values "tenant-accounts" "enabled" | toString | quote }}
  {{- if index .Values "tenant-accounts" "enabled" }}
  {{- $secret := index .Values "tenant-accounts" "secretName" }}
  - name: NOVU_BRIDGE_TENANT_ACCOUNTS_ENVIRONMENT
    value: {{ index .Values "tenant-accounts" "environment" | quote }}
  - name: NOVU_BRIDGE_NOVU_ADMIN_EMAIL
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: novu-admin-email }
  - name: NOVU_BRIDGE_NOVU_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: novu-admin-password }
  - name: NOVU_BRIDGE_TENANT_KEY_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: encryption-key }
  - name: NOVU_BRIDGE_TENANT_KEY_ENCRYPTION_KEY_PREVIOUS
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: encryption-key-previous, optional: true }
  - name: NOVU_BRIDGE_INTERNAL_ADMIN_TOKEN
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: internal-admin-token }
  - name: NOVU_BRIDGE_INTERNAL_SEND_TOKEN
    valueFrom:
      secretKeyRef: { name: {{ $secret }}, key: internal-send-token, optional: true }
  {{- end }}
