{{- /* Rendered only when secret.existingSecret is empty (the escape hatch; see values.yaml). */ -}}
{{- $_ := include "common.name" . }}
{{- if not .Values.secret.existingSecret }}
{{- $values := .Values.secret.values | default dict }}
{{- $required := include "identity-bff.requiredSecrets" . | fromYaml }}
{{- $optional := include "identity-bff.optionalSecrets" . | fromYaml }}
{{- include "identity-bff.refuseSecretPlaceholders" (dict "values" $values "required" (keys $required | sortAlpha)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "identity-bff.secretName" . }}
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key := concat (keys $required) (keys $optional) | sortAlpha }}
{{- if index $values $key }}
  {{ $key }}: {{ index $values $key | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
