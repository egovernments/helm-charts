# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "configurator"
  group: "web"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
# Static SPA served under /configurator/ (its image bakes that base path). Plain nginx
# ingress, NOT through the gateway: the SPA calls the same-origin gateway itself with each
# user's own OAuth token, so no API base is baked at build time.
ingress:
  namespace: egov
  enabled: true
  gateway: false
  context: "configurator"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "configurator"
replicas: 1
appType: ""                        # nginx static frontend (no shared java env)
httpPort: 80

# ── Resources ─────────────────────────────────────────────────────────────────
# appType is "" so common's java resources template is empty; set explicitly.
resources: |
  requests:
    cpu: "10m"
    memory: "24Mi"
  limits:
    memory: "64Mi"

# ── Health checks ─────────────────────────────────────────────────────────────
healthChecks:
  enabled: true
  livenessProbePath: "/"           # common prepends ingress.context -> /configurator/
  readinessProbePath: "/"

# ── Runtime config ────────────────────────────────────────────────────────────
# Rendered into <base>/config.js (templates/runtime-config.yaml) and mounted over the copy
# the image ships, so one image serves every deployment. Blank = the SPA's own default:
#   STATE_TENANT_ID        login form's tenant (default pg)
#   OVERPASS_URL           boundary-polygon Overpass endpoint (default overpass-api.de)
#   TURBOPASS_URL          Turbopass base for boundary search (default same-origin /turbopass)
#   BOUNDARY_SEARCH_LIMIT  boundary-service page cap (default 300)
#   SENTRY_DSN, POSTHOG_KEY, POSTHOG_HOST  this console's own telemetry (default off)
runtimeConfig:
  STATE_TENANT_ID: ""
  OVERPASS_URL: ""
  TURBOPASS_URL: ""
  BOUNDARY_SEARCH_LIMIT: ""
  SENTRY_DSN: ""
  POSTHOG_KEY: ""
  POSTHOG_HOST: ""

# Rolls the pods when config.js changes (config.js is a subPath mount, which never sees a
# ConfigMap update on its own).
additionalAnnotations: |
  checksum/config: {{ include "configurator.runtimeConfigJs" . | sha256sum | quote }}

extraVolumes: |
  - name: runtime-config
    configMap:
      name: {{ template "common.name" . }}-runtime-config
extraVolumeMounts: |
  - name: runtime-config
    mountPath: /usr/share/nginx/html/configurator/config.js
    subPath: config.js
    readOnly: true
