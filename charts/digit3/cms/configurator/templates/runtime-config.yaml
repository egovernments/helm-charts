{{- /* common.name merges the environment's `configurator:` block into .Values first. */ -}}
{{- $name := include "common.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-runtime-config
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
data:
  config.js: |
    {{- include "configurator.runtimeConfigJs" . | nindent 4 }}
