# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "digit-config-service"
  group: "cms"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "config-service"

# ── Init container (flyway DB migration) ──────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "digit_config_service_schema"
    image:
      repository: "digit-config-service-db"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "digit-config-service"
replicas: 1
appType: "java"
heap: "-Xmx192m -Xms192m"
java-args: "-Dspring.profiles.active=monitoring"
tracing-enabled: false

# ── Resources ─────────────────────────────────────────────────────────────────
cpu_requests: "100m"
memory_requests: "256Mi"
cpu_limits: "300m"
memory_limits: "1024Mi"

# ── Health checks ─────────────────────────────────────────────────────────────
healthChecks:
  enabled: true
  livenessProbePath: "/health"     # common prepends ingress.context -> /config-service/health
  readinessProbePath: "/health"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""                   # blank -> /<ingress.context>

# paging
default-offset: "0"
default-limit: "100"

# MDMS v2 schema validation
mdms-schema-search-path: "/mdms-v2/schema/v1/_search"
mdms-validation-enabled: "true"

# encryption (provider credentials are stored encrypted via egov-enc-service)
encryption-service-enabled: "true"
enc-encrypt-endpoint: "/egov-enc-service/crypto/v1/_encrypt"
enc-decrypt-endpoint: "/egov-enc-service/crypto/v1/_decrypt"

# outbound HTTP (ms)
http-connection-timeout: "30000"
http-read-timeout: "60000"

# kafka
topic-audit: "egov.core.audit"

# legacy tracer
tracer-opentracing-enabled: "false"
tracer-detailed-tracing-enabled: "false"
tracer-errors-send-to-kafka: "false"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef: { name: egov-config, key: egov-state-level-tenant-id }
  - name: CONFIG_DEFAULT_OFFSET
    value: {{ index .Values "default-offset" | quote }}
  - name: CONFIG_DEFAULT_LIMIT
    value: {{ index .Values "default-limit" | quote }}
  - name: HTTP_CLIENT_CONNECTION_TIMEOUT
    value: {{ index .Values "http-connection-timeout" | quote }}
  - name: HTTP_CLIENT_READ_TIMEOUT
    value: {{ index .Values "http-read-timeout" | quote }}
  - name: TRACER_OPENTRACING_ENABLED
    value: {{ index .Values "tracer-opentracing-enabled" | quote }}
  - name: TRACER_DETAILED_TRACING_ENABLED
    value: {{ index .Values "tracer-detailed-tracing-enabled" | quote }}
  - name: TRACER_ERRORS_SEND_TO_KAFKA
    value: {{ index .Values "tracer-errors-send-to-kafka" | quote }}

  # ── MDMS v2 ──────────────────────────────────────────────────────────────
  - name: MDMS_V2_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: mdms-service-v2 }
  - name: MDMS_V2_SCHEMA_SEARCH_PATH
    value: {{ index .Values "mdms-schema-search-path" | quote }}
  - name: MDMS_V2_VALIDATION_ENABLED
    value: {{ index .Values "mdms-validation-enabled" | quote }}

  # ── Encryption ───────────────────────────────────────────────────────────
  - name: EGOV_ENC_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-enc-service }
  - name: ENCRYPTION_SERVICE_ENABLED
    value: {{ index .Values "encryption-service-enabled" | quote }}
  - name: EGOV_ENC_ENCRYPT_ENDPOINT
    value: {{ index .Values "enc-encrypt-endpoint" | quote }}
  - name: EGOV_ENC_DECRYPT_ENDPOINT
    value: {{ index .Values "enc-decrypt-endpoint" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-config, key: kafka-brokers }
  - name: KAFKA_TOPIC_AUDIT
    value: {{ index .Values "topic-audit" | quote }}
