{{- with index .Values "cluster-configs" "secrets" "citizen-broker-secret" }}
{{- if index . "citizen-broker-client-secret" }}
{{- $name := .name | default "citizen-broker-secret" }}
{{- $secret := index . "citizen-broker-client-secret" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  citizen-broker-client-secret: {{ $secret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
