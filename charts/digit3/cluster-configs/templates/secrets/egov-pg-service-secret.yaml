{{- with index .Values "cluster-configs" "secrets" "egov-pg-service" }}
{{- if index . "stripe-secret-key" }}
{{- $pg := . }}
{{- $name := .name | default "egov-pg-service" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  stripe-secret-key: {{ index $pg "stripe-secret-key" | b64enc | quote }}
{{- if index $pg "axis-merchant-id" }}
  axismerchantid: {{ index $pg "axis-merchant-id" | b64enc | quote }}
  axismerchantsecret: {{ index $pg "axis-merchant-secret-key" | b64enc | quote }}
  axismerchantuser: {{ index $pg "axis-merchant-user" | b64enc | quote }}
  axismerchantpwd: {{ index $pg "axis-merchant-pwd" | b64enc | quote }}
  axismerchantaccesscode: {{ index $pg "axis-merchant-access-code" | b64enc | quote }}
{{- end }}
{{- if index $pg "easypay-merchant-id" }}
  easypay-merchant-id: {{ index $pg "easypay-merchant-id" | b64enc | quote }}
  easypay-aes-key: {{ index $pg "easypay-aes-key" | b64enc | quote }}
{{- end }}
{{- if index $pg "payu-merchant-key" }}
  payumerchantkey: {{ index $pg "payu-merchant-key" | b64enc | quote }}
  payumerchantsalt: {{ index $pg "payu-merchant-salt" | b64enc | quote }}
{{- end }}
{{- if index $pg "ccavenue-merchant-id" }}
  ccavenue-merchant-id: {{ index $pg "ccavenue-merchant-id" | b64enc | quote }}
  ccavenue-status-working-key: {{ index $pg "ccavenue-status-working-key" | b64enc | quote }}
  ccavenue-redirect-working-key: {{ index $pg "ccavenue-redirect-working-key" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
