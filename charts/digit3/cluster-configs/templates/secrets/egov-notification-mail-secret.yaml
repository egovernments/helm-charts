{{- with index .Values "cluster-configs" "secrets" "egov-notification-mail" }}
{{- if index . "mailsenderusername" }}
{{- $name := .name | default "egov-notification-mail" }}
{{- $user := index . "mailsenderusername" }}
{{- $pass := index . "mailsenderpassword" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  mailsenderusername: {{ $user | b64enc | quote }}
  mailsenderpassword: {{ $pass | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
