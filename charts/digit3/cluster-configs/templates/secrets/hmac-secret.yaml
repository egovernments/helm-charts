{{- with index .Values "cluster-configs" "secrets" "hmac-secret" }}
{{- if index . "hmac-secret" }}
{{- $name := .name | default "hmac-secret" }}
{{- $secret := index . "hmac-secret" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  hmac-secret: {{ $secret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
