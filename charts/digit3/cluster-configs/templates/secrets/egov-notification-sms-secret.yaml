{{- with index .Values "cluster-configs" "secrets" "egov-notification-sms" }}
{{- if index . "password" }}
{{- $name := .name | default "egov-notification-sms" }}
{{- $user := index . "username" }}
{{- $pass := index . "password" }}
{{- $secure := index . "secure-key" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $pass | b64enc | quote }}
{{- if $secure }}
  secure-key: {{ $secure | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
