{{- with index .Values "cluster-configs" "secrets" "kafka-kraft" }}
{{- if index . "kraft-cluster-id" }}
{{- $name := .name | default "kafka-kraft" }}
{{- $id := index . "kraft-cluster-id" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  kraft-cluster-id: {{ $id | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
