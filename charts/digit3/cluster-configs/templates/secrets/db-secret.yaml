{{- with index .Values "cluster-configs" "secrets" "db" }}
{{- if index . "password" }}
{{- $name := .name | default "db" }}
{{- $user := index . "username" }}
{{- $pass := index . "password" }}
{{- $fuser := index . "flyway-username" }}
{{- $fpass := index . "flyway-password" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $pass | b64enc | quote }}
  flyway-username: {{ $fuser | b64enc | quote }}
  flyway-password: {{ $fpass | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
