{{- with index .Values "cluster-configs" "secrets" "docker-registry-secret" }}
{{- if index . "dockerconfigjson" }}
{{- $name := .name | default "docker-registry-secret" }}
{{- $cfg := index . "dockerconfigjson" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
