{{- with index .Values "cluster-configs" "secrets" "employee-iam-secret" }}
{{- if index . "employee-iam-client-secret" }}
{{- $name := .name | default "employee-iam-secret" }}
{{- $secret := index . "employee-iam-client-secret" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: Opaque
data:
  employee-iam-client-secret: {{ $secret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
