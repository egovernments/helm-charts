{{- /*
  Generic Secret renderer. Iterates cluster-configs.secrets and renders one Secret per namespace
  for every item that has data. Data may be under `data:` or as keys directly on the item.
  Reserved keys: name, namespace, type, data. Values are base64-encoded. For a
  kubernetes.io/dockerconfigjson secret, set type and provide a `dockerconfigjson` value.
*/ -}}
{{- range $key, $item := (index .Values "cluster-configs" "secrets") }}
{{- $data := $item.data | default (omit $item "name" "namespace" "type") }}
{{- if $data }}
{{- $name := $item.name | default $key }}
{{- $type := $item.type | default "Opaque" }}
{{- range $ns := $item.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
type: {{ $type }}
data:
{{- if eq $type "kubernetes.io/dockerconfigjson" }}
  .dockerconfigjson: {{ (index $data "dockerconfigjson" | default (index $data ".dockerconfigjson")) | toString | b64enc | quote }}
{{- else }}
{{- range $k, $v := $data }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
