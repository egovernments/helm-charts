# cluster-configs - DIGIT 3.0
#
# One install per product, scoped to the product namespace (e.g. digit3-core). Objects render
# dynamically from the lists below (templates/secrets.yaml, templates/configmaps.yaml) - add an
# entry here or in the env values file, no chart change needed. SAFE defaults: items carry only
# name + namespace (no data), so nothing renders until a values file supplies data.
#
#   cluster-configs:
#     secrets:
#       service-x:
#         namespace: [ digit3-core ]     # one object per namespace in the list
#         data:
#           api-key: "<value>"           # base64-encoded automatically
cluster-configs:

  # ── Namespaces ────────────────────────────────────────────────────────────
  # OFF by default; a product sets create: true, values: [ <ns> ].
  namespaces:
    create: false
    values: []

  # ── Root ingress ──────────────────────────────────────────────────────────
  # Routes the domain root "/" to a UI. OFF by default; a product opts in.
  root-ingress:
    enabled: false
    name: root-ingress
    namespace: egov
    cert-issuer: "letsencrypt-staging"
    appRoot: digit-ui
    serviceName: digit-ui
    servicePort: 80

  # ── ConfigMaps ────────────────────────────────────────────────────────────
  configmaps:
    egov-config:                 # shared config read by all services (db-url, kafka-brokers, ...)
      name: egov-config
      namespace: [ egov ]
      data:
        # DB datasource + Hikari pool (overridable per environment)
        db-host: "postgresql.backbone"
        db-port: "5432"
        db-name: "postgres"
        db-ssl-mode: "disable"
        db-url: "jdbc:postgresql://postgresql.backbone:5432/postgres?sslmode=disable"
        db-pool-max-size: "20"
        db-pool-min-idle: "2"
        db-pool-connection-timeout-ms: "1000"
        # Platform (read by appType java services via common.extraEnv.java)
        kafka-brokers: "kafka-controller-headless.backbone:9092"
        timezone: "UTC"
        spring-jpa-show-sql: "false"
        # Observability
        otel-enabled: "false"
        otel-exporter-otlp-endpoint: "open-telemetry-opentelemetry-collector.monitoring:4318"
        # Keycloak
        keycloak-enabled: "false"
        keycloak-base-url: "http://keycloak.keycloak.svc.cluster.local:8080/keycloak"
    egov-service-host:           # internal service URLs (overridable per environment)
      name: egov-service-host
      namespace: [ egov ]
      data:
        apportion: http://apportion.egov:8080/
        billing: http://billing.egov:8080/
        boundary: http://boundary.egov:8080/
        filestore: http://filestore.egov:8080/
        idgen: http://idgen.egov:8080/
        individual: http://individual.egov:8080/
        localization: http://localization.egov:8080/
        mdms-v2: http://mdms-v2.egov:8080/
        notification: http://notification.egov:8080/
        otp: http://otp.digit3-core:8080/
        registry: http://registry.egov:8080/
        template-config: http://template-config.egov:8080/
        vault: http://vault.vault:8200/

  # ── Secrets ───────────────────────────────────────────────────────────────
  secrets:
    db:                          # username, password, flyway-username, flyway-password
      name: db
      namespace: [ egov ]
    minio:                       # accesskey, secretkey
      name: minio
      namespace: [ egov ]
    kc-admin:                    # username, password
      name: kc-admin
      namespace: [ egov ]
    kc-db:                       # username, password
      name: kc-db
      namespace: [ keycloak ]
    vault-approle:               # role-id, secret-id
      name: vault-approle
      namespace: [ egov ]
    hmac-secret:                 # hmac-secret
      name: hmac-secret
      namespace: [ egov ]
    employee-iam-secret:         # employee-iam-client-secret
      name: employee-iam-secret
      namespace: [ egov ]
    citizen-broker-secret:       # citizen-broker-client-secret
      name: citizen-broker-secret
      namespace: [ egov ]
    egov-notification-mail:      # mailsenderusername, mailsenderpassword
      name: egov-notification-mail
      namespace: [ egov ]
    egov-notification-sms:       # username, password (optional secure-key)
      name: egov-notification-sms
      namespace: [ egov ]
    egov-pg-service:             # stripe-secret-key + optional payment-gateway keys
      name: egov-pg-service
      namespace: [ egov ]
    docker-registry-secret:      # dockerconfigjson -> imagePullSecrets for all services
      name: docker-registry-secret
      namespace: [ egov ]
      type: kubernetes.io/dockerconfigjson
