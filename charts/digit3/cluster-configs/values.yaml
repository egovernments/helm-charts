# cluster-configs - DIGIT 3.0
#
# One install per product, scoped to the product namespace (e.g. digit3-core).
# Objects are rendered DYNAMICALLY from the lists below by templates/secrets.yaml and
# templates/configmaps.yaml - there is no per-object template. To add a new ConfigMap or Secret,
# add an entry here (or, more usually, in the env/local values file) - no chart change needed:
#
#   cluster-configs:
#     secrets:
#       service-x:
#         name: service-x-secret         # defaults to the key (service-x)
#         namespace: [ digit3-core ]      # one object per namespace in the list
#         data:                           # or put keys directly under the item
#           api-key: "<value>"            # value is base64-encoded automatically
#
# SAFE defaults: every item below carries only name + namespace (no data), so nothing renders
# until a values file supplies data. Default namespace is egov; products override per item.
cluster-configs:

  # Namespaces to create. OFF by default; a product sets create: true, values: [ <ns> ].
  namespaces:
    create: false
    values: []

  # Root ingress (routes the domain root "/" to a UI). OFF by default; a product opts in.
  root-ingress:
    enabled: false
    name: root-ingress
    namespace: egov
    cert-issuer: "letsencrypt-staging"
    appRoot: citizen
    serviceName: citizen
    servicePort: 80

  configmaps:
    egov-config:                 # shared config read by all services (db-url, kafka-brokers, ...)
      name: egov-config
      namespace: [ egov ]
    egov-service-host:           # internal service URLs
      name: egov-service-host
      namespace: [ egov ]

  secrets:
    db:                          # username, password, flyway-username, flyway-password
      name: db
      namespace: [ egov ]
    minio:                       # accesskey, secretkey
      name: minio
      namespace: [ egov ]
    kc-admin:                    # username, password
      name: kc-admin
      namespace: [ egov ]
    kc-db:                       # username, password
      name: kc-db
      namespace: [ keycloak ]
    vault-approle:               # role-id, secret-id
      name: vault-approle
      namespace: [ egov ]
    hmac-secret:                 # hmac-secret
      name: hmac-secret
      namespace: [ egov ]
    employee-iam-secret:         # employee-iam-client-secret
      name: employee-iam-secret
      namespace: [ egov ]
    citizen-broker-secret:       # citizen-broker-client-secret
      name: citizen-broker-secret
      namespace: [ egov ]
    egov-notification-mail:      # mailsenderusername, mailsenderpassword
      name: egov-notification-mail
      namespace: [ egov ]
    egov-notification-sms:       # username, password (optional secure-key)
      name: egov-notification-sms
      namespace: [ egov ]
    egov-pg-service:             # stripe-secret-key + optional payment-gateway keys
      name: egov-pg-service
      namespace: [ egov ]
    docker-registry-secret:      # dockerconfigjson -> imagePullSecrets for all services
      name: docker-registry-secret
      namespace: [ egov ]
      type: kubernetes.io/dockerconfigjson
