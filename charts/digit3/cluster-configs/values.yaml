# cluster-configs - DIGIT 3.0
#
# One install per product, scoped to the product namespace (e.g. digit3), alongside the platform's
# own cluster-configs on the same cluster.
#
# These are SAFE defaults: nothing cluster-wide and nothing in any shared namespace renders by
# default. Each object renders only when the product values file supplies a namespace (always a
# LIST) and the object's required data key. See ci/test-values.yaml for a complete example.
cluster-configs:

  # Cluster-wide RBAC (ClusterRole / ClusterRoleBinding). OFF by default so a product install does
  # not clash with the platform's cluster-configs over the same cluster-scoped objects.
  cluster-roles:
    enabled: false

  # Namespaces to create. OFF by default; a product sets: create: true, values: [ digit3 ].
  namespaces:
    create: false
    values: []

  # Root ingress. OFF by default; a product opts in and sets host/service/namespace.
  root-ingress:
    enabled: false
    name: root-ingress
    namespace: ""
    cert-issuer: "letsencrypt-staging"
    appRoot: ""
    serviceName: ""
    servicePort: 80

  # Default-backend ingress for nginx error pages. OFF by default.
  nginx-errors:
    enabled: false
    name: nginx-errors
    namespace: ""
    serviceName: nginx-errors
    servicePort: 80

  # Headless DB service/endpoints. Renders only when db-ips is supplied.
  db:
    name: db-service
    namespace: []
    port: 5432
    targetPort: 5432

  configmaps:
    # egov-config - used by all services. Product supplies namespace: [ digit3 ] and data: {...}
    # (db-url, flyway-locations, kafka-brokers, db-host, db-name, redis-host).
    egov-config:
      name: egov-config
      namespace: []
      data: {}
    # egov-service-host - internal service URLs. Product supplies namespace + data
    # (apportion, billing, boundary, filestore, idgen, individual, notification, otp, registry,
    #  template-config, vault).
    egov-service-host:
      name: egov-service-host
      namespace: []
      data: {}

  # Each secret renders one object per entry in its (LIST) namespace, only when its required data
  # key is supplied. Names default to what the services expect.
  secrets:
    db:                                   # username, password, flyway-username, flyway-password
      name: db
      namespace: []
    minio:                                # accesskey, secretkey
      name: minio
      namespace: []
    kc-admin:                             # username, password
      name: kc-admin
      namespace: []
    vault-approle:                        # role-id, secret-id
      name: vault-approle
      namespace: []
    hmac-secret:                          # hmac-secret
      name: hmac-secret
      namespace: []
    employee-iam-secret:                  # employee-iam-client-secret
      name: employee-iam-secret
      namespace: []
    citizen-broker-secret:                # citizen-broker-client-secret
      name: citizen-broker-secret
      namespace: []
    egov-notification-mail:               # mailsenderusername, mailsenderpassword
      name: egov-notification-mail
      namespace: []
    egov-notification-sms:                # username, password (optional secure-key)
      name: egov-notification-sms
      namespace: []
    egov-pg-service:                      # stripe-secret-key (optional axis/easypay/payu/ccavenue)
      name: egov-pg-service
      namespace: []
    docker-registry-secret:               # dockerconfigjson (imagePullSecrets for all services)
      name: docker-registry-secret
      namespace: []
