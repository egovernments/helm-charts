# CI render values for the lint-template check, and an example of the data a deployer supplies.
# Namespaces come from values.yaml (default egov, as lists); here we only add the data keys that
# the digit3 core charts consume, so the render exercises every object.
global:
  domain: "ci.example.com"
  setup: "default"
  containerRegistry: "registry.local"

cluster-configs:
  cluster-roles:
    enabled: true           # platform install owns cluster-wide RBAC; exercised here
  namespaces:
    create: true
    values: [ egov ]
  root-ingress:
    enabled: true

  configmaps:
    egov-config:
      data:
        db-url: "jdbc:postgresql://db-service.egov:5432/egov"
        db-host: "db-service.egov"
        db-name: "egov"
        redis-host: "redis.backbone"
        flyway-locations: "db/migration/main"
        kafka-brokers: "kafka-kraft.backbone:9092"
    egov-service-host:
      data:
        apportion: "http://apportion.egov:8080/"
        billing: "http://billing.egov:8080/"
        boundary: "http://boundary.egov:8080/"
        filestore: "http://filestore.egov:8080/"
        idgen: "http://idgen.egov:8080/"
        individual: "http://individual.egov:8080/"
        notification: "http://notification.egov:8080/"
        otp: "http://otp.egov:8080/"
        registry: "http://registry.egov:8080/"
        template-config: "http://template-config.egov:8080/"
        vault: "http://vault.egov:8200/"

  secrets:
    db:                                 # renders in egov AND health (values namespace list)
      username: "ci-test"
      password: "ci-test"
      flyway-username: "ci-test"
      flyway-password: "ci-test"
    minio:
      accesskey: "ci-test"
      secretkey: "ci-test"
    kc-admin:
      username: "ci-test"
      password: "ci-test"
    kc-db:
      username: "ci-test"
      password: "ci-test"
    vault-approle:
      role-id: "ci-test"
      secret-id: "ci-test"
    hmac-secret:
      hmac-secret: "ci-test"
    employee-iam-secret:
      employee-iam-client-secret: "ci-test"
    citizen-broker-secret:
      citizen-broker-client-secret: "ci-test"
    egov-notification-mail:
      mailsenderusername: "ci-test"
      mailsenderpassword: "ci-test"
    egov-notification-sms:
      username: "ci-test"
      password: "ci-test"
    egov-pg-service:
      stripe-secret-key: "ci-test"
    docker-registry-secret:
      dockerconfigjson: '{"auths":{}}'
