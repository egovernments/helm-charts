# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "url-shortener"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "url-shortener"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# DB migration runs in an init container; app-boot Flyway is off (SPRING_FLYWAY_ENABLED=false below).
# History table url_shortener_schema matches migrate.sh's -table setting.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "url_shortener_schema"
    image:
      repository: "url-shortener-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "url-shortener"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
# Spring relaxed binding: uppercase, every '.' and '-' becomes '_'
# (e.g. url-shortener.host-name -> URL_SHORTENER_HOST_NAME).
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_APPLICATION_NAME
    value: url-shortener
  - name: URL_SHORTENER_HOST_NAME
    value: https://{{ .Values.global.domain }}
  - name: URL_SHORTENER_CACHE_ENABLED
    value: "false"
  - name: URL_SHORTENER_CACHE_TYPE
    value: redis
  - name: URL_SHORTENER_CACHE_TTL
    value: 24h

  # ── Datasource ────────────────────────────────────────────────────────
  # Migration is handled by the init container above - app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: "false"

  # ── Redis (redirect cache) ────────────────────────────────────────────
  - name: SPRING_DATA_REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_DATABASE
    value: "0"
  - name: SPRING_DATA_REDIS_PASSWORD

  # ── Lifecycle events ──────────────────────────────────────────────────
  # same posture as the Go chart: disabled
  - name: URL_SHORTENER_EVENTS_ENABLED
    value: "false"
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_SHORT_URL
    value: url-shortener-create-short-url
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_CONFIG
    value: url-shortener-create-url-config
  - name: URL_SHORTENER_EVENTS_TOPICS_UPDATE_CONFIG
    value: url-shortener-update-url-config
  - name: URL_SHORTENER_EVENTS_TOPICS_DELETE_CONFIG
    value: url-shortener-delete-url-config

  # ── Kafka ─────────────────────────────────────────────────────────────
  # kafka, not redis: account publishes account-migration to kafka and tenant-migration below subscribes here
  - name: TRACER_PUBSUB_TYPE
    value: kafka
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Tenant / schema separation ────────────────────────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above; set once at initial deployment
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: url_shortener_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: url-shortener

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: "1.0"
