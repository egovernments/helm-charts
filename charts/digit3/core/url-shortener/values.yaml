# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "url-shortener"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "url-shortener"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# DB migration runs in an init container; app-boot Flyway is off (SPRING_FLYWAY_ENABLED=false below).
# History table url_shortener_schema matches migrate.sh's -table setting.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "url_shortener_schema"
    image:
      repository: "url-shortener-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "url-shortener"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

# ── App config (overridable per env) ──────────────────────────────────────────
app-name: "url-shortener"
flyway-enabled: "false"
cache-enabled: "false"
cache-type: "redis"
cache-ttl: "24h"
redis-db: "0"
events-enabled: "false"
topic-create-short-url: "url-shortener-create-short-url"
topic-create-config: "url-shortener-create-url-config"
topic-update-config: "url-shortener-update-url-config"
topic-delete-config: "url-shortener-delete-url-config"
pubsub-type: "kafka"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
tenant-migration-consumer-group: "url-shortener"
metrics-export-enabled: "false"
management-endpoints-exposure: "health,info"
tracing-sampling-probability: "1.0"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
# Spring relaxed binding: uppercase, every '.' and '-' becomes '_'
# (e.g. url-shortener.host-name -> URL_SHORTENER_HOST_NAME).
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SPRING_APPLICATION_NAME
    value: {{ index .Values "app-name" | quote }}
  - name: URL_SHORTENER_HOST_NAME
    value: https://{{ .Values.global.domain }}
  - name: URL_SHORTENER_CACHE_ENABLED
    value: {{ index .Values "cache-enabled" | quote }}
  - name: URL_SHORTENER_CACHE_TYPE
    value: {{ index .Values "cache-type" | quote }}
  - name: URL_SHORTENER_CACHE_TTL
    value: {{ index .Values "cache-ttl" | quote }}

  # ── Datasource ────────────────────────────────────────────────────────
  # Migration is handled by the init container above - app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: {{ index .Values "flyway-enabled" | quote }}

  # ── Redis (redirect cache) ────────────────────────────────────────────
  - name: SPRING_DATA_REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: SPRING_DATA_REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port
  - name: SPRING_DATA_REDIS_DATABASE
    value: {{ index .Values "redis-db" | quote }}
  - name: SPRING_DATA_REDIS_PASSWORD

  # ── Lifecycle events ──────────────────────────────────────────────────
  # same posture as the Go chart: disabled
  - name: URL_SHORTENER_EVENTS_ENABLED
    value: {{ index .Values "events-enabled" | quote }}
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_SHORT_URL
    value: {{ index .Values "topic-create-short-url" | quote }}
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_CONFIG
    value: {{ index .Values "topic-create-config" | quote }}
  - name: URL_SHORTENER_EVENTS_TOPICS_UPDATE_CONFIG
    value: {{ index .Values "topic-update-config" | quote }}
  - name: URL_SHORTENER_EVENTS_TOPICS_DELETE_CONFIG
    value: {{ index .Values "topic-delete-config" | quote }}

  # ── Kafka ─────────────────────────────────────────────────────────────
  # kafka, not redis: account publishes account-migration to kafka and tenant-migration below subscribes here
  - name: TRACER_PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Tenant / schema separation ────────────────────────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above; set once at initial deployment
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: {{ index .Values "tenant-migration-consumer-group" | quote }}

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: {{ index .Values "metrics-export-enabled" | quote }}
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: {{ index .Values "management-endpoints-exposure" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: {{ index .Values "tracing-sampling-probability" | quote }}
