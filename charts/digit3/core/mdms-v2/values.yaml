# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "mdms-v2"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "mdms-v2"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "mdms_v2_schema"
    image:
      repository: "mdms-v2-db"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "mdms-v2"
replicas: "1"
appType: "java"
tracing-enabled: true
heap: "-Xmx512m -Xms512m"
java-args: "-Dspring.profiles.active=monitoring"
egov-mdms-schema-definition-save-topic: "save-mdms-schema-definition"
egov-mdms-data-save-topic: "save-mdms-data"

# ── App config (overridable per env) ──────────────────────────────────────────
kafka-consumer-group: "egov-mdms-service-consumer-group"
security-basic-enabled: "false"
management-security-enabled: "false"
java-enable-debug: "true"
otel-traces-exporter: "none"

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}

  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SECURITY_BASIC_ENABLED
    value: {{ index .Values "security-basic-enabled" | quote }}
  - name: MANAGEMENT_SECURITY_ENABLED
    value: {{ index .Values "management-security-enabled" | quote }}
  - name: JAVA_ENABLE_DEBUG
    value: {{ index .Values "java-enable-debug" | quote }}

  # ── MDMS topics ──────────────────────────────────────────────────────────
  - name: EGOV_MDMS_SCHEMA_DEFINITION_SAVE_TOPIC
    value: {{ index .Values "egov-mdms-schema-definition-save-topic" | quote }}
  - name: EGOV_MDMS_DATA_SAVE_TOPIC
    value: {{ index .Values "egov-mdms-data-save-topic" | quote }}

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  - name: OTEL_TRACES_EXPORTER
    value: {{ index .Values "otel-traces-exporter" | quote }}
