# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "localization-management"
  group: "core"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
# Exposes https://<domain>/localization-management/* ; the app serves on
# SERVER_CONTEXT_PATH (/localization-management), so the path passes through unchanged.
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "localization-management"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "localization_management_schema"
    image:
      repository: "localization-management-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: {{ .Values.dbSchema | default "public" | quote }}
        - name: FLYWAY_DEFAULT_SCHEMA
          value: {{ .Values.dbSchema | default "public" | quote }}

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "localization-management"
replicas: 1
# Reads its datasource via DB_HOST/DB_USER (not SPRING_DATASOURCE), so appType is
# blank and the common chart does not inject the Spring env block.
appType: ""
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=70.0"

# Spring Boot actuator health routes, served under the context path
healthChecks:
  enabled: true
  livenessProbePath: "/actuator/health/liveness"
  readinessProbePath: "/actuator/health/readiness"

resources: |
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
dbSchema: "public"
db-host: "postgres.egov"
db-port: "5432"
db-ssl-mode: "disable"

filestore-module: "localization-management"
digit-client-id: "localization-management"
localization-batch-size: "100"
localization-max-rows: "50000"
localization-max-file-bytes: "26214400"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── Database ─────────────────────────────────────────────────────────────
  - name: DB_HOST
    value: {{ index .Values "db-host" | quote }}
  - name: DB_PORT
    value: {{ index .Values "db-port" | quote }}
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: DB_SSL_MODE
    value: {{ index .Values "db-ssl-mode" | quote }}

  # ── Downstream services ──────────────────────────────────────────────────
  - name: EGOV_FILESTORE_SERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: filestore-java
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: localization-java

  # ── App config ─────────────────────────────────────────────────────────────
  - name: FILESTORE_MODULE
    value: {{ index .Values "filestore-module" | quote }}
  - name: DIGIT_CLIENT_ID
    value: {{ index .Values "digit-client-id" | quote }}
  - name: LOCALIZATION_BATCH_SIZE
    value: {{ index .Values "localization-batch-size" | quote }}
  - name: LOCALIZATION_MAX_ROWS
    value: {{ index .Values "localization-max-rows" | quote }}
  - name: LOCALIZATION_MAX_FILE_BYTES
    value: {{ index .Values "localization-max-file-bytes" | quote }}
