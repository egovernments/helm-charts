# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "localization-management"
  group: "core"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
# Exposes https://<domain>/localization-management/* ; the app serves on
# SERVER_CONTEXT_PATH (/localization-management), so the path passes through unchanged.
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "localization-management"

# ── Gateway-sync annotations ──────────────────────────────────────────────────
# Declarative Kong routing, consumed by the kong chart's gateway-sync reconciler.
# gateway/route-path is auto-added by the common Service template from ingress.context;
# the main route is protected (full auth stack).
service:
  additionalAnnotations: |
    gateway/route-auth: protected

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "localization_management_schema"
    image:
      repository: "localization-management-db"
      # = appVersion. Used in global.mode dev, where the common default would be "latest"
      # (not published for this image). Keep it equal to appVersion.
      tag: "develop-modulith-c1f10f6"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: {{ .Values.dbSchema | default "public" | quote }}
        - name: FLYWAY_DEFAULT_SCHEMA
          value: {{ .Values.dbSchema | default "public" | quote }}

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "localization-management"
replicas: 1
# Spring Boot service: the common chart injects the shared datasource (SPRING_DATASOURCE_*
# from egov-config/db-url) and Hikari pool; do not redefine the datasource here.
appType: "java"
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=70.0"

# Actuator base path is "/" (set by the common java env), so health is at /health
healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
dbSchema: "public"

filestore-module: "localization-management"
digit-client-id: "localization-management"
localization-batch-size: "100"
localization-max-rows: "50000"
localization-max-file-bytes: "26214400"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── Downstream services ──────────────────────────────────────────────────
  - name: EGOV_FILESTORE_SERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: filestore
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: localization

  # ── App config ─────────────────────────────────────────────────────────────
  - name: FILESTORE_MODULE
    value: {{ index .Values "filestore-module" | quote }}
  - name: DIGIT_CLIENT_ID
    value: {{ index .Values "digit-client-id" | quote }}
  - name: LOCALIZATION_BATCH_SIZE
    value: {{ index .Values "localization-batch-size" | quote }}
  - name: LOCALIZATION_MAX_ROWS
    value: {{ index .Values "localization-max-rows" | quote }}
  - name: LOCALIZATION_MAX_FILE_BYTES
    value: {{ index .Values "localization-max-file-bytes" | quote }}
