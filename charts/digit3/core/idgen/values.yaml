# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "idgen"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "idgen"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# Runs with elevated flyway creds before the app starts; app-boot Flyway is off
# (SPRING_FLYWAY_ENABLED=false). History table idgen_schema matches migrate.sh -table.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "idgen_schema"
    image:
      repository: "idgen-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "idgen"
replicas: 1
appType: "java"

# OTel span export switch; override per env via the idgen block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  # Zone for {DATE:*} rendering and sequence scope keys
  - name: IDGEN_TIMEZONE
    value: UTC

  # ── Datasource ───────────────────────────────────────────────────────────
  # migration handled by the init container above; app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: "false"

  # ── Template lifecycle events ────────────────────────────────────────────
  # same posture as the Go chart: disabled, redis backend
  - name: IDGEN_EVENTS_ENABLED
    value: "false"
  - name: IDGEN_EVENTS_TOPICS_CREATE
    value: idgen-create-template
  - name: IDGEN_EVENTS_TOPICS_UPDATE
    value: idgen-update-template
  - name: IDGEN_EVENTS_TOPICS_DELETE
    value: idgen-delete-template

  # ── Kafka ────────────────────────────────────────────────────────────────
  # account publishes account-migration to kafka; tenant-migration subscribes via this backend
  - name: TRACER_PUBSUB_TYPE
    value: kafka
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Redis ────────────────────────────────────────────────────────────────
  # kept only as a quick switch back; this service has no redis cache
  - name: SPRING_DATA_REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"

  # ── Tenant / schema separation ───────────────────────────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable; set once at initial deploy
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  # some services spell the same switch SCHEMA_SEPARATION_MODE
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: idgen_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: idgen

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
