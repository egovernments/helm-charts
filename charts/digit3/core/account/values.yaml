# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "account"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  # app context-path is /accounts
  context: "accounts"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "account_schema"
    image:
      repository: "account-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "account"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
canonical-api-prefix: "canonical"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
citizen-broker-client-id: "citizen-broker"
smtp-starttls: "true"
smtp-ssl: "false"
smtp-auth: "true"
access-token-lifespan: "14400"
sso-session-idle-timeout: "28800"
sso-session-max-lifespan: "36000"
notify-send-path: "notify/v3/notifications"
temp-password-template-code: "account-tenant-temp-password"
notification-timeout-seconds: "5"
notification-enabled: "true"
platform-auth-enabled: "false"
platform-auth-realm: "master"
platform-auth-required-role: "SUPERADMIN"
signup-enabled: "true"
otp-generate-path: "otp/v3/generate"
otp-verify-path: "otp/v3/verify"
otp-resend-path: "otp/v3/resend"
otp-config-path: "otp/v3/config"
otp-bootstrap-purposes: "login,registration"
otp-timeout-seconds: "10"
pubsub-enabled: "true"
pubsub-type: "kafka"
topic-create-tenant: "account-create-tenant"
topic-update-tenant: "account-update-tenant"
topic-delete-tenant: "account-delete-tenant"
topic-create-tenant-config: "account-create-tenant-config"
topic-update-tenant-config: "account-update-tenant-config"
topic-migration: "account-migration"
log-level: "DEBUG"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: CANONICAL_API_PREFIX
    value: {{ index .Values "canonical-api-prefix" | quote }}

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}

  # ── Keycloak ─────────────────────────────────────────────────────────────
  - name: KEYCLOAK_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-base-url
  - name: KEYCLOAK_PUBLIC_BASE_URL
    value: https://{{ .Values.global.domain }}/keycloak
  # admin creds come from the kc-admin secret the keycloak chart bootstraps from
  - name: KEYCLOAK_ADMIN_USER
    valueFrom:
      secretKeyRef:
        name: kc-admin
        key: username
  - name: KEYCLOAK_ADMIN_PASS
    valueFrom:
      secretKeyRef:
        name: kc-admin
        key: password
  - name: CITIZEN_BROKER_CLIENT_ID
    value: {{ index .Values "citizen-broker-client-id" | quote }}
  - name: CITIZEN_BROKER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: citizen-broker-secret
        key: citizen-broker-client-secret
  - name: EMPLOYEE_IAM_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: employee-iam-secret
        key: employee-iam-client-secret
  - name: CLIENT_REDIRECT_URL
    value: https://{{ .Values.global.domain }}/*
  - name: FIRST_LOGIN_URLS
    value: admin=https://{{ .Values.global.domain }}/license/admin/{realm},employee=https://{{ .Values.global.domain }}/license/employee/{realm},citizen=https://{{ .Values.global.domain }}/license/citizen/{realm}

  # ── SMTP ─────────────────────────────────────────────────────────────────
  - name: SMTP_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: smtp-host
  - name: SMTP_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: smtp-port
  - name: SMTP_STARTTLS
    value: {{ index .Values "smtp-starttls" | quote }}
  - name: SMTP_SSL
    value: {{ index .Values "smtp-ssl" | quote }}
  - name: SMTP_AUTH
    value: {{ index .Values "smtp-auth" | quote }}
  - name: SMTP_FROM_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: mail-sender-name
  - name: SMTP_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword

  # ── Sessions / tokens ────────────────────────────────────────────────────
  - name: ACCESS_TOKEN_LIFESPAN
    value: {{ index .Values "access-token-lifespan" | quote }}
  - name: SSO_SESSION_IDLE_TIMEOUT
    value: {{ index .Values "sso-session-idle-timeout" | quote }}
  - name: SSO_SESSION_MAX_LIFESPAN
    value: {{ index .Values "sso-session-max-lifespan" | quote }}

  # ── Notification (via notify service) ────────────────────────────────────
  - name: NOTIFY_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: notify
        name: egov-service-host
  - name: NOTIFY_SEND_PATH
    value: {{ index .Values "notify-send-path" | quote }}
  - name: NOTIFICATION_PLATFORM_TENANT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: platform-tenant
  - name: NOTIFY_TEMP_PASSWORD_TEMPLATE_CODE
    value: {{ index .Values "temp-password-template-code" | quote }}
  - name: NOTIFICATION_TIMEOUT_SECONDS
    value: {{ index .Values "notification-timeout-seconds" | quote }}
  - name: NOTIFICATION_ENABLED
    value: {{ index .Values "notification-enabled" | quote }}

  # ── Platform auth ────────────────────────────────────────────────────────
  - name: PLATFORM_AUTH_ENABLED
    value: {{ index .Values "platform-auth-enabled" | quote }}
  - name: PLATFORM_AUTH_REALM
    value: {{ index .Values "platform-auth-realm" | quote }}
  - name: PLATFORM_AUTH_REQUIRED_ROLE
    value: {{ index .Values "platform-auth-required-role" | quote }}
  - name: SIGNUP_ENABLED
    value: {{ index .Values "signup-enabled" | quote }}

  # ── OTP ──────────────────────────────────────────────────────────────────
  - name: OTP_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: otp
        name: egov-service-host
  - name: OTP_GENERATE_PATH
    value: {{ index .Values "otp-generate-path" | quote }}
  - name: OTP_VERIFY_PATH
    value: {{ index .Values "otp-verify-path" | quote }}
  - name: OTP_RESEND_PATH
    value: {{ index .Values "otp-resend-path" | quote }}
  - name: OTP_CONFIG_PATH
    value: {{ index .Values "otp-config-path" | quote }}
  - name: OTP_BOOTSTRAP_PURPOSES
    value: {{ index .Values "otp-bootstrap-purposes" | quote }}
  - name: OTP_TIMEOUT_SECONDS
    value: {{ index .Values "otp-timeout-seconds" | quote }}
  - name: OTP_PLATFORM_TENANT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: platform-tenant

  # ── Kafka / PubSub ───────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: {{ index .Values "pubsub-enabled" | quote }}
  - name: PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: PUBSUB_TOPIC_CREATE_TENANT
    value: {{ index .Values "topic-create-tenant" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_TENANT
    value: {{ index .Values "topic-update-tenant" | quote }}
  - name: PUBSUB_TOPIC_DELETE_TENANT
    value: {{ index .Values "topic-delete-tenant" | quote }}
  - name: PUBSUB_TOPIC_CREATE_TENANT_CONFIG
    value: {{ index .Values "topic-create-tenant-config" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_TENANT_CONFIG
    value: {{ index .Values "topic-update-tenant-config" | quote }}
  - name: PUBSUB_TOPIC_MIGRATION
    value: {{ index .Values "topic-migration" | quote }}

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-address
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port

  # ── Logging ──────────────────────────────────────────────────────────────
  - name: LOG_LEVEL
    value: {{ index .Values "log-level" | quote }}

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
