# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "account"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "account"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "account_schema"
    image:
      repository: "account-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "account"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: CONTEXT_PATH
    value: /account
  - name: CANONICAL_API_PREFIX
    value: canonical

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"

  # ── Keycloak ─────────────────────────────────────────────────────────────
  - name: KEYCLOAK_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-base-url
  - name: KEYCLOAK_PUBLIC_BASE_URL
    value: https://{{ .Values.global.domain }}/keycloak
  # admin creds come from the kc-admin secret the keycloak chart bootstraps from
  - name: KEYCLOAK_ADMIN_USER
    valueFrom:
      secretKeyRef:
        name: kc-admin
        key: username
  - name: KEYCLOAK_ADMIN_PASS
    valueFrom:
      secretKeyRef:
        name: kc-admin
        key: password
  - name: CITIZEN_BROKER_CLIENT_ID
    value: citizen-broker
  - name: CITIZEN_BROKER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: citizen-broker-secret
        key: citizen-broker-client-secret
  - name: EMPLOYEE_IAM_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: employee-iam-secret
        key: employee-iam-client-secret
  - name: CLIENT_REDIRECT_URL
    value: https://{{ .Values.global.domain }}/*
  - name: FIRST_LOGIN_URLS
    value: admin=https://{{ .Values.global.domain }}/license/admin/{realm},employee=https://{{ .Values.global.domain }}/license/employee/{realm},citizen=https://{{ .Values.global.domain }}/license/citizen/{realm}

  # ── SMTP ─────────────────────────────────────────────────────────────────
  - name: SMTP_HOST
    value: smtp.gmail.com
  - name: SMTP_PORT
    value: "587"
  - name: SMTP_STARTTLS
    value: "true"
  - name: SMTP_SSL
    value: "false"
  - name: SMTP_AUTH
    value: "true"
  - name: SMTP_FROM_NAME
    value: eGov Foundation
  - name: SMTP_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword

  # ── Sessions / tokens ────────────────────────────────────────────────────
  - name: ACCESS_TOKEN_LIFESPAN
    value: "14400"
  - name: SSO_SESSION_IDLE_TIMEOUT
    value: "28800"
  - name: SSO_SESSION_MAX_LIFESPAN
    value: "36000"

  # ── Notification (email) ─────────────────────────────────────────────────
  - name: NOTIFICATION_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: notification
        name: egov-service-host
  - name: NOTIFICATION_EMAIL_SEND_PATH
    value: notification/v3/email/send
  - name: NOTIFICATION_PLATFORM_TENANT
    value: default
  - name: NOTIFICATION_TEMP_PASSWORD_TEMPLATE_ID
    value: account-tenant-temp-password
  - name: NOTIFICATION_TIMEOUT_SECONDS
    value: "5"
  - name: NOTIFICATION_ENABLED
    value: "true"

  # ── Platform auth ────────────────────────────────────────────────────────
  - name: PLATFORM_AUTH_ENABLED
    value: "false"
  - name: PLATFORM_AUTH_REALM
    value: master
  - name: PLATFORM_AUTH_REQUIRED_ROLE
    value: SUPERADMIN
  - name: SIGNUP_ENABLED
    value: "true"

  # ── OTP ──────────────────────────────────────────────────────────────────
  - name: OTP_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: otp
        name: egov-service-host
  - name: OTP_GENERATE_PATH
    value: otp/v3/generate
  - name: OTP_VERIFY_PATH
    value: otp/v3/verify
  - name: OTP_RESEND_PATH
    value: otp/v3/resend
  - name: OTP_CONFIG_PATH
    value: otp/v3/config
  - name: OTP_BOOTSTRAP_PURPOSES
    value: login,registration
  - name: OTP_TIMEOUT_SECONDS
    value: "10"
  - name: OTP_PLATFORM_TENANT
    value: default

  # ── Kafka / PubSub ───────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: PUBSUB_TOPIC_CREATE_TENANT
    value: account-create-tenant
  - name: PUBSUB_TOPIC_UPDATE_TENANT
    value: account-update-tenant
  - name: PUBSUB_TOPIC_DELETE_TENANT
    value: account-delete-tenant
  - name: PUBSUB_TOPIC_CREATE_TENANT_CONFIG
    value: account-create-tenant-config
  - name: PUBSUB_TOPIC_UPDATE_TENANT_CONFIG
    value: account-update-tenant-config
  - name: PUBSUB_TOPIC_MIGRATION
    value: account-migration

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    value: redis.backbone.svc.cluster.local:6379
  - name: REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: REDIS_PORT
    value: "6379"

  # ── Logging ──────────────────────────────────────────────────────────────
  - name: LOG_LEVEL
    value: DEBUG

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
