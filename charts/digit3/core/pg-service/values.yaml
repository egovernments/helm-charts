# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "digit-pg-service"
  group: "core"

# ── Service config ──────────────────────────────────────────────────────────────
# Seeded system user UUID for payment reconciliation. Install-specific; override per env.
reconciliationSystemUserUuid: "b405e4d0-99ec-41b1-92e7-2ebda0321e0d"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "pg-service"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# DB migration runs in an init container; app-boot Flyway is off (SPRING_FLYWAY_ENABLED=false below).
# History table pg_service_schema matches migrate.sh's -table setting and spring.flyway.table.
# The image lays scripts out as /flyway/sql/migration + /flyway/sql/quartz; FLYWAY_LOCATIONS must
# resolve to the /flyway/sql root. Quartz stays separate so app-side tenant migration never picks up
# the framework tables (those belong in public only).
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "pg_service_schema"
    image:
      repository: "pg-service-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "pg-service"
replicas: "1"
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Payment gateways ──────────────────────────────────────────────────────────
# A gateway is advertised by /gateway/v3/_search only when its <gateway>.active is true
# AND its credentials resolve. Set the matching secret keys in egov-pg-service before flipping one on.
axis: false
payu: false
paytm: false
phonepe: false
stripe: true
payu-url: ""
payu-url-status: ""
java-args: "-Dspring.profiles.active=monitoring"
java-debug: "true"

# ── App config (overridable per env) ──────────────────────────────────────────
flyway-enabled: "false"
canonical-path: "canonical"
reconcile-interval-mins: "15"
message-broker-enabled: "false"
topic-create-txn: "create-pg-txn"
topic-update-txn: "update-pg-txn"
pubsub-type: "kafka"
idgen-generate-path: "idgen/v3/generate"
idgen-txn-template-code: "TxnID"
billing-payments-create-path: "billing/v3/payments"
billing-payments-validate-path: "billing/v3/payments/validate"
registry-data-search-path: "registry/v3/{schemaCode}/data/_search"
registry-bank-account-schema: "bank-account"
individual-create-path: "individual/v3/individuals"
individual-search-path: "individual/v3/individuals"
user-create-enabled: "false"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
tenant-migration-consumer-group: "pg-service"
stripe-currency: "inr"
axis-currency: "INR"
axis-locale: "en_IN"
axis-vpc-version: "1"
axis-vpc-command-pay: "pay"
axis-vpc-command-status: "queryDR"
axis-url-debit: "https://migs.mastercard.co.in/vpcpay"
axis-url-status: "https://migs.mastercard.co.in/vpcdps"
tracing-export-enabled: "false"
metrics-export-enabled: "false"
management-endpoints-exposure: "health,info"
tracing-sampling-probability: "1.0"
log-level: "DEBUG"

# ── Container env ─────────────────────────────────────────────────────────────
# Configured through Spring properties (relaxed env binding); topic properties are messaging.broker.topic.*
# (MESSAGING_...), not message.broker.topic.*.
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}

  # ── Datasource ────────────────────────────────────────────────────────
  # Migration is handled by the init container above - app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: {{ index .Values "flyway-enabled" | quote }}

  # ── Canonical API ─────────────────────────────────────────────────────
  # path segment of the canonical twins: /transaction/v3/{segment}/_create, etc.
  - name: PG_SERVICE_CANONICAL_PATH
    value: {{ index .Values "canonical-path" | quote }}

  # ── Reconciliation ────────────────────────────────────────────────────
  # Quartz jobs; tables live in public with the eg_pg_qrtz_ prefix
  - name: PG_EARLYRECONCILEJOBRUNINTERVAL_MINS
    value: {{ index .Values "reconcile-interval-mins" | quote }}
  - name: PG_RECONCILIATION_SYSTEM_USER_UUID
    value: {{ .Values.reconciliationSystemUserUuid | quote }}

  # ── Transaction events ────────────────────────────────────────────────
  - name: MESSAGE_BROKER_ENABLED
    value: {{ index .Values "message-broker-enabled" | quote }}
  - name: MESSAGING_BROKER_TOPIC_CREATE_TXN
    value: {{ index .Values "topic-create-txn" | quote }}
  - name: MESSAGING_BROKER_TOPIC_UPDATE_TXN
    value: {{ index .Values "topic-update-txn" | quote }}

  # ── Messaging backend ─────────────────────────────────────────────────
  # kafka is required, not a preference - account publishes account-migration to kafka only
  - name: TRACER_PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Internal service clients ──────────────────────────────────────────
  # hosts end with "/", paths are relative
  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_GENERATE_ID_PATH
    value: {{ index .Values "idgen-generate-path" | quote }}
  - name: IDGEN_TXN_ID_TEMPLATE_CODE
    value: {{ index .Values "idgen-txn-template-code" | quote }}
  - name: BILLING_HOST
    valueFrom:
      configMapKeyRef:
        key: billing
        name: egov-service-host
  - name: BILLING_PAYMENTS_CREATE_PATH
    value: {{ index .Values "billing-payments-create-path" | quote }}
  - name: BILLING_PAYMENTS_VALIDATE_PATH
    value: {{ index .Values "billing-payments-validate-path" | quote }}
  # registry is read only by the AXIS bank-account lookup
  - name: REGISTRY_HOST
    valueFrom:
      configMapKeyRef:
        key: registry
        name: egov-service-host
  - name: REGISTRY_DATA_SEARCH_PATH
    value: {{ index .Values "registry-data-search-path" | quote }}
  - name: REGISTRY_BANK_ACCOUNT_SCHEMA
    value: {{ index .Values "registry-bank-account-schema" | quote }}
  - name: INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: INDIVIDUAL_CREATE_PATH
    value: {{ index .Values "individual-create-path" | quote }}
  - name: INDIVIDUAL_SEARCH_PATH
    value: {{ index .Values "individual-search-path" | quote }}
  - name: PG_IS_USER_CREATE_ENABLED
    value: {{ index .Values "user-create-enabled" | quote }}

  # ── Per-tenant schemas ────────────────────────────────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above; set once at initial deployment
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  # some services spell the same switch SCHEMA_SEPARATION_MODE
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: {{ index .Values "tenant-migration-consumer-group" | quote }}

  # ── Payment gateways ──────────────────────────────────────────────────
  # secrets come from the existing egov-pg-service secret; the reference chart's key names are reused
  {{- if .Values.stripe }}
  - name: STRIPE_ACTIVE
    value: "true"
  - name: STRIPE_CURRENCY
    value: {{ index .Values "stripe-currency" | quote }}
  # from egov-pg-service (cluster-configs.secrets.egov-pg-service.stripe-secret-key in sops); optional, so a
  # cluster without the key still starts and Stripe simply fails at checkout
  - name: STRIPE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: stripe-secret-key
        optional: true
  {{- else }}
  - name: STRIPE_ACTIVE
    value: "false"
  {{- end }}
  {{- if .Values.axis }}
  - name: AXIS_ACTIVE
    value: "true"
  - name: AXIS_CURRENCY
    value: {{ index .Values "axis-currency" | quote }}
  - name: AXIS_LOCALE
    value: {{ index .Values "axis-locale" | quote }}
  - name: AXIS_MERCHANT_VPC_VERSION
    value: {{ index .Values "axis-vpc-version" | quote }}
  - name: AXIS_MERCHANT_VPC_COMMAND_PAY
    value: {{ index .Values "axis-vpc-command-pay" | quote }}
  - name: AXIS_MERCHANT_VPC_COMMAND_STATUS
    value: {{ index .Values "axis-vpc-command-status" | quote }}
  - name: AXIS_URL_DEBIT
    value: {{ index .Values "axis-url-debit" | quote }}
  - name: AXIS_URL_STATUS
    value: {{ index .Values "axis-url-status" | quote }}
  - name: AXIS_MERCHANT_ID
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: axismerchantid
  - name: AXIS_MERCHANT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: axismerchantsecret
  - name: AXIS_MERCHANT_USER
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: axismerchantuser
  - name: AXIS_MERCHANT_PWD
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: axismerchantpwd
  - name: AXIS_MERCHANT_ACCESS_CODE
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: axismerchantaccesscode
  {{- else }}
  - name: AXIS_ACTIVE
    value: "false"
  {{- end }}
  {{- if .Values.payu }}
  - name: PAYU_ACTIVE
    value: "true"
  - name: PAYU_URL
    value: {{ index .Values "payu-url" | quote }}
  - name: PAYU_URL_STATUS
    value: {{ index .Values "payu-url-status" | quote }}
  - name: PAYU_MERCHANT_KEY
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: payumerchantkey
  - name: PAYU_MERCHANT_SALT
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: payumerchantsalt
  {{- else }}
  - name: PAYU_ACTIVE
    value: "false"
  {{- end }}
  {{- if .Values.paytm }}
  - name: PAYTM_ACTIVE
    value: "true"
  - name: PAYTM_MERCHANT_ID
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: paytmmerchantid
  - name: PAYTM_MERCHANT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: paytmmerchantsecret
  {{- else }}
  - name: PAYTM_ACTIVE
    value: "false"
  {{- end }}
  {{- if .Values.phonepe }}
  - name: PHONEPE_ACTIVE
    value: "true"
  - name: PHONEPE_MERCHANT_ID
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: phonepemerchantid
  - name: PHONEPE_MERCHANT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: phonepemerchantsecret
  - name: PHONEPE_MERCHANT_SECRET_INDEX
    valueFrom:
      secretKeyRef:
        name: egov-pg-service
        key: phonepemerchantsecretindex
  {{- else }}
  - name: PHONEPE_ACTIVE
    value: "false"
  {{- end }}

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
    value: {{ index .Values "metrics-export-enabled" | quote }}
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: {{ index .Values "management-endpoints-exposure" | quote }}
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: {{ index .Values "tracing-sampling-probability" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint

  # ── Logging ───────────────────────────────────────────────────────────
  - name: LOGGING_LEVEL_ORG_EGOV_PG
    value: {{ index .Values "log-level" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: JAVA_ENABLE_DEBUG
    value: {{ index .Values "java-debug" | quote }}
