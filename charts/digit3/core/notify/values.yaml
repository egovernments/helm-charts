# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "notify"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "notify"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "notify_schema"
    image:
      repository: "notify-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "notify"
replicas: "1"
appType: "java"

# OTel span export switch; override per env via the notify block in environments/<env>.yaml
tracing-export-enabled: "false"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
gmail-from-name: "eGov Foundation"
smscountry-api-url: "http://api.smscountry.com/SMSCwebservice_bulk.aspx"
# Optional; left blank, the gateway applies the registered sender header
smscountry-sender-id: ""

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1.5Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  # entrypoint is an explicit `java -jar`, so JAVA_OPTS is never expanded
  - name: JAVA_TOOL_OPTIONS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /notify
  - name: APP_TIMEZONE
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: timezone
  - name: LOGGING_LEVEL_ORG_DIGIT_NOTIFY
    value: INFO

  # ── Datasource ───────────────────────────────────────────────────────────
  - name: SPRING_FLYWAY_ENABLED
    value: "false"

  # ── Providers (email / SMS) ──────────────────────────────────────────────
  # jars are baked into the image; nothing is mounted at /providers (a volume would hide them)
  - name: NOTIFY_PLUGINS_DIR
    value: /providers
  # each provider reads its own credentials at startup; host/port/content-type are fixed in the jars
  - name: GMAIL_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: GMAIL_APP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword
  - name: GMAIL_FROM_NAME
    value: {{ index .Values "gmail-from-name" | quote }}
  - name: SMSCOUNTRY_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-sms
        key: username
  - name: SMSCOUNTRY_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-sms
        key: password
  - name: SMSCOUNTRY_API_URL
    value: {{ index .Values "smscountry-api-url" | quote }}
  - name: SMSCOUNTRY_SENDER_ID
    value: {{ index .Values "smscountry-sender-id" | quote }}

  # ── Management / actuator ────────────────────────────────────────────────
  # base-path `/` puts the actuator endpoints under the servlet context path, where the probes look
  - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
    value: "/"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: PUBSUB_TYPE
    value: kafka
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_CONSUMER_GROUP
    value: notify-service

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"

  # ── Tenant / schema separation ───────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: notify_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: notify-service

  # ── Notification topics ──────────────────────────────────────────────────
  - name: NOTIFY_TOPIC_SEND_ENABLED
    value: "true"

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
