# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "apportion"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "apportion"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# History table keeps the legacy egov-apportion name; do NOT ship new migrations
# while egov-apportion-service is still deployed (shared Flyway history).
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "apportion_schema"
    image:
      repository: "apportion-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "apportion"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  # true: skip tax-head order validation, use order as equal-amount tie-break
  - name: APPORTION_VALUE_ORDER
    value: "true"
  # keep OFF until billing's payment module can absorb the advance row
  - name: APPORTION_ENABLE_ADVANCE
    value: "false"

  # ── Datasource ───────────────────────────────────────────────────────────
  # migration handled by the init container above - app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: "false"

  # ── tenant-migration ─────────────────────────────────────────────────────
  # schema-table must equal the init container's SCHEMA_TABLE
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: apportion
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers

  # ── Internal service clients ─────────────────────────────────────────────
  - name: APPORTION_BILLING_HOST
    valueFrom:
      configMapKeyRef:
        key: billing
        name: egov-service-host
  - name: APPORTION_BILLING_TAX_HEADS_PATH
    value: billing/v3/tax-heads

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: "1.0"
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
