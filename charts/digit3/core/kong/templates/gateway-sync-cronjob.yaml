{{- if .Values.gatewaySync.enabled }}
{{- $gs := .Values.gatewaySync }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "kong.fullname" . }}-gateway-sync
  namespace: {{ template "kong.namespace" . }}
  labels:
    {{- include "kong.metaLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-sync
spec:
  schedule: {{ $gs.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "kong.metaLabels" . | nindent 12 }}
            app.kubernetes.io/component: gateway-sync
        spec:
          serviceAccountName: {{ template "kong.fullname" . }}-gateway-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: reconciler
              image: {{ $gs.image.repository }}:{{ $gs.image.tag }}
              imagePullPolicy: {{ $gs.image.pullPolicy }}
              command: ["python3", "/etc/gateway-sync/gateway-sync-reconcile.py"]
              env:
                - name: CONFIG_PATH
                  value: /etc/gateway-sync/config.json
              volumeMounts:
                - name: config
                  mountPath: /etc/gateway-sync
                  readOnly: true
              resources:
                {{- toYaml $gs.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ template "kong.fullname" . }}-gateway-sync
{{- end }}
