{{- if and .Values.gatewaySync.enabled .Values.gatewaySync.runOnInstall }}
{{- $gs := .Values.gatewaySync }}
# One-shot reconcile on deploy so routes exist immediately, without waiting for the
# first CronJob tick. Runs the same script as the CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "kong.fullname" . }}-gateway-sync-init
  namespace: {{ template "kong.namespace" . }}
  labels:
    {{- include "kong.metaLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "kong.metaLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-sync
    spec:
      serviceAccountName: {{ template "kong.fullname" . }}-gateway-sync
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: reconciler
          image: {{ $gs.image.repository }}:{{ $gs.image.tag }}
          imagePullPolicy: {{ $gs.image.pullPolicy }}
          command: ["python3", "/etc/gateway-sync/gateway-sync-reconcile.py"]
          env:
            - name: CONFIG_PATH
              value: /etc/gateway-sync/config.json
            - name: DRY_RUN
              value: {{ $gs.dryRun | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/gateway-sync
              readOnly: true
          resources:
            {{- toYaml $gs.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ template "kong.fullname" . }}-gateway-sync
{{- end }}
