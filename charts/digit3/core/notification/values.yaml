# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "notification"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "notification"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "notification_schema"
    image:
      repository: "notification-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "notification"
replicas: "1"
appType: "java"

# OTel span export switch; override per env via the notification block in environments/<env>.yaml
tracing-export-enabled: "false"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: HTTP_PORT
    value: "8080"

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: SCHEMA_SEPARATION_TOPIC
    value: account-migration

  # ── App-level migrations ─────────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: classpath:db/migration  # jar-embedded migrations
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: notification_schema

  # ── External services ────────────────────────────────────────────────────
  - name: TEMPLATE_CONFIG_HOST
    valueFrom:
      configMapKeyRef:
        key: template-config
        name: egov-service-host
  - name: TEMPLATE_CONFIG_PATH
    value: template-config/v3/render
  - name: FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        key: filestore
        name: egov-service-host
  - name: FILESTORE_PATH
    value: filestore/v3/files

  # ── Email (SMTP) ─────────────────────────────────────────────────────────
  - name: SMTP_HOST
    value: smtp.gmail.com
  - name: SMTP_PORT
    value: "587"
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef:
        key: mailsenderusername
        name: egov-notification-mail
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        key: mailsenderpassword
        name: egov-notification-mail
  - name: SMTP_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        key: mailsenderusername
        name: egov-notification-mail
  - name: SMTP_FROM_NAME
    value: eGov Foundation

  # ── SMS ──────────────────────────────────────────────────────────────────
  - name: SMS_PROVIDER_URL
    value: http://api.smscountry.com/SMSCwebservice_bulk.aspx
  - name: SMS_PROVIDER_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: egov-notification-sms
  - name: SMS_PROVIDER_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: egov-notification-sms
  - name: SMS_PROVIDER_CONTENT_TYPE
    value: application/x-www-form-urlencoded

  # ── Message broker ───────────────────────────────────────────────────────
  - name: MESSAGE_BROKER_ENABLED
    value: "true"
  - name: MESSAGE_BROKER_TYPE
    value: KAFKA

  # ── Kafka ────────────────────────────────────────────────────────────────
  # tracer reads spring.kafka.bootstrap-servers; not mapped from KAFKA_BROKERS
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: KAFKA_BROKERS
    value: release-name-kafka-controller-headless.kafka-kraft:9092
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: "true"
  - name: KAFKA_PARTITION_COUNT
    value: "1"
  - name: KAFKA_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CONSUMER_GROUP
    value: notification-service

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"

  # ── Notification topics ──────────────────────────────────────────────────
  - name: PUBSUB_TOPIC_CREATE_TEMPLATE
    value: notification-create-template
  - name: PUBSUB_TOPIC_UPDATE_TEMPLATE
    value: notification-update-template
  - name: PUBSUB_TOPIC_DELETE_TEMPLATE
    value: notification-delete-template
  - name: PUBSUB_TOPIC_SEND_EMAIL
    value: notification-send-email
  - name: PUBSUB_TOPIC_SEND_SMS
    value: notification-send-sms
  - name: EMAIL_TOPIC
    value: notification-email
  - name: SMS_TOPIC
    value: notification-sms

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    value: redis.backbone.svc.cluster.local:6379
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"
  - name: REDIS_CONSUMER_GROUP
    value: notification-service
  - name: REDIS_CONSUMER_ID
    value: notification-service-1
  - name: REDIS_RETENTION_DAYS
    value: "7"
  - name: REDIS_MAX_STREAM_LENGTH
    value: "1000000"
  - name: REDIS_CLEANUP_INTERVAL
    value: "86400"

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: OTEL_ENABLED
    value: "false"
  - name: OTEL_SERVICE_NAME
    value: notification
  - name: OTEL_SERVICE_VERSION
    value: 1.0.0
  - name: OTEL_METRICS_ENABLED
    value: "true"
  - name: PROMETHEUS_PORT
    value: "9090"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
