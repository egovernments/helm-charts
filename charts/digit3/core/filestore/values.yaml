# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "digit-filestore"
  group: "core"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "filestore_schema"
    image:
      repository: "filestore-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "filestore"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "filestore"
replicas: "1"
appType: "java"
heap: "-Xmx256m -Xms256m"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: true

# storage backend (in-cluster MinIO / S3)
is-bucket-fixed: "true"
fixed-bucketname: "unified-dev-bucket-s3"
file-storage-mount-path: "/filestore"
is-nfs-enabled: false
is-s3-enabled: true
minio-enabled: true

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── persistence ───────────────────────────────────────────────────────────────
persistence:
  enabled: false

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: SERVER_PORT
    value: "8080"

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: SCHEMA_SEPARATION_TOPIC
    value: account-migration

  # ── App-level migrations ─────────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: classpath:db/migration  # jar-embedded migrations
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: filestore_schema

  # ── Storage (S3 / MinIO) ─────────────────────────────────────────────────
  # S3 backend = in-cluster MinIO (backbone ns); creds from the `minio` secret
  - name: MINIO_USE_SSL
    value: "false"
  - name: S3_BUCKET
    value: unified-dev-bucket-s3
  - name: S3_READ_BUCKET
    value: unified-dev-bucket-s3
  - name: S3_USE_SSL
    value: "false"
  - name: S3_REGION
    value: ap-south-1
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: accesskey
        name: minio
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        key: secretkey
        name: minio
  - name: S3_SOURCE
    value: s3
  - name: S3_ENDPOINT
    value: minio.backbone.svc.cluster.local:9000

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: "true"
  - name: KAFKA_PARTITION_COUNT
    value: "1"
  - name: KAFKA_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CONSUMER_GROUP
    value: filestore-service

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: PUBSUB_TOPIC_UPLOAD_FILE
    value: filestore-upload-file
  - name: PUBSUB_TOPIC_CREATE_DOC_CATEGORY
    value: filestore-create-doc-category
  - name: PUBSUB_TOPIC_UPDATE_DOC_CATEGORY
    value: filestore-update-doc-category
  - name: PUBSUB_TOPIC_DELETE_DOC_CATEGORY
    value: filestore-delete-doc-category

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    value: redis.backbone.svc.cluster.local:6379
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"
  - name: REDIS_CONSUMER_GROUP
    value: filestore-service
  - name: REDIS_CONSUMER_ID
    value: filestore-service-1
  - name: REDIS_RETENTION_DAYS
    value: "7"
  - name: REDIS_MAX_STREAM_LENGTH
    value: "1000000"
  - name: REDIS_CLEANUP_INTERVAL
    value: "86400"

  # ── Logging ──────────────────────────────────────────────────────────────
  - name: CONSOLE_LOGS_ENABLED
    value: "true"

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: OTEL_ENABLED
    value: "true"
  - name: OTEL_SERVICE_NAME
    value: filestore
  - name: OTEL_SERVICE_VERSION
    value: 1.0.0
  - name: OTEL_METRICS_ENABLED
    value: "true"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318
  - name: PROMETHEUS_PORT
    value: "9090"
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
