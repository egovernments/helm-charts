# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "individual"
  group: "core"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "individual"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "individual_schema"
    image:
      repository: "individual-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "individual"
replicas: 1
appType: "java"

# OTel span export switch; override per env via the individual block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
# Vault PII encryption: flip per environment (the env block sets it)
vault-enabled: "false"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
canonical-api-prefix: "canonical"
log-level: "DEBUG"
idgen-path: "idgen/v3/generate"
idgen-enabled: "true"
idgen-id-format: "individual"
pubsub-enabled: "true"
pubsub-type: "kafka"
topic-create-individual: "individual-create-individual"
topic-update-individual: "individual-update-individual"
topic-delete-individual: "individual-delete-individual"
topic-upsert-config: "individual-upsert-config"
redis-db: "0"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
tenant-migration-consumer-group: "individual-service"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: CANONICAL_API_PREFIX
    value: {{ index .Values "canonical-api-prefix" | quote }}
  - name: LOG_LEVEL
    value: {{ index .Values "log-level" | quote }}

  # ── External services ────────────────────────────────────────────────────
  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_PATH
    value: {{ index .Values "idgen-path" | quote }}
  - name: IDGEN_ENABLED
    value: {{ index .Values "idgen-enabled" | quote }}
  - name: IDGEN_INDIVIDUAL_ID_FORMAT
    value: {{ index .Values "idgen-id-format" | quote }}

  # ── Vault / PII encryption ───────────────────────────────────────────────
  - name: VAULT_HOST
    valueFrom:
      configMapKeyRef:
        key: vault
        name: egov-service-host
  - name: VAULT_ROLE_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: role-id
        optional: true
  - name: VAULT_SECRET_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: secret-id
        optional: true
  - name: VAULT_ENABLED
    value: {{ index .Values "vault-enabled" | quote }}
  - name: HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: hmac-secret
        key: hmac-secret
        optional: true

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: {{ index .Values "pubsub-enabled" | quote }}
  - name: PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: PUBSUB_TOPIC_CREATE_INDIVIDUAL
    value: {{ index .Values "topic-create-individual" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_INDIVIDUAL
    value: {{ index .Values "topic-update-individual" | quote }}
  - name: PUBSUB_TOPIC_DELETE_INDIVIDUAL
    value: {{ index .Values "topic-delete-individual" | quote }}
  - name: PUBSUB_TOPIC_UPSERT_CONFIG
    value: {{ index .Values "topic-upsert-config" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: {{ index .Values "redis-db" | quote }}

  # ── Tenant / schema separation ───────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  # some services spell the same switch SCHEMA_SEPARATION_MODE
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: {{ index .Values "tenant-migration-consumer-group" | quote }}

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
