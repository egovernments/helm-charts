# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "individual"
  group: "core"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "individual"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "individual_schema"
    image:
      repository: "individual-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "individual"
replicas: 1
appType: "java"

# OTel span export switch; override per env via the individual block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
# Vault PII encryption: flip per environment (the env block sets it)
vault-enabled: "false"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_CONTEXT_PATH
    value: /individual
  - name: CANONICAL_API_PREFIX
    value: canonical
  - name: LOG_LEVEL
    value: DEBUG

  # ── External services ────────────────────────────────────────────────────
  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_PATH
    value: idgen/v3/generate
  - name: IDGEN_ENABLED
    value: "true"
  - name: IDGEN_INDIVIDUAL_ID_FORMAT
    value: individual

  # ── Vault / PII encryption ───────────────────────────────────────────────
  - name: VAULT_HOST
    valueFrom:
      configMapKeyRef:
        key: vault
        name: egov-service-host
  - name: VAULT_ROLE_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: role-id
        optional: true
  - name: VAULT_SECRET_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: secret-id
        optional: true
  - name: VAULT_ENABLED
    value: {{ index .Values "vault-enabled" | quote }}
  - name: HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: hmac-secret
        key: hmac-secret
        optional: true

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: PUBSUB_TOPIC_CREATE_INDIVIDUAL
    value: individual-create-individual
  - name: PUBSUB_TOPIC_UPDATE_INDIVIDUAL
    value: individual-update-individual
  - name: PUBSUB_TOPIC_DELETE_INDIVIDUAL
    value: individual-delete-individual
  - name: PUBSUB_TOPIC_UPSERT_CONFIG
    value: individual-upsert-config

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"

  # ── Tenant / schema separation ───────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  # some services spell the same switch SCHEMA_SEPARATION_MODE
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: individual-service

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
