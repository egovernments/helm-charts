# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "template-config"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "template-config"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# DB migration runs in an init container; app-boot Flyway is off (SPRING_FLYWAY_ENABLED=false below).
# History table template_config_schema matches migrate.sh's -table setting.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "template_config_schema"
    image:
      repository: "template-config-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "template-config"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
tracing-enabled: false

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
flyway-enabled: "false"
events-enabled: "false"
topic-create: "template-config-create-template-config"
topic-update: "template-config-update-template-config"
topic-delete: "template-config-delete-template-config"
pubsub-type: "kafka"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
tenant-migration-consumer-group: "template-config"
tracing-export-enabled: "false"
metrics-export-enabled: "false"
management-exposure-include: "health,info"
tracing-sampling-probability: "1.0"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
# Service configured through Spring properties (relaxed env binding), not the Go service's env var names.
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── Datasource ────────────────────────────────────────────────────────
  # Migration is handled by the init container above - app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: {{ index .Values "flyway-enabled" | quote }}

  # ── Lifecycle events ──────────────────────────────────────────────────
  # fire-and-forget; same posture as the Go chart: disabled
  - name: TEMPLATE_CONFIG_EVENTS_ENABLED
    value: {{ index .Values "events-enabled" | quote }}
  - name: TEMPLATE_CONFIG_TOPICS_CREATE
    value: {{ index .Values "topic-create" | quote }}
  - name: TEMPLATE_CONFIG_TOPICS_UPDATE
    value: {{ index .Values "topic-update" | quote }}
  - name: TEMPLATE_CONFIG_TOPICS_DELETE
    value: {{ index .Values "topic-delete" | quote }}

  # ── Kafka ─────────────────────────────────────────────────────────────
  # account publishes account-migration to kafka, so tenant-migration below requires this backend
  - name: TRACER_PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config

  # ── Tenant / schema separation ────────────────────────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above; set once at initial deployment
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: {{ index .Values "tenant-migration-consumer-group" | quote }}

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: {{ index .Values "metrics-export-enabled" | quote }}
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: {{ index .Values "management-exposure-include" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: {{ index .Values "tracing-sampling-probability" | quote }}
