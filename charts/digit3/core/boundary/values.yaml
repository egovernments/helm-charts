# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "boundary"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "boundary"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "boundary_schema"
    image:
      repository: "boundary-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "boundary"
replicas: 1
appType: "java"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: true

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
boundary-basepath: "http://boundary:8080/"
cache-type: "inmemory"
filestore-endpoint: "/filestore/v1/files"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
schema-separation-topic: "account-migration"
migration-locations: "classpath:db/migration"
kafka-auto-create-topics: "true"
kafka-partitions: "1"
kafka-replication-factor: "1"
kafka-consumer-group: "boundary-service"
pubsub-enabled: "true"
pubsub-type: "kafka"
topic-create-boundary: "boundary-create-boundary"
topic-update-boundary: "boundary-update-boundary"
topic-delete-boundary: "boundary-delete-boundary"
topic-create-boundary-hierarchy: "boundary-create-boundary-hierarchy"
topic-update-boundary-hierarchy: "boundary-update-boundary-hierarchy"
topic-delete-boundary-hierarchy: "boundary-delete-boundary-hierarchy"
topic-create-boundary-relationship: "boundary-create-boundary-relationship"
topic-update-boundary-relationship: "boundary-update-boundary-relationship"
topic-delete-boundary-relationship: "boundary-delete-boundary-relationship"
redis-db: "0"
redis-consumer-group: "boundary-service"
redis-consumer-id: "boundary-service-1"
redis-retention-days: "7"
redis-max-stream-length: "1000000"
redis-cleanup-interval: "86400"
otel-enabled: "true"
otel-service-name: "boundary"
otel-service-version: "1.0.0"
otel-metrics-enabled: "true"
otel-sampler-arg: "1.0"
prometheus-port: "9090"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  # app reads HTTP_PORT, not SERVER_PORT
  - name: HTTP_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: BOUNDARY_BASEPATH
    value: {{ index .Values "boundary-basepath" | quote }}
  - name: CACHE_TYPE
    value: {{ index .Values "cache-type" | quote }}

  # ── Filestore ────────────────────────────────────────────────────────────
  - name: FILESTORE_BASEPATH
    valueFrom:
      configMapKeyRef:
        key: filestore
        name: egov-service-host
  - name: FILESTORE_ENDPOINT
    value: {{ index .Values "filestore-endpoint" | quote }}

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: SCHEMA_SEPARATION_TOPIC
    value: {{ index .Values "schema-separation-topic" | quote }}

  # ── App-level migrations ─────────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: {{ index .Values "migration-locations" | quote }}
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: {{ index .Values "kafka-auto-create-topics" | quote }}
  - name: KAFKA_PARTITION_COUNT
    value: {{ index .Values "kafka-partitions" | quote }}
  - name: KAFKA_REPLICATION_FACTOR
    value: {{ index .Values "kafka-replication-factor" | quote }}
  - name: KAFKA_CONSUMER_GROUP
    value: {{ index .Values "kafka-consumer-group" | quote }}

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: {{ index .Values "pubsub-enabled" | quote }}
  - name: PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: PUBSUB_TOPIC_CREATE_BOUNDARY
    value: {{ index .Values "topic-create-boundary" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_BOUNDARY
    value: {{ index .Values "topic-update-boundary" | quote }}
  - name: PUBSUB_TOPIC_DELETE_BOUNDARY
    value: {{ index .Values "topic-delete-boundary" | quote }}
  - name: PUBSUB_TOPIC_CREATE_BOUNDARY_HIERARCHY
    value: {{ index .Values "topic-create-boundary-hierarchy" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_BOUNDARY_HIERARCHY
    value: {{ index .Values "topic-update-boundary-hierarchy" | quote }}
  - name: PUBSUB_TOPIC_DELETE_BOUNDARY_HIERARCHY
    value: {{ index .Values "topic-delete-boundary-hierarchy" | quote }}
  - name: PUBSUB_TOPIC_CREATE_BOUNDARY_RELATIONSHIP
    value: {{ index .Values "topic-create-boundary-relationship" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_BOUNDARY_RELATIONSHIP
    value: {{ index .Values "topic-update-boundary-relationship" | quote }}
  - name: PUBSUB_TOPIC_DELETE_BOUNDARY_RELATIONSHIP
    value: {{ index .Values "topic-delete-boundary-relationship" | quote }}

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-address
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: {{ index .Values "redis-db" | quote }}
  - name: REDIS_CONSUMER_GROUP
    value: {{ index .Values "redis-consumer-group" | quote }}
  - name: REDIS_CONSUMER_ID
    value: {{ index .Values "redis-consumer-id" | quote }}
  - name: REDIS_RETENTION_DAYS
    value: {{ index .Values "redis-retention-days" | quote }}
  - name: REDIS_MAX_STREAM_LENGTH
    value: {{ index .Values "redis-max-stream-length" | quote }}
  - name: REDIS_CLEANUP_INTERVAL
    value: {{ index .Values "redis-cleanup-interval" | quote }}

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: OTEL_ENABLED
    value: {{ index .Values "otel-enabled" | quote }}
  - name: OTEL_SERVICE_NAME
    value: {{ index .Values "otel-service-name" | quote }}
  - name: OTEL_SERVICE_VERSION
    value: {{ index .Values "otel-service-version" | quote }}
  - name: OTEL_METRICS_ENABLED
    value: {{ index .Values "otel-metrics-enabled" | quote }}
  - name: OTEL_TRACES_SAMPLER_ARG
    value: {{ index .Values "otel-sampler-arg" | quote }}
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-exporter-otlp-endpoint
  - name: PROMETHEUS_PORT
    value: {{ index .Values "prometheus-port" | quote }}
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
