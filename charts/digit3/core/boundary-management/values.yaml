# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "boundary-management"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
# Exposes https://<domain>/boundary-management/* ; the app mounts its router on
# CONTEXT_PATH (/boundary-management), so the path is passed through unchanged.
ingress:
  enabled: true
  gateway: true
  context: "boundary-management"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# migrate.sh loops over SCHEMA_NAME (comma separated) appending ?currentSchema=;
# SCHEMA_NAME is mandatory - unset, the loop runs zero times and nothing migrates.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "boundary_management_schema"
    image:
      repository: "boundary-management-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "SCHEMA_NAME"
          value: {{ .Values.dbSchema | default "public" | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "boundary-management"
replicas: 1
# Node.js app: no appType so the common chart does not inject the Spring env block.
appType: ""
tracing-enabled: false

healthChecks:
  # the service exposes no dedicated health route yet
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

# Node heap is capped at 2048 MB by the image, so the memory limit must sit above it.
resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "2.5Gi"

# ── Per-environment overrides ─────────────────────────────────────────────────
# Referenced from the env block below so an environment can tune them without
# re-declaring the whole env string.
dbSchema: "public"
logLevel: "info"
maxDebugChar: "1000"
defaultLocale: "en_IN"
# tenant used when a request carries no X-Tenant-Id (optional)
defaultTenantId: ""
# filestore document category uploads are filed under; must exist for the tenant
filestoreModule: "boundary"
# must not exceed the boundary service's BULK_RELATIONSHIP_MAX_SIZE (1000)
bulkRelationshipChunkSize: "1000"

# ── App config (overridable per env) ──────────────────────────────────────────
digit-client-id: "boundary-management"
localization-module: "hcm-admin-schemas"
db-ssl: "false"
persistence-mode: "db"
bulk-relationship-enabled: "true"
confirm-parent-enabled: "false"

# ── Container env ─────────────────────────────────────────────────────────────
# Defaults in src/server/config/index.ts already target the digit3 paths, so only
# hosts are set here. Job status rows go straight to Postgres (PERSISTENCE_MODE=db).
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: APP_PORT
    value: {{ .Values.httpPort | quote }}
  - name: APP_LOG_LEVEL
    value: {{ .Values.logLevel | quote }}
  - name: APP_MAX_DEBUG_CHAR
    value: {{ .Values.maxDebugChar | quote }}
  - name: EGOV_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-services-fqdn-name
  - name: DIGIT_CLIENT_ID
    value: {{ index .Values "digit-client-id" | quote }}
  {{- if .Values.defaultTenantId }}
  - name: DEFAULT_TENANT_ID
    value: {{ .Values.defaultTenantId | quote }}
  {{- end }}
  - name: LOCALE
    value: {{ .Values.defaultLocale | quote }}
  - name: LOCALIZATION_MODULE
    value: {{ index .Values "localization-module" | quote }}
  - name: FILESTORE_MODULE
    value: {{ .Values.filestoreModule | quote }}

  # ── Database ─────────────────────────────────────────────────────────────
  # the app reads DB_HOST up to the first ':', so egov-config's host:port is fine
  - name: DB_SCHEMA
    value: {{ .Values.dbSchema | quote }}
  - name: DB_SSL
    value: {{ index .Values "db-ssl" | quote }}
  - name: PERSISTENCE_MODE
    value: {{ index .Values "persistence-mode" | quote }}

  # ── Downstream services ──────────────────────────────────────────────────
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-java
  - name: EGOV_FILESTORE_SERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: filestore-java
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: localization-java
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  - name: EGOV_MDMS_V2_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2

  # ── Bulk relationship ────────────────────────────────────────────────────
  - name: BULK_RELATIONSHIP_ENABLED
    value: {{ index .Values "bulk-relationship-enabled" | quote }}
  - name: BULK_RELATIONSHIP_CHUNK_SIZE
    value: {{ .Values.bulkRelationshipChunkSize | quote }}
  - name: CONFIRM_PARENT_ENABLED
    value: {{ index .Values "confirm-parent-enabled" | quote }}

  # ── Messaging / cache ────────────────────────────────────────────────────
  # Kafka unused in db persistence mode; Redis cache off unless CACHE_ENABLED is set
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port
