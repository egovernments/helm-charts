# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "digit-localization"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "localization"

# ── Init containers (flyway DB migration) ──────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "localization_schema"
    image:
      repository: "localization-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ──────────────────────────────────────────────────────────────────
image:
  repository: "localization"
replicas: 1
appType: "java"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ──────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: HTTP_PORT
    value: "8080"

  # ── Tenant / schema separation ───────────────────────────────────────────
  # consume account-migration, migrate into the tenant schema
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: SCHEMA_SEPARATION_TOPIC
    value: account-migration

  # ── App-level migrations ─────────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: classpath:db/migration  # jar-embedded migrations
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: localization_schema

  # ── Kafka ────────────────────────────────────────────────────────────────
  # tracer reads spring.kafka.bootstrap-servers; not mapped from KAFKA_BROKERS
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: "true"
  - name: KAFKA_PARTITION_COUNT
    value: "1"
  - name: KAFKA_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CONSUMER_GROUP
    value: localization-service

  # ── PubSub ───────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: PUBSUB_TOPIC_CREATE_MESSAGE
    value: localization-create-message
  - name: PUBSUB_TOPIC_UPDATE_MESSAGE
    value: localization-update-message
  - name: PUBSUB_TOPIC_UPSERT_MESSAGE
    value: localization-upsert-message
  - name: PUBSUB_TOPIC_DELETE_MESSAGE
    value: localization-delete-message

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_ADDRESS
    value: redis.backbone.svc.cluster.local:6379
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"
  - name: REDIS_CONSUMER_GROUP
    value: localization-service
  - name: REDIS_CONSUMER_ID
    value: localization-service-1
  - name: REDIS_RETENTION_DAYS
    value: "7"
  - name: REDIS_MAX_STREAM_LENGTH
    value: "1000000"
  - name: REDIS_CLEANUP_INTERVAL
    value: "86400"

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: OTEL_ENABLED
    value: "false"
  - name: OTEL_SERVICE_NAME
    value: localization-service
  - name: OTEL_SERVICE_VERSION
    value: 1.0.0
  - name: OTEL_METRICS_ENABLED
    value: "true"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318
  - name: PROMETHEUS_PORT
    value: "9090"
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
