# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "otp"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "otp"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "otp_schema"
    image:
      repository: "otp-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "otp"
replicas: 1
appType: "java"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: true

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
otp-length: "6"
otp-charset: "digits"
otp-lifetime-seconds: "300"
resend-delay-seconds: "30"
max-resend-count: "300"
max-verify-attempts: "500"
use-single-active-otp: "true"
resend-same-code: "true"
max-generate-per-dest-hour: "200"
max-generate-per-ip-hour: "200"
enable-rate-limit: "false"
notify-async: "false"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
schema-separation-topic: "account-migration"
migration-locations: "classpath:db/migration"
kafka-auto-create-topics: "true"
kafka-partitions: "1"
kafka-replication-factor: "1"
kafka-consumer-group: "otp-service"
pubsub-enabled: "true"
pubsub-type: "kafka"
topic-generate-otp: "otp-generate-otp"
topic-resend-otp: "otp-resend-otp"
topic-verify-otp: "otp-verify-otp"
topic-invalidate-otp: "otp-invalidate-otp"
redis-db: "0"
redis-consumer-group: "otp-service"
redis-consumer-id: "otp-service-1"
redis-retention-days: "7"
redis-max-stream-length: "1000000"
redis-cleanup-interval: "86400"
console-logs-enabled: "true"
otel-enabled: "false"
otel-service-name: "otp"
otel-service-version: "1.0.0"
otel-metrics-enabled: "true"
otel-sampler-arg: "1.0"
prometheus-port: "9090"

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── OTP ───────────────────────────────────────────────────────────────
  - name: OTP_LENGTH
    value: {{ index .Values "otp-length" | quote }}
  - name: OTP_CHARSET
    value: {{ index .Values "otp-charset" | quote }}
  - name: OTP_LIFETIME_SECONDS
    value: {{ index .Values "otp-lifetime-seconds" | quote }}
  - name: RESEND_DELAY_SECONDS
    value: {{ index .Values "resend-delay-seconds" | quote }}
  - name: MAX_RESEND_COUNT
    value: {{ index .Values "max-resend-count" | quote }}
  - name: MAX_VERIFY_ATTEMPTS
    value: {{ index .Values "max-verify-attempts" | quote }}
  - name: USE_SINGLE_ACTIVE_OTP
    value: {{ index .Values "use-single-active-otp" | quote }}
  - name: RESEND_SAME_CODE
    value: {{ index .Values "resend-same-code" | quote }}
  - name: MAX_GENERATE_PER_DEST_HOUR
    value: {{ index .Values "max-generate-per-dest-hour" | quote }}
  - name: MAX_GENERATE_PER_IP_HOUR
    value: {{ index .Values "max-generate-per-ip-hour" | quote }}
  - name: ENABLE_RATE_LIMIT
    value: {{ index .Values "enable-rate-limit" | quote }}

  # ── Notification ──────────────────────────────────────────────────────
  # key `notification` resolves to http://notification:8080/ (pre-java Deployment scaled 0/0; notification is the live service)
  - name: NOTIFY_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: notification
        name: egov-service-host
  - name: NOTIFY_ASYNC
    value: {{ index .Values "notify-async" | quote }}

  # ── HMAC ──────────────────────────────────────────────────────────────
  # present-but-empty is worse than absent: Spring prefers it over the default and HmacSHA256 rejects an empty key (generate 503s)
  - name: HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: hmac-secret
        key: hmac-secret
        optional: true

  # ── Tenant / schema separation ────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: SCHEMA_SEPARATION_TOPIC
    value: {{ index .Values "schema-separation-topic" | quote }}

  # ── App-level migrations ──────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: {{ index .Values "migration-locations" | quote }}
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}

  # ── Kafka ─────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: {{ index .Values "kafka-auto-create-topics" | quote }}
  - name: KAFKA_PARTITION_COUNT
    value: {{ index .Values "kafka-partitions" | quote }}
  - name: KAFKA_REPLICATION_FACTOR
    value: {{ index .Values "kafka-replication-factor" | quote }}
  - name: KAFKA_CONSUMER_GROUP
    value: {{ index .Values "kafka-consumer-group" | quote }}

  # ── PubSub ────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: {{ index .Values "pubsub-enabled" | quote }}
  - name: PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: PUBSUB_TOPIC_GENERATE_OTP
    value: {{ index .Values "topic-generate-otp" | quote }}
  - name: PUBSUB_TOPIC_RESEND_OTP
    value: {{ index .Values "topic-resend-otp" | quote }}
  - name: PUBSUB_TOPIC_VERIFY_OTP
    value: {{ index .Values "topic-verify-otp" | quote }}
  - name: PUBSUB_TOPIC_INVALIDATE_OTP
    value: {{ index .Values "topic-invalidate-otp" | quote }}

  # ── Redis ─────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: {{ index .Values "redis-db" | quote }}
  - name: REDIS_ADDRESS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-address
  - name: REDIS_CONSUMER_GROUP
    value: {{ index .Values "redis-consumer-group" | quote }}
  - name: REDIS_CONSUMER_ID
    value: {{ index .Values "redis-consumer-id" | quote }}
  - name: REDIS_RETENTION_DAYS
    value: {{ index .Values "redis-retention-days" | quote }}
  - name: REDIS_MAX_STREAM_LENGTH
    value: {{ index .Values "redis-max-stream-length" | quote }}
  - name: REDIS_CLEANUP_INTERVAL
    value: {{ index .Values "redis-cleanup-interval" | quote }}

  # ── Vault ─────────────────────────────────────────────────────────────
  - name: VAULT_HOST
    valueFrom:
      configMapKeyRef:
        key: vault
        name: egov-service-host
  - name: VAULT_ROLE_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: role-id
        optional: true
  - name: VAULT_SECRET_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: secret-id
        optional: true
  - name: VAULT_ENABLED
    value: {{ index .Values "vault-enabled" | quote }}

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: OTEL_ENABLED
    value: {{ index .Values "otel-enabled" | quote }}
  - name: OTEL_SERVICE_NAME
    value: {{ index .Values "otel-service-name" | quote }}
  - name: OTEL_SERVICE_VERSION
    value: {{ index .Values "otel-service-version" | quote }}
  - name: OTEL_METRICS_ENABLED
    value: {{ index .Values "otel-metrics-enabled" | quote }}
  - name: PROMETHEUS_PORT
    value: {{ index .Values "prometheus-port" | quote }}
  - name: OTEL_TRACES_SAMPLER_ARG
    value: {{ index .Values "otel-sampler-arg" | quote }}
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-exporter-otlp-endpoint
  - name: CONSOLE_LOGS_ENABLED
    value: {{ index .Values "console-logs-enabled" | quote }}
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
