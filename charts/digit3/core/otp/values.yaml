# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "otp"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "otp"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "otp_schema"
    image:
      repository: "otp-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "otp"
replicas: 1
appType: "java"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: true

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ───────────────────────────────────────────────────────────
  - name: SERVER_PORT
    value: "8080"

  # ── OTP ───────────────────────────────────────────────────────────────
  - name: OTP_LENGTH
    value: "6"
  - name: OTP_CHARSET
    value: digits
  - name: OTP_LIFETIME_SECONDS
    value: "300"
  - name: RESEND_DELAY_SECONDS
    value: "30"
  - name: MAX_RESEND_COUNT
    value: "300"
  - name: MAX_VERIFY_ATTEMPTS
    value: "500"
  - name: USE_SINGLE_ACTIVE_OTP
    value: "true"
  - name: RESEND_SAME_CODE
    value: "true"
  - name: MAX_GENERATE_PER_DEST_HOUR
    value: "200"
  - name: MAX_GENERATE_PER_IP_HOUR
    value: "200"
  - name: ENABLE_RATE_LIMIT
    value: "false"

  # ── Notification ──────────────────────────────────────────────────────
  # key `notification` resolves to http://notification:8080/ (pre-java Deployment scaled 0/0; notification is the live service)
  - name: NOTIFY_BASE_URL
    valueFrom:
      configMapKeyRef:
        key: notification
        name: egov-service-host
  - name: NOTIFY_ASYNC
    value: "false"

  # ── HMAC ──────────────────────────────────────────────────────────────
  # present-but-empty is worse than absent: Spring prefers it over the default and HmacSHA256 rejects an empty key (generate 503s)
  - name: HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: hmac-secret
        key: hmac-secret
        optional: true

  # ── Tenant / schema separation ────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: SCHEMA_SEPARATION_TOPIC
    value: account-migration

  # ── App-level migrations ──────────────────────────────────────────────
  - name: MIGRATION_FLYWAY_LOCATIONS
    value: classpath:db/migration  # jar-embedded migrations
  - name: MIGRATION_SCRIPT_PATH
    value: /opt/digit/migrate.sh
  - name: MIGRATION_FLYWAY_BIN
    value: /opt/flyway/flyway
  - name: MIGRATION_SCHEMA_TABLE
    value: otp_schema

  # ── Kafka ─────────────────────────────────────────────────────────────
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
    value: "true"
  - name: KAFKA_PARTITION_COUNT
    value: "1"
  - name: KAFKA_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_CONSUMER_GROUP
    value: otp-service

  # ── PubSub ────────────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: PUBSUB_TOPIC_GENERATE_OTP
    value: otp-generate-otp
  - name: PUBSUB_TOPIC_RESEND_OTP
    value: otp-resend-otp
  - name: PUBSUB_TOPIC_VERIFY_OTP
    value: otp-verify-otp
  - name: PUBSUB_TOPIC_INVALIDATE_OTP
    value: otp-invalidate-otp

  # ── Redis ─────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    value: redis.backbone
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"
  - name: REDIS_ADDRESS
    value: redis.backbone.svc.cluster.local:6379
  - name: REDIS_CONSUMER_GROUP
    value: otp-service
  - name: REDIS_CONSUMER_ID
    value: otp-service-1
  - name: REDIS_RETENTION_DAYS
    value: "7"
  - name: REDIS_MAX_STREAM_LENGTH
    value: "1000000"
  - name: REDIS_CLEANUP_INTERVAL
    value: "86400"

  # ── Vault ─────────────────────────────────────────────────────────────
  - name: VAULT_HOST
    valueFrom:
      configMapKeyRef:
        key: vault
        name: egov-service-host
  - name: VAULT_ROLE_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: role-id
        optional: true
  - name: VAULT_SECRET_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: secret-id
        optional: true
  - name: VAULT_ENABLED
    value: {{ index .Values "vault-enabled" | quote }}

  # ── Observability (OpenTelemetry) ─────────────────────────────────────
  # span switch is MANAGEMENT_TRACING_EXPORT_ENABLED, not MANAGEMENT_TRACING_ENABLED
  - name: OTEL_ENABLED
    value: "false"
  - name: OTEL_SERVICE_NAME
    value: otp
  - name: OTEL_SERVICE_VERSION
    value: 1.0.0
  - name: OTEL_METRICS_ENABLED
    value: "true"
  - name: PROMETHEUS_PORT
    value: "9090"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318
  - name: CONSOLE_LOGS_ENABLED
    value: "true"
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
