# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "employee"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "employee"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "employee_schema"
    image:
      repository: "employee-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "employee"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>
canonical-api-prefix: "canonical"
idgen-path: "idgen/v3/generate"
idgen-name: "EmployeeCode"
idgen-enabled: "true"
boundary-path: "boundary/v3/relationship"
boundary-enabled: "true"
individual-path: "individual/v3/individuals"
individual-enabled: "true"
keycloak-client-id: "employee-iam-client"
pubsub-enabled: "true"
pubsub-type: "kafka"
topic-create-employee: "employee-create-employee"
topic-update-employee: "employee-update-employee"
topic-delete-employee: "employee-delete-employee"
topic-create-jurisdiction: "employee-create-jurisdiction"
topic-update-jurisdiction: "employee-update-jurisdiction"
redis-db: "0"
tenant-migration-enabled: "true"
schema-separation-mode: "true"
tenant-migration-consumer-group: "employee-service"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: CANONICAL_API_PREFIX
    value: {{ index .Values "canonical-api-prefix" | quote }}

  # ── IdGen ────────────────────────────────────────────────────────────────
  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_PATH
    value: {{ index .Values "idgen-path" | quote }}
  - name: IDGEN_NAME
    value: {{ index .Values "idgen-name" | quote }}
  - name: IDGEN_ENABLED
    value: {{ index .Values "idgen-enabled" | quote }}

  # ── Boundary ─────────────────────────────────────────────────────────────
  - name: BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        key: boundary
        name: egov-service-host
  - name: BOUNDARY_PATH
    value: {{ index .Values "boundary-path" | quote }}
  - name: BOUNDARY_ENABLED
    value: {{ index .Values "boundary-enabled" | quote }}

  # ── Individual ───────────────────────────────────────────────────────────
  - name: INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        key: individual
        name: egov-service-host
  - name: INDIVIDUAL_PATH
    value: {{ index .Values "individual-path" | quote }}
  - name: INDIVIDUAL_ENABLED
    value: {{ index .Values "individual-enabled" | quote }}

  # ── Keycloak ─────────────────────────────────────────────────────────────
  # in-cluster Keycloak - the same URL every other service uses
  - name: KEYCLOAK_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-base-url
  - name: KEYCLOAK_ENABLED
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-enabled
  - name: KEYCLOAK_EMPLOYEE_IAM_CLIENT_ID
    value: {{ index .Values "keycloak-client-id" | quote }}
  - name: KEYCLOAK_EMPLOYEE_IAM_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: employee-iam-secret
        key: employee-iam-client-secret

  # ── Kafka / PubSub ───────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: {{ index .Values "pubsub-enabled" | quote }}
  - name: PUBSUB_TYPE
    value: {{ index .Values "pubsub-type" | quote }}
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: PUBSUB_TOPIC_CREATE_EMPLOYEE
    value: {{ index .Values "topic-create-employee" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_EMPLOYEE
    value: {{ index .Values "topic-update-employee" | quote }}
  - name: PUBSUB_TOPIC_DELETE_EMPLOYEE
    value: {{ index .Values "topic-delete-employee" | quote }}
  - name: PUBSUB_TOPIC_CREATE_JURISDICTION
    value: {{ index .Values "topic-create-jurisdiction" | quote }}
  - name: PUBSUB_TOPIC_UPDATE_JURISDICTION
    value: {{ index .Values "topic-update-jurisdiction" | quote }}

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-port
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: {{ index .Values "redis-db" | quote }}

  # ── tenant-migration ─────────────────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: {{ index .Values "tenant-migration-enabled" | quote }}
  - name: SCHEMA_SEPARATION_MODE
    value: {{ index .Values "schema-separation-mode" | quote }}
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: {{ index .Values "tenant-migration-consumer-group" | quote }}

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: otel-tracing-export-otlp-endpoint
