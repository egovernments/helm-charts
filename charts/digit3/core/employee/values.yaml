# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "employee"
  group: "core"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  gateway: true
  context: "employee"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "employee_schema"
    image:
      repository: "employee-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "employee"
replicas: 1
appType: "java"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

# MANAGEMENT_TRACING_EXPORT_ENABLED; override per env
tracing-export-enabled: "false"
tracing-enabled: false

healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_CONTEXT_PATH
    value: /employee
  - name: CANONICAL_API_PREFIX
    value: canonical

  # ── IdGen ────────────────────────────────────────────────────────────────
  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_PATH
    value: idgen/v3/generate
  - name: IDGEN_NAME
    value: EmployeeCode
  - name: IDGEN_ENABLED
    value: "true"

  # ── Boundary ─────────────────────────────────────────────────────────────
  - name: BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        key: boundary
        name: egov-service-host
  - name: BOUNDARY_PATH
    value: boundary/v3/relationship
  - name: BOUNDARY_ENABLED
    value: "true"

  # ── Individual ───────────────────────────────────────────────────────────
  - name: INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        key: individual
        name: egov-service-host
  - name: INDIVIDUAL_PATH
    value: individual/v3/individuals
  - name: INDIVIDUAL_ENABLED
    value: "true"

  # ── Keycloak ─────────────────────────────────────────────────────────────
  # in-cluster Keycloak - the same URL every other service uses
  - name: KEYCLOAK_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-base-url
  - name: KEYCLOAK_ENABLED
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: keycloak-enabled
  - name: KEYCLOAK_EMPLOYEE_IAM_CLIENT_ID
    value: employee-iam-client
  - name: KEYCLOAK_EMPLOYEE_IAM_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: employee-iam-secret
        key: employee-iam-client-secret

  # ── Kafka / PubSub ───────────────────────────────────────────────────────
  - name: PUBSUB_ENABLED
    value: "true"
  - name: PUBSUB_TYPE
    value: "kafka"
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: PUBSUB_TOPIC_CREATE_EMPLOYEE
    value: employee-create-employee
  - name: PUBSUB_TOPIC_UPDATE_EMPLOYEE
    value: employee-update-employee
  - name: PUBSUB_TOPIC_DELETE_EMPLOYEE
    value: employee-delete-employee
  - name: PUBSUB_TOPIC_CREATE_JURISDICTION
    value: employee-create-jurisdiction
  - name: PUBSUB_TOPIC_UPDATE_JURISDICTION
    value: employee-update-jurisdiction

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"

  # ── tenant-migration ─────────────────────────────────────────────────────
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: SCHEMA_SEPARATION_MODE
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: employee_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: employee-service

  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # span switch is *_EXPORT_ENABLED, not *_ENABLED
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
