# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "studio-individual"
  group: "core"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "studio-individual"

# ── Init container (flyway DB migration) ──────────────────────────────────────
# Studio tables live in the `studio` schema; DB_URL carries it via egov-config/studio-db-url.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "individual_schema"
    image:
      repository: "studio-individual-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: studio-db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "studio-individual"
replicas: 1
appType: "java"
heap: "-Xmx256m -Xms256m"
java-args: ""
tracing-enabled: false

# ── Resources ─────────────────────────────────────────────────────────────────
cpu_requests: "100m"
memory_requests: "256Mi"
cpu_limits: "300m"
memory_limits: "512Mi"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""   # blank -> /<ingress.context>

# redis (studio-individual points at the in-cluster redis directly)
redis-host: "redis.backbone"
redis-port: "6379"
cache-ttl: "60"

# idgen
idgen-path: "egov-idgen/id/_generate"
idgen-enabled: "true"
idgen-id-format: "individual.id"

# endpoints
egov-mdms-search-endpoint: "/mdms-v2/v1/_search"
egov-enc-encrypt-endpoint: "/egov-enc-service/crypto/v1/_encrypt"
egov-enc-decrypt-endpoint: "/egov-enc-service/crypto/v1/_decrypt"
egov-create-user-url: "/user/users/_createnovalidate"
egov-search-user-url: "/user/_search"
egov-update-user-url: "/user/users/_updatenovalidate"
egov-boundary-search-url: "/boundary-service/boundary/_search"
egov-boundary-hierarchy: "ADMIN"

# kafka topics / consumer group
kafka-consumer-group: "studio-individual"
topic-bulk-create: "individual-consumer-bulk-create-studio-topic"
topic-bulk-update: "individual-consumer-bulk-update-studio-topic"
topic-bulk-delete: "individual-consumer-bulk-delete-studio-topic"
topic-save: "save-individual-studio-topic"
topic-update: "update-individual-studio-topic"
topic-delete: "delete-individual-studio-topic"
topic-update-user-id: "update-user-id-studio-topic"
topic-notification-sms: "egov.core.notification.sms"

# feature flags / behaviour
user-integration-enabled: "true"
user-sync-enabled: "true"
user-service-user-type: "CITIZEN"
user-service-account-locked: "false"
notification-sms-enabled: "false"
notification-sms-disabled-roles: "ORG_ADMIN"
aadhaar-pattern: "\\d{12}"
mobile-pattern: "\\d+"
tracer-kafka-mdc-enabled: "true"
security-basic-enabled: "false"
management-security-enabled: "false"

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ────────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: SECURITY_BASIC_ENABLED
    value: {{ index .Values "security-basic-enabled" | quote }}
  - name: MANAGEMENT_SECURITY_ENABLED
    value: {{ index .Values "management-security-enabled" | quote }}
  - name: TRACER_KAFKA_MDC_ENABLED
    value: {{ index .Values "tracer-kafka-mdc-enabled" | quote }}

  # ── Redis cache ──────────────────────────────────────────────────────────────
  - name: SPRING_REDIS_HOST
    value: {{ index .Values "redis-host" | quote }}
  - name: SPRING_REDIS_PORT
    value: {{ index .Values "redis-port" | quote }}
  - name: SPRING_CACHE_TYPE
    value: "redis"
  - name: SPRING_CACHE_REDIS_TIME-TO-LIVE
    value: {{ index .Values "cache-ttl" | quote }}
  - name: SPRING_CACHE_AUTOEXPIRY
    value: "true"

  # ── External service hosts ─────────────────────────────────────────────────
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-idgen }
  - name: EGOV_IDGEN_PATH
    value: {{ index .Values "idgen-path" | quote }}
  - name: EGOV_IDGEN_INTEGRATION_ENABLED
    value: {{ index .Values "idgen-enabled" | quote }}
  - name: IDGEN.INDIVIDUAL.ID.FORMAT
    value: {{ index .Values "idgen-id-format" | quote }}
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-mdms-service }
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: {{ index .Values "egov-mdms-search-endpoint" | quote }}
  - name: EGOV_ENC_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-enc-service }
  - name: EGOV_ENC_ENCRYPT_ENDPOINT
    value: {{ index .Values "egov-enc-encrypt-endpoint" | quote }}
  - name: EGOV_ENC_DECRYPT_ENDPOINT
    value: {{ index .Values "egov-enc-decrypt-endpoint" | quote }}
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-localization }
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-user }
  - name: EGOV_CREATE_USER_URL
    value: {{ index .Values "egov-create-user-url" | quote }}
  - name: EGOV_SEARCH_USER_URL
    value: {{ index .Values "egov-search-user-url" | quote }}
  - name: EGOV_UPDATE_USER_URL
    value: {{ index .Values "egov-update-user-url" | quote }}
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: boundary-service }
  - name: EGOV_BOUNDARY_SEARCH_URL
    value: {{ index .Values "egov-boundary-search-url" | quote }}
  - name: EGOV_BOUNDARY_HIERARCHY
    value: {{ index .Values "egov-boundary-hierarchy" | quote }}
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef: { name: egov-config, key: egov-state-level-tenant-id }

  # ── User integration flags ───────────────────────────────────────────────────
  - name: EGOV_USER_INTEGRATION_ENABLED
    value: {{ index .Values "user-integration-enabled" | quote }}
  - name: USER_SYNC_ENABLED
    value: {{ index .Values "user-sync-enabled" | quote }}
  - name: USER_SERVICE_USER_TYPE
    value: {{ index .Values "user-service-user-type" | quote }}
  - name: USER_SERVICE_ACCOUNT_LOCKED
    value: {{ index .Values "user-service-account-locked" | quote }}
  - name: AADHAAR_PATTERN
    value: {{ index .Values "aadhaar-pattern" | quote }}
  - name: MOBILE_PATTERN
    value: {{ index .Values "mobile-pattern" | quote }}
  - name: NOTIFICATION_SMS_ENABLED
    value: {{ index .Values "notification-sms-enabled" | quote }}
  - name: NOTIFICATION_SMS_DISABLED_ROLES
    value: {{ index .Values "notification-sms-disabled-roles" | quote }}

  # ── Kafka ──────────────────────────────────────────────────────────────────
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: "org.apache.kafka.common.serialization.StringSerializer"
  - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
    valueFrom:
      configMapKeyRef: { name: egov-config, key: kafka-brokers }
  - name: INDIVIDUAL.CONSUMER.BULK.CREATE.TOPIC
    value: {{ index .Values "topic-bulk-create" | quote }}
  - name: INDIVIDUAL.CONSUMER.BULK.UPDATE.TOPIC
    value: {{ index .Values "topic-bulk-update" | quote }}
  - name: INDIVIDUAL.CONSUMER.BULK.DELETE.TOPIC
    value: {{ index .Values "topic-bulk-delete" | quote }}
  - name: INDIVIDUAL.PRODUCER.SAVE.TOPIC
    value: {{ index .Values "topic-save" | quote }}
  - name: INDIVIDUAL.PRODUCER.UPDATE.TOPIC
    value: {{ index .Values "topic-update" | quote }}
  - name: INDIVIDUAL.PRODUCER.DELETE.TOPIC
    value: {{ index .Values "topic-delete" | quote }}
  - name: INDIVIDUAL_PRODUCER_UPDATE_USER_ID_TOPIC
    value: {{ index .Values "topic-update-user-id" | quote }}
  - name: KAFKA_TOPICS_NOTIFICATION_SMS
    value: {{ index .Values "topic-notification-sms" | quote }}

# ── Extra env (overrides common's defaults; studio uses the `studio` schema) ───
extraEnv:
  app: |
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: studio-db-url
