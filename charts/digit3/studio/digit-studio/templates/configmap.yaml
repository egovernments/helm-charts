# configmap.yaml
# Ships the js-injection ConfigMap the Deployment mounts (bundled in the same
# app as the reference deployment). Content is env-specific: override jsInjection.subFilter.
{{- if .Values.jsInjection.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.name" . }}-js-injection
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
data:
  sub_filter.conf: |
{{ .Values.jsInjection.subFilter | indent 4 }}
{{- end }}
