# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "studio-pdf"
  group: "rainmaker"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: egov

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "studio-pdf"

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "studio-pdf"
replicas: 1
appType: ""        # Node.js service; reads DB_*/KAFKA_* directly (common does not inject infra)

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""   # blank -> /<ingress.context>
db-port: "5432"

# ── Health checks ─────────────────────────────────────────────────────────────
healthChecks:
  enabled: false
  livenessProbePath: "/health"
  readinessProbePath: "/health"

# ── Resources ─────────────────────────────────────────────────────────────────
resources: |
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "100m"
    memory: "512Mi"

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── External services (hosts from egov-service-host) ─────────────────────
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-mdms-service }
  - name: EGOV_PDF_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: pdf-service }
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-user }
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-workflow-v2 }
  - name: EGOV_FILESTORE_SERVICE_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-filestore }
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: egov-localization }
  - name: PUBLIC_SERVICE_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: public-service }
  - name: STUDIO_PDF_HELPER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: studio-pdf-helper-service }
  - name: EGOV_COLLECTION_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: collection-services }
  - name: EGOV_BILLING_HOST
    valueFrom:
      configMapKeyRef: { name: egov-service-host, key: billing-service }
  - name: EGOV_HOST
    valueFrom:
      configMapKeyRef: { name: egov-config, key: egov-services-fqdn-name }

  # ── Database (read directly; non-java, no datasource injection) ───────────
  - name: DB_HOST
    valueFrom:
      configMapKeyRef: { name: egov-config, key: db-host }
  - name: DB_NAME
    valueFrom:
      configMapKeyRef: { name: egov-config, key: db-name }
  - name: DB_USER
    valueFrom:
      secretKeyRef: { name: db, key: username }
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef: { name: db, key: password }
  - name: DB_PORT
    value: {{ index .Values "db-port" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef: { name: egov-config, key: kafka-brokers }

  # ── Service ──────────────────────────────────────────────────────────────
  - name: CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
