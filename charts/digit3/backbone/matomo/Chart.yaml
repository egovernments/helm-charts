annotations:
  category: Analytics
  images: |
    - name: apache-exporter
      image: docker.io/egovio/apache-exporter:1.0.10-debian-12-r55
    - name: matomo
      image: docker.io/egovio/matomo:5.3.2-debian-12-r12
    - name: os-shell
      image: docker.io/egovio/os-shell:12-debian-12-r50
    - name: mariadb
      image: docker.io/egovio/mariadb:12.0.2-debian-12-r0
  licenses: Apache-2.0
  tanzuCategory: application
  # Upstream provenance: vendored from the Bitnami matomo chart. `version` below
  # follows this repo's digit3 3.x convention, not the upstream chart version.
  # Bitnami deprecated its public Docker Hub images (moved to bitnamilegacy), so
  # every image is mirrored to egovio and the values point there.
  digit.org/upstream-chart: bitnami/matomo
  digit.org/upstream-chart-version: "11.0.0"
  digit.org/upstream-app-version: "5.3.2"
apiVersion: v2
appVersion: 5.3.2
dependencies:
- condition: mariadb.enabled
  name: mariadb
  repository: "file://upstream/mariadb"
  version: 22.0.0
- name: common
  repository: "file://upstream/common"
  tags:
  - bitnami-common
  version: 2.41.0
description: Matomo, formerly known as Piwik, is a real time web analytics program.
  It provides detailed reports on website visitors.
home: https://bitnami.com
icon: https://dyltqmyl993wv.cloudfront.net/assets/stacks/matomo/img/matomo-stack-220x234.png
keywords:
- matomo
- analytics
- http
- web
- application
- php
maintainers:
- name: Broadcom, Inc. All Rights Reserved.
  url: https://github.com/bitnami/charts
name: matomo
sources:
- https://github.com/bitnami/charts/tree/main/bitnami/matomo
# digit3 3.x convention (seed); not the upstream chart version (see annotations).
version: 3.0.0
