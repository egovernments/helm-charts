{{- $distributed := gt (int .Values.replicas) 1 }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ include "minio.namespace" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "minio.headless" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "minio.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ce
            - >-
              /usr/bin/docker-entrypoint.sh minio server
              {{- if $distributed }}
              http://{{ include "minio.fullname" . }}-{0...{{ sub (int .Values.replicas) 1 }}}.{{ include "minio.headless" . }}.{{ include "minio.namespace" . }}.svc{{ .Values.mountPath }}
              {{- else }}
              {{ .Values.mountPath }}
              {{- end }}
              -S {{ .Values.certsPath }}
              --address :{{ .Values.ports.api }}
              --console-address :{{ .Values.ports.console }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.api }}
              protocol: TCP
            - name: http-console
              containerPort: {{ .Values.ports.console }}
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: {{ include "minio.rootUserKey" . }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: {{ include "minio.rootPasswordKey" . }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if and .Values.ingress.enabled (not (hasKey .Values.extraEnv "MINIO_BROWSER_REDIRECT_URL")) (include "minio.consoleHost" .) }}
            # console served under /minio by the ingress
            - name: MINIO_BROWSER_REDIRECT_URL
              value: {{ printf "https://%s/minio" (include "minio.consoleHost" .) | quote }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: export
              mountPath: {{ .Values.mountPath }}
        {{- with .Values.provisioning.buckets }}
        # Creates the buckets once MinIO answers on 127.0.0.1 (same pod), then idles.
        # Idempotent (--ignore-existing); not a Helm hook, so it never fails an install.
        - name: provision-buckets
          image: "{{ $.Values.provisioning.image.repository }}:{{ $.Values.provisioning.image.tag }}"
          imagePullPolicy: {{ $.Values.provisioning.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local "http://127.0.0.1:{{ $.Values.ports.api }}" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for MinIO"; sleep 5
              done
              while read -r b p; do
                [ -n "$b" ] || continue
                until mc mb --ignore-existing "local/$b"; do sleep 5; done
                [ "$p" = none ] || mc anonymous set "$p" "local/$b"
              done <<'BUCKETS'
              {{- range . }}
              {{ required "provisioning.buckets[].name is required" .name }} {{ .policy | default "none" }}
              {{- end }}
              BUCKETS
              echo "buckets ready"
              exec sleep infinity
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" $ }}
                  key: {{ include "minio.rootUserKey" $ }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" $ }}
                  key: {{ include "minio.rootPasswordKey" $ }}
          resources:
            {{- toYaml $.Values.provisioning.resources | nindent 12 }}
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/mc
        {{- end }}
      {{- if .Values.provisioning.buckets }}
      volumes:
        - name: mc-config
          emptyDir: {}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: export
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        # Stated explicitly (API default) so Server-Side Apply never sees an immutable-field
        # change on volumeClaimTemplates (digit-lts lesson).
        volumeMode: Filesystem
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
