{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ include "minio.namespace" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
data:
  # Placeholder login. Prefer auth.existingSecret (a Secret from your secret manager).
  {{ include "minio.rootUserKey" . }}: {{ .Values.auth.rootUser | b64enc | quote }}
  {{ include "minio.rootPasswordKey" . }}: {{ .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
