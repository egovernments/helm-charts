# MinIO (S3-compatible object storage). Based on the DIGIT-DevOps digit-lts chart.

# Namespace of every object (default: the release namespace)
namespace: ""
# Object names: minio, minio-console, minio-svc (headless) - independent of the release name
fullnameOverride: minio

image:
  repository: egovio/minio
  tag: "RELEASE.2024-12-18T13-15-44Z"
  pullPolicy: IfNotPresent

# 1 = standalone (one server, one drive). >1 = distributed (minio-{0..N-1} over the
# headless Service; use 4+ for erasure coding).
replicas: 1
mountPath: /export
certsPath: /etc/minio/certs/

ports:
  api: 9000
  console: 9001

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

persistence:
  size: 20Gi
  storageClass: ""          # "" = the cluster's default StorageClass
  accessMode: ReadWriteOnce

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Health probes (MinIO health API on the S3 port)
probes:
  enabled: true

auth:
  # Use an existing Secret for the root login (recommended). Empty = this chart creates
  # Secret <fullname> from rootUser/rootPassword below.
  existingSecret: ""
  # Key names of the login inside the Secret, e.g. {rootUser: accesskey, rootPassword: secretkey}
  # to share DIGIT filestore's `minio` Secret.
  existingSecretKeys:
    rootUser: rootUser
    rootPassword: rootPassword
  rootUser: minio
  rootPassword: "CHANGEME"

extraEnv:
  MINIO_PROMETHEUS_AUTH_TYPE: "public"
  # MINIO_BROWSER_REDIRECT_URL: "https://<domain>/minio"

# Buckets created once MinIO is up, by a small sidecar (mc) in each MinIO pod that talks
# to MinIO on 127.0.0.1, retries until it answers, then idles. Not a Helm hook: an install
# never fails on it. policy: none | download | upload | public (anonymous access).
provisioning:
  buckets: []
  #  - name: digit-filestore
  #    policy: none
  image:
    repository: egovio/mc
    tag: "RELEASE.2024-01-16T16-06-34Z"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Console at <host><path> (nginx ingress, path rewrite)
ingress:
  enabled: false
  className: nginx
  host: ""
  proxyBodySize: "8m"
  tls:
    enabled: true
    secretName: ""
  path: /minio/(.*)
  pathType: ImplementationSpecific
  rewriteTarget: /$1
  service: minio-console
  servicePort: 9001
  redirect:
    enabled: true
    path: /minio$
    to: ""                  # e.g. https://<host>/minio/

# S3 API on its own host (no rewrite, so presigned URLs stay valid)
apiIngress:
  enabled: false
  className: nginx
  host: ""                  # e.g. minio-api.<domain>
  service: minio
  servicePort: 9000
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: minio-api-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
