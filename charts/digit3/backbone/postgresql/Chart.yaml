apiVersion: v2
name: postgresql
description: >-
  PostgreSQL 18 on CloudNativePG for the DIGIT backbone. Vendored from the official cloudnative-pg/cluster chart, with a reconciler that provisions the application database + role (from egov-config and the db secret) after the cluster is ready.
type: application
# Chart version follows this repo's digit3 3.x convention, not the upstream
# cluster chart version (see the digit.org/upstream-* annotations below).
version: 3.0.2
appVersion: "18"
kubeVersion: ">=1.29.0-0"
icon: https://raw.githubusercontent.com/cloudnative-pg/artwork/main/cloudnativepg-logo.svg
home: https://cloudnative-pg.io
sources:
  - https://github.com/cloudnative-pg/charts
keywords:
  - postgresql
  - postgres
  - database
  - cloudnative-pg
annotations:
  # Upstream provenance: vendored from the official CloudNativePG cluster chart,
  # so the parent chart + app versions are easy to map and re-sync.
  digit.org/upstream-chart: cloudnative-pg/cluster
  digit.org/upstream-chart-version: "0.9.0"
  digit.org/upstream-app-version: "18"
  digit.org/upstream-operand-image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
