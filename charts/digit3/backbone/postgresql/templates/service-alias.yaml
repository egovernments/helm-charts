{{- /*
Stable hostname: a plain "postgresql" Service that CNAMEs to the operator's
read-write Service (<name>-rw). Lets consumers use postgresql.<namespace>
(the egov-config db-host default) without hard-coding the -rw suffix.
*/ -}}
{{- $v := include "pg18.values" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg18.name" . }}
  namespace: {{ $v.namespace }}
  labels:
    {{- include "pg18.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ include "pg18.name" . }}-rw.{{ $v.namespace }}.svc.cluster.local
