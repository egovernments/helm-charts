# Common Labels
labels:
  group: "es-curator"

cron:
  schedule: "24 11 * * *"  
# Container Configs
namespace: es-cluster
image:
  repository: "untergeek/curator"
  tag: 8.0.15
logs-cleanup-enabled: true
jaeger-cleanup-enabled: true
logs-to-retain-in-days: 2 
memory_limits: 256Mi
args: [ "--config", "/etc/es-curator/config.yml", "/etc/es-curator/action_file.yml" ]

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: ES_CLIENT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: es-indexer-host 
  - name: ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: username 
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: kibana-kibana-es-token
        key: token
  - name: ES_CLIENT_PORT
    value: "9200"  
  - name: LOG_LEVEL
    value: "DEBUG" 
  {{- if index .Values "logs-cleanup-enabled" }}                  
  - name: LOGS_CLEANUP_DISABLED
    value: "False"
  - name: RETAIN_LOGS_IN_DAYS
    value: {{ index .Values "logs-to-retain-in-days" | quote }}
  {{- end }}               
  {{- if index .Values "jaeger-cleanup-enabled" }}     
  - name: JAEGER_CLEANUP_DISABLED
    value: "False"
  - name: RETAIN_JAEGER_DATA_IN_DAYS
    value: "14"
  {{- end }}       
extraVolumes: |
  - name: config-volume
    configMap:
      name: {{ template "name" . }}-config
extraVolumeMounts: |
  - mountPath: /etc/es-curator
    name: config-volume     
resources: |
  requests:
    memory: {{ .Values.memory_limits | quote }}
  limits:
    memory: {{ .Values.memory_limits | quote }}

# Curator config.yml + action_file.yml, rendered with tpl. Index patterns and actions live here - override from the env file.
config:
  action_file.yml: |
    ---
    # Remember, leave a key empty if there is no value.  None will be a string,
    # not a Python "NoneType"
    #
    # Also remember that all examples have 'disable_action' set to True.  If you
    # want to use this action as a template, be sure to set this to False after
    # copying it.
    actions:
      1:
        action: delete_indices
        description: "Clean up ES by deleting old logs"
        options:
          timeout_override: 300
          continue_if_exception: False
          disable_action: ${LOGS_CLEANUP_DISABLED:True}
          ignore_empty_list: True
        filters:
        - filtertype: pattern
          kind: regex
          value: '^(egov-services-logs-|egov-infra-logs-|pbprod-logstash-|pbuat-logstash-).*$'                 
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: ${RETAIN_LOGS_IN_DAYS}
      2:
        action: delete_indices
        description: "Clean up ES by deleting old jaeger data"
        options:
          timeout_override: 300
          continue_if_exception: False
          disable_action: ${JAEGER_CLEANUP_DISABLED:True}
          ignore_empty_list: True
        filters:
        - filtertype: pattern
          kind: regex
          value: '^(jaeger-service-|jaeger-span-|jaeger-dependencies-).*$'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y-%m-%d'
          unit: days
          unit_count: ${RETAIN_LOGS_IN_DAYS}
      3:
        action: delete_indices
        description: "Clean up ES by deleting old fluentbit data"
        options:
          timeout_override: 300
          continue_if_exception: False
          disable_action: ${JAEGER_CLEANUP_DISABLED:True}
          ignore_empty_list: True
        filters:
        - filtertype: pattern
          kind: regex
          value: '^(fluentbit-).*$'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: ${RETAIN_LOGS_IN_DAYS}
  config.yml: |
    ---
    # Remember, leave a key empty if there is no value.  None will be a string,
    # not a Python "NoneType"
    elasticsearch:
      client:
        hosts:
          - ${ES_CLIENT_HOST}
        verify_certs: false
        client_cert:
        client_key:
        ca_certs: 
        request_timeout: 30
      other_settings:
        master_only: False
        username: ${ES_USERNAME}
        password: ${ES_PASSWORD}
    logging:
      loglevel: ${LOG_LEVEL:INFO}
      logfile:
      logformat: default
      blacklist: ['elastic_transport', 'urllib3']
