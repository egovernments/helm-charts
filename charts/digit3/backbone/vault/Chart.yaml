apiVersion: v2
name: vault
# Chart version follows this repo's digit3 convention (seed 3.0.0), not the
# upstream vault-helm version. Upstream chart: 0.29.1. appVersion tracks the
# Vault release delivered.
version: 3.0.1
appVersion: 1.18.1
kubeVersion: ">= 1.20.0-0"
description: Official HashiCorp Vault Chart
home: https://www.vaultproject.io
icon: https://github.com/hashicorp/vault/raw/f22d202cde2018f9455dec755118a9b84586e082/Vault_PrimaryLogo_Black.png
keywords: ["vault", "security", "encryption", "secrets", "management", "automation", "infrastructure"]
sources:
  - https://github.com/hashicorp/vault
  - https://github.com/hashicorp/vault-helm
  - https://github.com/hashicorp/vault-k8s
  - https://github.com/hashicorp/vault-csi-provider
annotations:
  charts.openshift.io/name: HashiCorp Vault
  # Upstream provenance: vendored from HashiCorp vault-helm (via DIGIT-DevOps modulith
  # digit3/vault). `version` above follows this repo's 3.x convention; these record
  # the parent chart + app versions so the source is easy to map and re-sync.
  digit.org/upstream-chart: hashicorp/vault-helm
  digit.org/upstream-chart-version: "0.29.1"
  digit.org/upstream-app-version: "1.18.1"
