# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  app: "crest"
  group: "crest"

# ── Ingress ───────────────────────────────────────────────────────────────────
# The API and the UI share one origin: the UI fetches same-origin /api/v1, so
# https://<domain>/api/* must reach this service while / reaches crest-ui.
# Longest-prefix wins in nginx, so this rule takes /api/* and crest-ui keeps the rest.
# gateway: false - the backend is this Service, not kong; CREST does not sit behind
# the DIGIT gateway. Set global.domain per environment.
ingress:
  enabled: true
  gateway: false
  context: "api"
  # No cert-manager annotation on purpose. This Ingress shares a host, and so the
  # <global.domain>-tls-certs Secret, with crest-ui; only crest-ui requests issuance.
  # Two Ingresses asking for the same Secret race for ownership of one Certificate.
  # Same split the cluster already uses for injicertify / injicertify-wellknown.

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# The app never migrates on startup (spring.flyway.enabled is false); this owns it.
# public, because CREST expects its own database - which is also what its
# docker-compose and Testcontainers use, so migrations run against the same schema
# everywhere. Point dbSchema at a dedicated schema only when sharing a database with
# other services, where table names this generic (users, project) would collide.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "crest_schema"
    dbSchema: "public"
    image:
      repository: "crest-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: {{ .Values.initContainers.dbMigration.dbSchema | quote }}
      - name: FLYWAY_DEFAULT_SCHEMA
        value: {{ .Values.initContainers.dbMigration.dbSchema | quote }}

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "crest"
replicas: 1
# NOT "java", despite being a Spring Boot service. appType java makes common inject
# its shared datasource block, and the SPRING_DATASOURCE_HIKARI_* entries in it
# collide with the hikari settings in this app's own application.yml - startup dies
# binding connection-init-sql onto an already-started pool:
#   "The configuration of the pool is sealed once started"
# CREST configures its datasource through CREST_DB_* (see the env block below), so it
# needs none of that block; MANAGEMENT_ENDPOINTS_WEB_BASE_PATH, the one part it did
# rely on, is set explicitly below.
appType: ""
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"

tracing-enabled: false

# Probes hit the pod directly, so the path is the one the container serves, not the
# ingress path - the common default would derive /api/health from ingress.context.
# common sets the actuator base path to /, and the app enables the k8s probe groups.
healthChecks:
  enabled: true
  livenessProbe: |
    httpGet:
      path: "/health/liveness"
      port: {{ .Values.httpPort }}
    initialDelaySeconds: 30
    timeoutSeconds: 3
    periodSeconds: 60
    successThreshold: 1
    failureThreshold: 5
  readinessProbe: |
    httpGet:
      path: "/health/readiness"
      port: {{ .Values.httpPort }}
    initialDelaySeconds: 30
    timeoutSeconds: 3
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 5

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Container env ─────────────────────────────────────────────────────────────
# Everything the container needs, since appType is "" and common injects no shared
# block. CREST_DB_* is the app's own documented contract, read by application.yml,
# and resolves from the same egov-config and db Secret every other service uses.
env: |
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  # Actuator at the context root, so health is /health rather than /actuator/health
  # and the probe paths above resolve. common sets this for appType java; this
  # service opts out of that block, so it sets it itself.
  - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
    value: "/"

  # ── Datasource ───────────────────────────────────────────────────────────
  - name: CREST_DB_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  - name: CREST_DB_USER
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: CREST_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
