apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.name" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
data:
  collect.py: |
{{ .Files.Get "files/collect.py" | indent 4 }}
  template.html: |
{{ .Files.Get "files/template.html" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dashboard.name" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.collector.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
{{- include "dashboard.collectorPod" . | nindent 8 }}
