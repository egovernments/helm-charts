# Read-only everywhere except its own page ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dashboard.name" . }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
rules:
  # Kubescape results, from the aggregated API served by the storage pod.
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources:
      - configurationscansummaries
      - vulnerabilitysummaries
      - workloadconfigurationscansummaries
      - sbomsyfts
      # Per-workload CVE summaries and the per-image manifests behind them.
      # Both are read by the image-vulnerability pass; without them it gets
      # 403 and the page reports CVEs as uncollected.
      - vulnerabilitymanifestsummaries
      - vulnerabilitymanifests
    verbs: ["get", "list"]
  # Kyverno findings.
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list"]
  # The policies themselves, so the page can list every policy that is
  # installed rather than only those that happened to produce a result.
  # Without this the collector gets 403 and a policy that is present but
  # finding nothing -- or that Kyverno refused to compile -- is indistinguishable
  # from one that was never deployed.
  - apiGroups: ["policies.kyverno.io"]
    resources:
      - validatingpolicies
      - namespacedvalidatingpolicies
      - imagevalidatingpolicies
      - namespacedimagevalidatingpolicies
    verbs: ["get", "list"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dashboard.name" . }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dashboard.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dashboard.name" . }}
    namespace: {{ .Release.Namespace }}
---
# Write access to exactly two ConfigMaps: the rendered page, and the score
# history it appends to. Still named explicitly rather than granted over
# configmaps generally.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dashboard.name" . }}-page
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "dashboard.pageConfigMap" . | quote }}
      - {{ include "dashboard.historyConfigMap" . | quote }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dashboard.name" . }}-page
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dashboard.name" . }}-page
subjects:
  - kind: ServiceAccount
    name: {{ include "dashboard.name" . }}
    namespace: {{ .Release.Namespace }}
