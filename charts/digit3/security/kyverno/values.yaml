# Kyverno for the unified environments: Pod Security Standards reported, never
# enforced, on webhooks that cannot wedge the cluster.
#
# Read the two settings under `kyverno-policies` before changing anything here.
# Together they are what makes this install safe to run on a shared cluster,
# and they are independent of each other -- relaxing either one alone is enough
# to start rejecting workloads.

kyverno-policies:
  # Report violations; do not reject the resource. The whole point of the first
  # rollout is to find out how much of the estate is already non-compliant
  # without anyone's deployment failing. Switching this to Enforce is a real
  # decision -- see the README before doing it.
  validationFailureAction: Audit

  # THE IMPORTANT ONE. Upstream defaults this to Fail, which is what people
  # mean when they say an admission webhook took the cluster down.
  #
  # `validationFailureAction: Audit` only decides what happens when a policy
  # FINDS something. `failurePolicy` decides what happens when the webhook
  # itself cannot be reached -- Kyverno restarting, rescheduling, OOM, a node
  # draining, or simply not ready yet. With `Fail`, every matching admission
  # request in the cluster is rejected for as long as that lasts, including
  # the deployments trying to fix it.
  #
  # `Ignore` means the API server proceeds when Kyverno does not answer. The
  # cost is that a resource created during that window is not evaluated, which
  # for an Audit-only install costs a report entry and nothing else. That is
  # the right trade until policies are actually enforced.
  failurePolicy: Ignore

  # `baseline` blocks the genuinely dangerous things (privileged, hostPath,
  # hostNetwork, hostPID). `restricted` additionally requires runAsNonRoot,
  # seccomp and dropped capabilities, which most DIGIT images do not satisfy
  # today -- turning it on now yields thousands of findings nobody will read.
  # Move to restricted once baseline is clean.
  podSecurityStandard: baseline

kyverno:
  upgrade:
    legacyPolicyCheck:
      # A pre-install/pre-upgrade Helm hook Job that refuses to install when
      # legacy kyverno.io policy resources exist. It hangs Argo CD syncs.
      #
      # The Job finishes in seconds, then Kubernetes deletes it via its own
      # `ttlSecondsAfterFinished: 300`. Argo records the hook as
      # `hookPhase: Running` when it applies it and then polls the Job to see
      # it finish -- so if the TTL fires before Argo observes completion, it
      # polls a Job that no longer exists and the sync waits forever:
      #
      #   waiting for completion of hook batch/Job/kyverno-check-legacy-policies
      #
      # It is a race, so it does not reproduce reliably: of unified-dev, -qa
      # and -uat installing the same chart minutes apart, dev won and the
      # other two wedged. Recovering needs the cached syncResult cleared by
      # hand -- terminating the operation is not enough, because the next one
      # resumes the same recorded hookPhase.
      #
      # Nothing is lost by disabling it here. It guards an upgrade path from
      # legacy kyverno.io policy types, and these are fresh installs with zero
      # such resources on any of the three clusters. The chart's render-time
      # check stays on as the backstop.
      enabled: false

  crds:
    migration:
      # Upstream ships this as a post-upgrade Helm hook that rewrites legacy
      # CRD data (globalcontextentries, updaterequests). There is nothing to
      # migrate on a fresh install, and the hook is actively harmful under
      # Argo CD: its `helm.sh/hook-delete-policy` is commented out upstream,
      # so Argo maps it to a PostSync hook that is never cleaned up, and the
      # NEXT sync fails trying to recreate an immutable Job.
      #
      # Re-enable it (or run the job by hand) only when upgrading across a
      # Kyverno release that actually requires the migration.
      enabled: false

  # One replica per controller. Upstream defaults the admission controller to 3
  # for HA, which matters when a webhook outage blocks admission -- with
  # failurePolicy Ignore it does not, so the extra pods buy nothing here.
  # Raise this with the same change that moves policies to Enforce.
  admissionController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Generates the PolicyReport / ClusterPolicyReport resources. This is where
  # every finding lives and what the security dashboard reads, so the install
  # is pointless without it. It is also what scans resources that ALREADY
  # exist -- without it a fresh install reports nothing until something new is
  # deployed.
  reportsController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi

  # Serves generate/mutate-existing rules. The Pod Security policies are
  # validate-only and do not need it, but it is cheap and leaving it on avoids
  # a surprise the first time someone adds a generate rule.
  backgroundController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Serves the CleanupPolicy CRD -- scheduled deletion of matching resources.
  # Nothing here uses it, and it is one less webhook and one less controller
  # with delete permissions on the cluster.
  cleanupController:
    enabled: false

# ---------------------------------------------------------------------------
# DIGIT policies
# ---------------------------------------------------------------------------
# Everything above this line configures the two upstream charts. This block is
# ours: policies DIGIT wrote, rendered from templates/digit-*.yaml.
#
# THIS IS THE ONE PLACE TO CHANGE THEM. Turning a policy on or off, moving it
# from Audit to Enforce, and choosing which namespaces it covers are all edits
# here -- the CEL in the templates does not change.
#
# The intended rollout, in order:
#   1. every policy Audit, every namespace      <- where this starts
#   2. read the findings, fix or accept them
#   3. one policy Enforce in one namespace      (policies.<name>.namespaces.include)
#   4. widen that namespace list, one at a time
#   5. Enforce globally once the list is the whole estate
#
# Findings land in PolicyReports and on the security dashboard alongside the
# Pod Security ones, so step 2 needs no extra tooling.
digitPolicies:
  # Master switch. `false` renders none of the policies below.
  enabled: true

  # Default for every policy that does not set its own `action`.
  #
  #   Audit    record the violation in a PolicyReport; admit the resource.
  #   Warn     also return it to kubectl as a warning; still admit it.
  #   Enforce  REJECT the request, and still record it.
  action: Audit

  # Read the `failurePolicy` section of the README before changing this. It is
  # not about what a policy does when it finds something -- it is about what
  # the API server does when Kyverno cannot be reached at all. `Ignore` lets
  # admission proceed unevaluated; `Fail` rejects every matching request in the
  # cluster for as long as Kyverno is down, including the deploy that fixes it.
  failurePolicy: Ignore

  # Default namespace scope. A policy may replace either list; see the comment
  # on `digitPolicies.scope` in templates/_helpers.tpl.
  namespaces:
    # Empty = every namespace. Put names here to narrow the whole set at once.
    include: []
    # The cluster's own machinery. These namespaces are installed by Helm, by
    # the cloud provider or by Argo CD itself, their resource shapes are not
    # ours to change, and `digit-workload-source` would report every one of
    # them as "not deployed by Argo CD" -- which is true and useless.
    exclude:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - kyverno
      - argocd
      - argo-rollouts
      - kargo
      - kargo-system-resources

  policies:
    # Every container declares what it needs (cpu + memory requests) and what
    # it may not exceed (memory limit).
    requireResources:
      enabled: true
      # action: Enforce
      # namespaces:
      #   include: [playground]
      severity: medium

      # Also require a CPU limit.
      #
      # Worth a deliberate decision rather than a default. A CPU limit does not
      # protect the node the way a memory limit does -- the kernel throttles
      # the container instead of killing it -- so a limit set too low shows up
      # as latency nobody can explain, and the usual advice is to set CPU
      # requests and skip CPU limits. It is on here because it was asked for;
      # set it to false to report only cpu/memory requests and the memory limit.
      requireCpuLimit: true

    # Workloads come from git, through Kargo and Argo CD. Anything else is drift.
    workloadSource:
      enabled: true
      # action: Enforce
      # namespaces:
      #   include: [playground]
      severity: high

      # Exact usernames allowed to write workloads.
      #
      # `argocd-application-controller` is the sync itself and accounts for
      # effectively all of it; `argocd-server` is what a sync or a rollback
      # started from the UI or the CLI comes through as. The two control-plane
      # identities are here because they also write to these objects (adopting
      # a resource, updating a Job from a CronJob) and are not "deployments".
      allowedUsers:
        - "system:serviceaccount:argocd:argocd-application-controller"
        - "system:serviceaccount:argocd:argocd-server"
        - "system:serviceaccount:argocd:argocd-applicationset-controller"
        - "system:kube-controller-manager"
        - "system:apiserver"

      # Prefix matches, for identities whose exact name is not fixed.
      # Everything under the kargo namespace, and the in-cluster controllers
      # that create Jobs and workloads as part of running Kubernetes itself.
      allowedPrefixes:
        # Quoted: a bare scalar ending in a colon is a YAML mapping key.
        - "system:serviceaccount:kargo:"
        - "system:serviceaccount:kube-system:"
        - "system:serviceaccount:kyverno:"

  # -------------------------------------------------------------------------
  # Policies that are not in this chart
  # -------------------------------------------------------------------------
  # A new policy does not need a chart change. Add an entry here -- in this
  # file for every environment, or in one environment's own values for just
  # that cluster -- and it is rendered as a ValidatingPolicy named
  # `digit-<key>`, with the same action and namespace conventions as the two
  # policies above.
  #
  # The only required fields are `match` (which resources) and `validations`
  # (what must be true of them). Everything else inherits.
  #
  #   extra:
  #     require-team-label:
  #       enabled: true
  #       title: Workloads must name an owning team
  #       description: >-
  #         An unlabelled workload has nobody to ask about it when it starts
  #         failing at 2am.
  #       severity: low
  #       # action: Enforce
  #       # namespaces:
  #       #   include: [egov]
  #       match:
  #         - apiGroups: ["apps"]
  #           apiVersions: ["v1"]
  #           operations: [CREATE, UPDATE]
  #           resources: [deployments, statefulsets]
  #       validations:
  #         - expression: >-
  #             has(object.metadata.labels) && 'team' in object.metadata.labels
  #           message: >-
  #             Set a `team` label naming who owns this workload.
  #
  # Optional keys: `category`, `failurePolicy`, `exclude` (excludeResourceRules),
  # `matchConditions` (appended after the namespace scope), `variables`, and
  # `background: false` -- which is REQUIRED for any policy whose CEL reads
  # `request` (the user, the operation, dry-run). Those exist only on a live
  # admission request; left on, a background scan errors on every object.
  #
  # A policy that is not a ValidatingPolicy at all -- a MutatingPolicy, an
  # ImageValidatingPolicy, a legacy ClusterPolicy -- goes through the upstream
  # verbatim hatch instead, `kyverno-policies.customPolicies`. See the README.
  extra: {}
