# DIGIT defaults for the upstream kubescape-operator chart.
#
# Everything below sits under the `kubescape-operator` key because this chart is
# a thin wrapper: there are no templates of its own. To change something the
# upstream chart exposes but this file does not mention, add it under the same
# key in the environment's values file -- do not fork the subchart.
#
# Upstream reference: https://github.com/kubescape/helm-charts/tree/main/charts/kubescape-operator

kubescape-operator:
  # MUST be overridden per environment. It is the name the scan results are
  # filed under, and every report and dashboard keys off it; left at the
  # upstream default every cluster reports as "cluster".
  clusterName: "CHANGEME"

  # Posture frameworks. `allcontrols` is the superset used for the DIGIT
  # security rating; `nsa` and the CIS benchmark are kept because auditors ask
  # for them by name. The CIS framework is cloud-specific -- cis-aks-t1.2.0 for
  # AKS, cis-eks-t1.2.0 for EKS -- so an EKS environment must override this.
  defaultFrameworks:
    - allcontrols
    - nsa
    - cis-aks-t1.2.0

  # Scan every namespace except the scanner's own. The upstream default also
  # excludes kube-system, kube-public and kube-node-lease, which hides the
  # control-plane add-ons -- the CIS benchmark is largely about those, so
  # excluding them makes the benchmark score meaningless.
  excludeNamespaces: "kubescape"
  includeNamespaces: ""

  # The storage component serves an aggregated API over mTLS, so it needs a CA
  # and a leaf certificate. Upstream's default strategy, `template`, mints them
  # with Sprig at render time and reuses an existing CA only via a `lookup`.
  #
  # Argo CD renders with `helm template` and NO cluster access, so that lookup
  # always comes back empty: every render produces a brand-new CA, the
  # Application is permanently OutOfSync, and selfHeal rotates the aggregated
  # API server's certificate in a loop.
  #
  # `initContainer` generates the certs in-cluster instead, reusing the CA from
  # its Secret once created, and patches the APIService caBundle itself. The
  # render then contains no Secret at all and is byte-identical run to run --
  # which is what makes this chart safe to deploy from Argo CD.
  #
  # It is the one place this chart grants write RBAC: `create` on Secrets in
  # the release namespace, `get` on the single Secret storage-tls-init, and
  # `get`/`patch` on the storage APIService. Everything else stays read-only.
  certificates:
    strategy: initContainer

  capabilities:
    operator: enable
    configurationScan: enable
    nodeScan: enable
    vulnerabilityScan: enable

    # Re-scan on every cluster change rather than on the schedule alone. Off:
    # on a cluster this size it keeps the scanner busy continuously for little
    # benefit over a daily pass.
    continuousScan: disable

    # ---- eBPF node agent (DaemonSet on every node) -- all disabled ----------
    # These are what make Kubescape a runtime security tool rather than a
    # scanner. They are genuinely useful, but they are also a privileged
    # DaemonSet on every node in the cluster, and they are not needed for the
    # posture and CVE reporting this deployment exists to provide. Turning any
    # of them on puts a privileged agent on every node -- review that
    # deliberately, per environment, rather than flipping it globally.
    relevancy: disable
    runtimeObservability: disable
    runtimeDetection: disable
    malwareDetection: disable
    networkPolicyService: disable
    networkEventsStreaming: disable
    nodeProfileService: disable
    httpDetection: disable
    seccompProfileService: disable
    nodeSbomGeneration: disable

    # ---- admission controller -- disabled -----------------------------------
    # A validating/mutating webhook in the pod-admission path. If it goes
    # unhealthy it can block pod creation cluster-wide, which is a bad trade
    # for a reporting deployment. Preventive policy belongs in a dedicated
    # policy engine, not here.
    admissionController: disable

    # ---- mutating RBAC -- disabled ------------------------------------------
    # `remediation` lets the operator annotate workloads and write
    # NetworkPolicies in response to findings. Keep the scanner read-only.
    remediation: disable
    manageWorkloads: disable

  # Daily, staggered off the hour so the two scans do not start together and
  # compete for the same node. UTC.
  kubescapeScheduler:
    scanSchedule: "18 1 * * *"
  kubevulnScheduler:
    scanSchedule: "18 3 * * *"

  # The scanner streams the whole resource graph and spills to /tmp. The
  # upstream read-only root filesystem makes that spill fail, and it silently
  # falls back to holding everything in memory -- on a cluster with a few
  # thousand objects that is the component most likely to be OOM-killed.
  # An emptyDir restores the spill path.
  kubescape:
    volumes:
      - name: ks-spill
        emptyDir: {}
    volumeMounts:
      - name: ks-spill
        mountPath: /tmp
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

  kubevuln:
    config:
      # Upstream default is 20971520 (20 MiB), and an SBOM over the limit is
      # not truncated -- the image is marked `sbom-too-large` and its CVE scan
      # is SKIPPED. The workload then reports no vulnerabilities, which on a
      # report or dashboard is indistinguishable from a clean image. That is
      # the reason to raise this: a silent zero is worse than a loud failure.
      #
      # Measured on unified-dev, every image that tripped the 20 MiB default:
      #
      #   airflow:3.0.2-custom3                      27.56 MiB
      #   project-factory:master-product-2.2.1       20.88 MiB
      #   boundary-management:master-154c0db         20.23 MiB
      #   boundary-management:HCMPRE-2371-...        20.22 MiB
      #
      # Three were within 5% of the limit, so a small bump would buy months,
      # not years. 64 MiB is 2.3x the largest and still well under the storage
      # component's own cap for this kind (`sbomsyfts`, 100 MB), which is the
      # next limit an SBOM would hit -- generating something storage would
      # then refuse just moves the failure.
      #
      # This costs no extra ephemeral-storage. Upstream ties ephemeral-storage
      # to `maxImageSize` (the unpacked image), not to the SBOM; 64 MiB is
      # noise against the 10Gi limit kubevuln already has.
      #
      # To find images hitting this, read the annotations rather than the logs:
      #   kubectl get sbomsyfts -A -o json | jq -r '.items[]
      #     | select(.metadata.annotations["kubescape.io/status"]=="too-large")
      #     | [.metadata.annotations["kubescape.io/status-reason"],
      #        .metadata.annotations["kubescape.io/resource-size"],
      #        .metadata.name] | @tsv'
      maxSBOMSize: 67108864
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 3Gi

  operator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  storage:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

  # Scan results live here. 5Gi holds the summaries for a few thousand objects
  # plus the SBOM cache; the SBOMs dominate, so raise this before adding
  # namespaces rather than after the PVC fills. storageClass "-" means the
  # cluster default, which is what all three unified environments use.
  persistence:
    storageClass: "-"
    accessMode: ReadWriteOnce
    size:
      backingStorage: 5Gi
      kubevuln: 5Gi

  # No ARMO SaaS backend: results stay in the cluster and are read through the
  # aggregated API. Supplying an account here would ship posture and CVE data
  # for every workload to a third party, which is a decision for the platform
  # owner, not a chart default.
  account: ""
  accessKey: ""
  server: ""
