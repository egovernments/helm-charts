# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "beneficiary-idgen"
  group: "health"

# ── Namespace ─────────────────────────────────────────────────────────────────
# Health services run in the `health` namespace; the Ingress is created in egov
# (next to the gateway), like the other DIGIT services.
namespace: health

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "beneficiary-idgen"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# NOTE: DB_URL points at egov-config/health-db-url (the health database), not the
# default db-url. The app datasource is overridden to match via extraEnv.app below.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "beneficiary_idgen_schema"
    image:
      repository: "beneficiary-idgen-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: health-db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "beneficiary-idgen"
replicas: 1
appType: "java"
tracing-enabled: false
heap: "-Xmx768m -Xms256m"
java-args: "-Dspring.profiles.active=monitoring"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>

# feature flags
idformat-from-mdms: "true"
autocreate-new-seq: "true"
security-basic-enabled: "false"
management-security-enabled: "false"
id-validation-enabled: "true"
id-dispatch-retrieval-limit-to-today-enabled: "true"

# MDMS
mdms-service-search-uri: "mdms-v2/v1/_search"
egov-mdms-search-uri: "mdms-v2/v1/_search"

# Redis (cache)
redis-host: "redis.backbone"
redis-port: "6379"
cache-type: "redis"
cache-redis-ttl: "86400"
cache-autoexpiry: "true"
redis-ttl-in-days: "1"

# Redisson (distributed locks / rate limiting)
redisson-redis-host: "redis.backbone"
redisson-redis-port: "6379"
redisson-redis-timeout: "10000"
redisson-redis-connection-pool-size: "20"
redisson-redis-connection-min-idle-size: "10"
redisson-redis-threads: "4"
redisson-redis-netty-threads: "4"

# Kafka serializers + topics
kafka-producer-key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
kafka-producer-value-serializer: "org.springframework.kafka.support.serializer.JsonSerializer"
topic-save-in-id-pool: "save-in-id-pool"
topic-update-id-pool-status: "update-id-pool-status"
topic-save-in-dispatch-log: "save-dispatch-id-log"
topic-consumer-bulk-update: "beneficiary-id-gen-bulk-update-health-topic"
topic-consumer-bulk-create: "beneficiary-id-gen-bulk-create-health-topic"

# ID pool generation
id-pool-seq-code: "id.pool.number.random"
idgen-random-buffer: "5"
id-pool-generation-max-records-per-persist-batch: "100"
id-pool-generation-max-size: "20000"

# Per-user/device rate limits
limit-id-user-device-per-day-enabled: "true"
limit-id-user-device-per-day: "100"
limit-id-user-device-total: "6000"
limit-id-user-device-per-day-expire-days: "10"
limit-id-user-device-total-expire-days: "30"
redis-default-replenish-rate: "4"
redis-default-burst-capacity: "4"

# Actuator / management (health probed on the app port)
management-server-port: "8080"
management-endpoints-web-exposure-include: "health,info"
management-endpoint-health-probes-enabled: "true"
management-endpoint-health-show-details: "never"
management-health-db-enabled: "false"
management-health-redis-enabled: "false"

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "300m"
    memory: "1Gi"

# datasource override: this service uses the health database (health-db-url), so
# override the db-url that common injects for java services.
extraEnv:
  app: |
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: health-db-url

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── Feature flags ──────────────────────────────────────────────────────────
  - name: IDFORMAT_FROM_MDMS
    value: {{ index .Values "idformat-from-mdms" | quote }}
  - name: AUTOCREATE_NEW_SEQ
    value: {{ index .Values "autocreate-new-seq" | quote }}
  - name: SECURITY_BASIC_ENABLED
    value: {{ index .Values "security-basic-enabled" | quote }}
  - name: MANAGEMENT_SECURITY_ENABLED
    value: {{ index .Values "management-security-enabled" | quote }}
  - name: ID_VALIDATION_ENABLED
    value: {{ index .Values "id-validation-enabled" | quote }}
  - name: ID_DISPATCH_RETRIEVAL_LIMIT_TO_TODAY_ENABLED
    value: {{ index .Values "id-dispatch-retrieval-limit-to-today-enabled" | quote }}

  # ── External services (MDMS) ─────────────────────────────────────────────────
  - name: MDMS_SERVICE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-service-v2
  - name: MDMS_SERVICE_SEARCH_URI
    value: {{ index .Values "mdms-service-search-uri" | quote }}
  - name: EGOV_MDMS_SEARCH_URI
    value: {{ index .Values "egov-mdms-search-uri" | quote }}

  # ── Redis (cache) ────────────────────────────────────────────────────────────
  - name: SPRING_REDIS_HOST
    value: {{ index .Values "redis-host" | quote }}
  - name: SPRING_REDIS_PORT
    value: {{ index .Values "redis-port" | quote }}
  - name: SPRING_CACHE_TYPE
    value: {{ index .Values "cache-type" | quote }}
  - name: SPRING_CACHE_REDIS_TIME_TO_LIVE
    value: {{ index .Values "cache-redis-ttl" | quote }}
  - name: SPRING_CACHE_AUTOEXPIRY
    value: {{ index .Values "cache-autoexpiry" | quote }}
  - name: REDIS_TTL_IN_DAYS
    value: {{ index .Values "redis-ttl-in-days" | quote }}

  # ── Redisson ─────────────────────────────────────────────────────────────────
  - name: REDISSON_REDIS_HOST
    value: {{ index .Values "redisson-redis-host" | quote }}
  - name: REDISSON_REDIS_PORT
    value: {{ index .Values "redisson-redis-port" | quote }}
  - name: REDISSON_REDIS_TIMEOUT
    value: {{ index .Values "redisson-redis-timeout" | quote }}
  - name: REDISSON_REDIS_CONNECTION_POOL_SIZE
    value: {{ index .Values "redisson-redis-connection-pool-size" | quote }}
  - name: REDISSON_REDIS_CONNECTION_MIN_IDLE_SIZE
    value: {{ index .Values "redisson-redis-connection-min-idle-size" | quote }}
  - name: REDISSON_REDIS_THREADS
    value: {{ index .Values "redisson-redis-threads" | quote }}
  - name: REDISSON_REDIS_NETTY_THREADS
    value: {{ index .Values "redisson-redis-netty-threads" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────────
  - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: {{ index .Values "kafka-producer-key-serializer" | quote }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: {{ index .Values "kafka-producer-value-serializer" | quote }}
  - name: KAFKA_TOPICS_SAVE_IN_ID_POOL
    value: {{ index .Values "topic-save-in-id-pool" | quote }}
  - name: KAFKA_TOPICS_UPDATE_ID_POOL_STATUS
    value: {{ index .Values "topic-update-id-pool-status" | quote }}
  - name: KAFKA_TOPICS_SAVE_IN_DISPATCH_LOG
    value: {{ index .Values "topic-save-in-dispatch-log" | quote }}
  - name: KAFKA_TOPICS_CONSUMER_BULK_UPDATE_TOPIC
    value: {{ index .Values "topic-consumer-bulk-update" | quote }}
  - name: KAFKA_TOPICS_CONSUMER_BULK_CREATE_TOPIC
    value: {{ index .Values "topic-consumer-bulk-create" | quote }}

  # ── ID pool generation ───────────────────────────────────────────────────────
  - name: ID_POOL_SEQ_CODE
    value: {{ index .Values "id-pool-seq-code" | quote }}
  - name: IDGEN_RANDOM_BUFFER
    value: {{ index .Values "idgen-random-buffer" | quote }}
  - name: ID_POOL_GENERATION_MAX_RECORDS_PER_PERSIST_BATCH
    value: {{ index .Values "id-pool-generation-max-records-per-persist-batch" | quote }}
  - name: ID_POOL_GENERATION_MAX_SIZE
    value: {{ index .Values "id-pool-generation-max-size" | quote }}

  # ── Per-user/device rate limits ──────────────────────────────────────────────
  - name: LIMIT_ID_USER_DEVICE_PER_DAY_ENABLED
    value: {{ index .Values "limit-id-user-device-per-day-enabled" | quote }}
  - name: LIMIT_ID_USER_DEVICE_PER_DAY
    value: {{ index .Values "limit-id-user-device-per-day" | quote }}
  - name: LIMIT_ID_USER_DEVICE_TOTAL
    value: {{ index .Values "limit-id-user-device-total" | quote }}
  - name: LIMIT_ID_USER_DEVICE_PER_DAY_EXPIRE_DAYS
    value: {{ index .Values "limit-id-user-device-per-day-expire-days" | quote }}
  - name: LIMIT_ID_USER_DEVICE_TOTAL_EXPIRE_DAYS
    value: {{ index .Values "limit-id-user-device-total-expire-days" | quote }}
  - name: SPRING_DATA_REDIS_DEFAULT_REPLENISHRATE
    value: {{ index .Values "redis-default-replenish-rate" | quote }}
  - name: SPRING_DATA_REDIS_DEFAULT_BURSTCAPACITY
    value: {{ index .Values "redis-default-burst-capacity" | quote }}

  # ── Actuator / management ────────────────────────────────────────────────────
  - name: MANAGEMENT_SERVER_PORT
    value: {{ index .Values "management-server-port" | quote }}
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: {{ index .Values "management-endpoints-web-exposure-include" | quote }}
  - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
    value: {{ index .Values "management-endpoint-health-probes-enabled" | quote }}
  - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
    value: {{ index .Values "management-endpoint-health-show-details" | quote }}
  - name: MANAGEMENT_HEALTH_DB_ENABLED
    value: {{ index .Values "management-health-db-enabled" | quote }}
  - name: MANAGEMENT_HEALTH_REDIS_ENABLED
    value: {{ index .Values "management-health-redis-enabled" | quote }}
