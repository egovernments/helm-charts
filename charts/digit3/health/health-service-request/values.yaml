# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  app: "health-service-request"
  group: "health"

# ── Namespace ─────────────────────────────────────────────────────────────────
# Health services run in the `health` namespace; the Ingress is created in egov.
namespace: health

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  namespace: egov
  enabled: true
  gateway: true
  context: "health-service-request"

# ── Init containers (flyway DB migration) ─────────────────────────────────────
# NOTE: DB_URL points at egov-config/health-db-url (the health database). The
# schemaTable keeps its historical hyphenated name (service-request_schema).
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "service-request_schema"
    image:
      repository: "health-service-request-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: health-db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# ── Container ─────────────────────────────────────────────────────────────────
image:
  repository: "health-service-request"
replicas: 1
appType: "java"
tracing-enabled: false
heap: "-Xmx512m -Xms512m"
java-args: "-Dspring.profiles.active=monitoring"

# ── App config (overridable per env) ──────────────────────────────────────────
context-path: ""  # blank -> /<ingress.context>

# feature flags
security-basic-enabled: "false"
management-security-enabled: "false"

# kafka
kafka-consumer-group: "service-request-health"
kafka-producer-key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
kafka-producer-value-serializer: "org.springframework.kafka.support.serializer.JsonSerializer"
topic-service-definition-create: "save-service-definition-health"
topic-service-create: "save-service-health"
topic-service-update: "update-service-health"
topic-service-definition-update: "update-service-definition-health"

# request limits
default-offset: "0"
default-limit: "10"
max-limit: "100"
max-string-input-size: "8192"

healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

resources: |
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "300m"
    memory: "1Gi"

# datasource override: this service uses the health database (health-db-url), so
# override the db-url that common injects for java services.
extraEnv:
  app: |
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: health-db-url

# ── Container env ─────────────────────────────────────────────────────────────
env: |
  # ── Service ──────────────────────────────────────────────────────────────
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: {{ .Values.httpPort | quote }}
  - name: SERVER_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context-path" | default (printf "/%s" .Values.ingress.context) | quote }}

  # ── Feature flags ──────────────────────────────────────────────────────────
  - name: SECURITY_BASIC_ENABLED
    value: {{ index .Values "security-basic-enabled" | quote }}
  - name: MANAGEMENT_SECURITY_ENABLED
    value: {{ index .Values "management-security-enabled" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────────
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: {{ index .Values "kafka-producer-key-serializer" | quote }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: {{ index .Values "kafka-producer-value-serializer" | quote }}
  - name: EGOV_SERVICE_DEFINITION_CREATE_TOPIC
    value: {{ index .Values "topic-service-definition-create" | quote }}
  - name: EGOV_SERVICE_CREATE_TOPIC
    value: {{ index .Values "topic-service-create" | quote }}
  - name: EGOV_SERVICE_UPDATE_TOPIC
    value: {{ index .Values "topic-service-update" | quote }}
  - name: EGOV_SERVICE_DEFINITION_UPDATE_TOPIC
    value: {{ index .Values "topic-service-definition-update" | quote }}

  # ── Request limits ───────────────────────────────────────────────────────────
  - name: EGOV_SERVICE_REQUEST_DEFAULT_OFFSET
    value: {{ index .Values "default-offset" | quote }}
  - name: EGOV_SERVICE_REQUEST_DEFAULT_LIMIT
    value: {{ index .Values "default-limit" | quote }}
  - name: EGOV_SERVICE_REQUEST_MAX_LIMIT
    value: {{ index .Values "max-limit" | quote }}
  - name: EGOV_MAX_STRING_INPUT_SIZE
    value: {{ index .Values "max-string-input-size" | quote }}
