{{- include "superset.init" . -}}
{{- if and .Values.web.enabled .Values.ingress.enabled }}
{{- $host := .Values.ingress.hostName | default .Values.global.domain | required "superset.ingress.hostName (or global.domain) is required" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
{{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
{{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
{{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /{{ .Values.ingress.context }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: {{ .Values.service.port }}
{{- if ne .Values.global.setup "quickstart" }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls-certs" $host) }}
{{- end }}
{{- end }}
