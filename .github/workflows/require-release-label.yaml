name: Require release labels

# Mandatory gate. Stays failing until the PR carries exactly one of EACH:
#   project:<name>   module:<name>   release:<major|minor|patch>
# Wire the 'require-label' job as a REQUIRED status check on master so no PR can merge
# without all three. (Job id kept as 'require-label' to match existing branch protection.)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  require-label:
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one project / module / release label
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail
          labels="$(printf '%s\n' "${PR_LABELS//,/$'\n'}")"

          check() {
            local kind="$1" pattern="$2"
            local matched count
            matched="$(printf '%s\n' "$labels" | grep -iE "$pattern" || true)"
            count="$(printf '%s\n' "$matched" | grep -c . || true)"
            if [[ "${count:-0}" -ne 1 ]]; then
              echo "::error::Add exactly ONE '${kind}:*' label (found ${count:-0})."
              return 1
            fi
            echo "${kind}: ${matched#*:}"
            return 0
          }

          rc=0
          check "project" '^project:[a-z0-9][a-z0-9-]*$'            || rc=1
          check "module"  '^module:(common|core|health|urban|frontend|backbone)$' || rc=1
          check "release" '^release:(major|minor|patch)$'           || rc=1

          if [[ "$rc" -ne 0 ]]; then
            echo "::error::PR must carry exactly one project:*, one module:*, and one release:* label before it can merge."
            exit 1
          fi
          echo "All three labels present."
