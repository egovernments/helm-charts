name: Release charts (label-driven, project/module/service → gh-pages)

# Triggers:
#   1. PR merged into master  -> project/module/service auto-detected from changed paths,
#      semver bump taken from the single release:<major|minor|patch> label on the PR.
#   2. Manual workflow_dispatch -> pick project / module / service / release from dropdowns
#      (used for backfills and one-off re-publishes).
#
# Versioning: the previous version is read from the PUBLISHED index.yaml on gh-pages.
#   - first ever publish of a chart -> the version in its Chart.yaml is used as-is (seed).
#   - thereafter -> previous version is bumped per the release type.
# Tagging: no per-service version tags. One traceability tag per run:
#   <project>/<module>/PR-<number>   (merge)   or   <project>/<module>/dispatch-<run_number> (manual)

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      project:
        description: "Project"
        required: true
        type: choice
        options:
          - digit3
      module:
        description: "Module"
        required: true
        type: choice
        options:
          - common
          - cluster-configs
          - core
          - health
          - urban
          - frontend
          - backbone
      service:
        description: "Service chart name (exact dir under charts/<project>/<module>/). Ignore for single-chart modules like common or cluster-configs."
        required: false
        type: string
      release:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: helm-release-gh-pages
  cancel-in-progress: false

env:
  GH_PAGES_HOST: helm.digit.org
  CHARTS_DIR: charts

jobs:
  release:
    # Run on manual dispatch, or when a PR is actually merged (not just closed).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.sha }}

      - name: Setup Helm & yq
        run: |
          set -e
          curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64
          curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # ---------------------------------------------------------------------
      # Determine release type + the set of (project, module, service) targets
      # ---------------------------------------------------------------------
      - name: Resolve release type and targets
        id: plan
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : > /tmp/targets.txt   # lines: project<TAB>module<TAB>service   (service empty => whole module 'common')

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE='${{ inputs.release }}'
            PROJECT='${{ inputs.project }}'
            MODULE='${{ inputs.module }}'
            SERVICE='${{ inputs.service }}'
            if [[ -f "${CHARTS_DIR}/${PROJECT}/${MODULE}/Chart.yaml" ]]; then
              # single-chart module (module dir is itself a chart, e.g. common, cluster-configs)
              printf '%s\t%s\t\n' "$PROJECT" "$MODULE" >> /tmp/targets.txt
            else
              [[ -n "$SERVICE" ]] || { echo "::error::service input is required for module '$MODULE'"; exit 1; }
              test -f "${CHARTS_DIR}/${PROJECT}/${MODULE}/${SERVICE}/Chart.yaml" \
                || { echo "::error::No Chart.yaml at ${CHARTS_DIR}/${PROJECT}/${MODULE}/${SERVICE}"; exit 1; }
              printf '%s\t%s\t%s\n' "$PROJECT" "$MODULE" "$SERVICE" >> /tmp/targets.txt
            fi
          else
            # ----- PR merge path: project/module from the diff, release from the PR form -----
            # The PR's OWN changed files (via the API), NOT a base..merge_commit diff: when the
            # PR branch is behind master, base.sha..merge_commit_sha also captures whatever else
            # landed on master in between, so unrelated modules leak in and trip the one-module
            # gate (kong PR #84 picked up an intervening common delete+re-add -> got 1/2). The
            # API list is exactly this PR's files, matching the require-label gate. 'removed'
            # files are dropped so a pure deletion is not counted as a changed module.
            CHANGED_FILES="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | select(.status != "removed") | .filename' || true)"

            CHANGED="$(printf '%s\n' "$CHANGED_FILES" \
              | awk -F/ -v c="${CHARTS_DIR}" '$1==c && NF>=4 {print $2"\t"$3}' | sort -u || true)"
            if [[ -z "$CHANGED" ]]; then
              echo "::notice::No chart changes; nothing to release."
              echo "release=" >> "$GITHUB_OUTPUT"; echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
            PROJECT="$(printf '%s\n' "$CHANGED" | awk -F'\t' 'NF{print $1}' | sort -u | head -1)"
            MODULE="$(printf  '%s\n' "$CHANGED" | awk -F'\t' 'NF{print $2}' | sort -u | head -1)"
            NPROJ=$(printf '%s\n' "$CHANGED" | awk -F'\t' 'NF{print $1}' | sort -u | grep -c . || true)
            NMOD=$(printf  '%s\n' "$CHANGED" | awk -F'\t' 'NF{print $2}' | sort -u | grep -c . || true)
            { [[ "$NPROJ" -eq 1 ]] && [[ "$NMOD" -eq 1 ]]; } \
              || { echo "::error::expected one project + one module per PR (got $NPROJ/$NMOD)"; exit 1; }

            RELEASE="$(printf '%s\n' "$PR_BODY" | grep -iE '^- \[[xX]\] (major|minor|patch)[[:space:]]*$' \
              | head -1 | sed -E 's/^- \[[xX]\] *//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
            case "$RELEASE" in major|minor|patch) : ;; *) echo "::error::no Release option ticked in PR form"; exit 1 ;; esac

            ROOT="${CHARTS_DIR}/${PROJECT}/${MODULE}"

            if [[ -f "${ROOT}/Chart.yaml" ]]; then
              # single-chart module (module dir is itself a chart, e.g. common, cluster-configs):
              # release it if anything under it changed
              if printf '%s\n' "$CHANGED_FILES" | grep -qE "^${ROOT}/"; then
                printf '%s\t%s\t\n' "$PROJECT" "$MODULE" >> /tmp/targets.txt
              fi
            else
              # services changed under the labelled project/module only
              printf '%s\n' "$CHANGED_FILES" \
                | awk -F/ -v c="${CHARTS_DIR}" -v p="$PROJECT" -v m="$MODULE" \
                    '$1==c && $2==p && $3==m && NF>=4 {print $4}' \
                | sort -u > /tmp/svcs.txt || true
              while IFS= read -r S; do
                [[ -n "$S" && -f "${ROOT}/${S}/Chart.yaml" ]] || continue
                printf '%s\t%s\t%s\n' "$PROJECT" "$MODULE" "$S" >> /tmp/targets.txt
              done < /tmp/svcs.txt
            fi
            sort -u -o /tmp/targets.txt /tmp/targets.txt
          fi

          COUNT=$(grep -c . /tmp/targets.txt || true)
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"    >> "$GITHUB_OUTPUT"
          echo "::notice::release=$RELEASE  targets=$COUNT"
          cat /tmp/targets.txt || true

      # ---------------------------------------------------------------------
      # Prepare the gh-pages worktree (source of truth for previous versions)
      # ---------------------------------------------------------------------
      - name: Prepare gh-pages worktree
        if: steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          GHP_DIR="_gh_pages"
          rm -rf "${GHP_DIR}"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add --force "${GHP_DIR}" gh-pages
          else
            git worktree add --force -b gh-pages "${GHP_DIR}" HEAD
            rm -rf "${GHP_DIR:?}/"* || true
          fi

      # ---------------------------------------------------------------------
      # Compute next version, bump Chart.yaml, package, publish per (project/module)
      # ---------------------------------------------------------------------
      - name: Build, version, package & publish
        if: steps.plan.outputs.count != '0'
        id: publish
        shell: bash
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          GHP_DIR="_gh_pages"
          HOST="${GH_PAGES_HOST}"
          : > /tmp/released.txt   # lines: project<TAB>module<TAB>service<TAB>from<TAB>to

          bump() {
            local v="$1" t="$2"; local IFS=.; read -r MA MI PA <<< "${v:-0.0.0}"
            case "$t" in
              major) echo "$((MA+1)).0.0";;
              minor) echo "$MA.$((MI+1)).0";;
              patch) echo "$MA.$MI.$((PA+1))";;
            esac
          }
          # highest published version of a chart from its module index.yaml ("" if none)
          prev_version() {
            local idx="$1" name="$2"
            [[ -f "$idx" ]] || { echo ""; return; }
            NAME="$name" yq -r '(.entries[strenv(NAME)] // []) | .[].version' "$idx" 2>/dev/null \
              | sort -V | tail -1
          }

          while IFS=$'\t' read -r PROJECT MODULE SERVICE; do
            [[ -n "$PROJECT" && -n "$MODULE" ]] || continue
            URL="https://${HOST}/${PROJECT}/${MODULE}"
            IDX="${GHP_DIR}/${PROJECT}/${MODULE}/index.yaml"

            if [[ -z "$SERVICE" ]]; then
              # single-chart module (module dir is itself a chart, e.g. common, cluster-configs)
              CHDIR="${CHARTS_DIR}/${PROJECT}/${MODULE}"; NAME="$MODULE"
            else
              CHDIR="${CHARTS_DIR}/${PROJECT}/${MODULE}/${SERVICE}"; NAME="$SERVICE"
            fi
            test -f "${CHDIR}/Chart.yaml" || { echo "::warning::skip missing ${CHDIR}/Chart.yaml"; continue; }

            PREV="$(prev_version "$IDX" "$NAME")"
            if [[ -z "$PREV" ]]; then
              NEXT="$(yq -r '.version' "${CHDIR}/Chart.yaml")"      # seed from Chart.yaml on first publish
              [[ -n "$NEXT" && "$NEXT" != "null" ]] || NEXT="$(bump "0.0.0" "$RELEASE")"
            else
              NEXT="$(bump "$PREV" "$RELEASE")"
            fi
            export NEXT
            yq -i '.version = env(NEXT)' "${CHDIR}/Chart.yaml"

            # resolve dependencies (common is pulled from the live registry)
            rm -f  "${CHDIR}/Chart.lock"
            rm -rf "${CHDIR}/charts"
            helm dependency build "${CHDIR}" || helm dependency update "${CHDIR}"

            DEST="${GHP_DIR}/${PROJECT}/${MODULE}/${NAME}"
            mkdir -p "${DEST}"
            helm package "${CHDIR}" --destination "${DEST}"

            printf '%s\t%s\t%s\t%s\t%s\n' "$PROJECT" "$MODULE" "$NAME" "${PREV:-0.0.0}" "$NEXT" >> /tmp/released.txt
            echo "::notice::${PROJECT}/${MODULE}/${NAME}: ${PREV:-<new>} -> ${NEXT}"
          done < /tmp/targets.txt

          # -------- rebuild one index.yaml per (project/module) that changed --------
          cut -f1,2 /tmp/released.txt | sort -u > /tmp/pm.txt
          while IFS=$'\t' read -r PROJECT MODULE; do
            [[ -n "$PROJECT" && -n "$MODULE" ]] || continue
            URL="https://${HOST}/${PROJECT}/${MODULE}"
            MROOT="${GHP_DIR}/${PROJECT}/${MODULE}"
            TMP="${MROOT}/_tmpindex"; rm -rf "$TMP"; mkdir -p "$TMP"
            [[ -f "${MROOT}/index.yaml" ]] && cp "${MROOT}/index.yaml" "${TMP}/index-old.yaml" || true
            # gather every .tgz under this module (service subdirs), plus common at module root
            find "${MROOT}" -mindepth 2 -maxdepth 2 -name '*.tgz' -exec cp {} "${TMP}/" \; 2>/dev/null || true
            find "${MROOT}" -maxdepth 1 -name '*.tgz' -exec cp {} "${TMP}/" \; 2>/dev/null || true

            MERGE=()
            [[ -f "${TMP}/index-old.yaml" ]] && MERGE=(--merge "${TMP}/index-old.yaml")
            helm repo index "${TMP}" --url "$URL" "${MERGE[@]}"

            # rewrite flat urls -> nested chart dirs (every chart, incl. common, lives at <module>/<name>/)
            IDX="${TMP}/index.yaml"; export URL
            while IFS= read -r ENTRY; do
              NAME="$ENTRY" yq -i '
                .entries[strenv(NAME)][] |=
                  (.urls = [ (.urls[0] | sub("^" + strenv(URL) + "/"; strenv(URL) + "/" + strenv(NAME) + "/")) ])
              ' "$IDX"
            done < <(yq -r '.entries | keys[]' "$IDX")

            mv "$IDX" "${MROOT}/index.yaml"
            rm -rf "$TMP"
          done < /tmp/pm.txt

          # expose for changelog/index steps
          echo "released<<EOF" >> "$GITHUB_OUTPUT"; cat /tmp/released.txt >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

          # -------- commit & push gh-pages --------
          git -C "${GHP_DIR}" config user.name  "$GIT_AUTHOR_NAME"
          git -C "${GHP_DIR}" config user.email "$GIT_AUTHOR_EMAIL"
          git -C "${GHP_DIR}" add .
          git -C "${GHP_DIR}" commit -m "gh-pages: publish ${RELEASE} release ($(cut -f1-3 /tmp/released.txt | paste -sd';' -))" || echo "nothing to commit"
          git -C "${GHP_DIR}" push origin gh-pages

      # ---------------------------------------------------------------------
      # Changelog + registry discovery files (projects.json / <project>/modules.json)
      # ---------------------------------------------------------------------
      - name: Update changelog & discovery files
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          GHP_DIR="_gh_pages"
          git -C "${GHP_DIR}" pull --rebase origin gh-pages || true

          DATE="$(date -u +%Y-%m-%d)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REF_KIND="PR"; REF_ID='${{ github.event.pull_request.number }}'
            TITLE='${{ github.event.pull_request.title }}'; AUTHOR='${{ github.event.pull_request.user.login }}'
          else
            REF_KIND="dispatch"; REF_ID='${{ github.run_number }}'
            TITLE="manual dispatch"; AUTHOR='${{ github.actor }}'
          fi

          # one changelog entry per (project/module), listing its charts
          for PM in $(cut -f1,2 /tmp/released.txt | sort -u | tr '\t' '/'); do
            PROJECT="${PM%%/*}"; MODULE="${PM##*/}"
            CL="${GHP_DIR}/${PROJECT}/${MODULE}/changelog.yaml"
            E="/tmp/entry.yaml"
            {
              printf '  - date: "%s"\n' "$DATE"
              printf '    ref: "%s-%s"\n' "$REF_KIND" "$REF_ID"
              printf '    title: "%s"\n' "$TITLE"
              printf '    author: "%s"\n' "$AUTHOR"
              printf '    release_type: "%s"\n' "$RELEASE"
              printf '    charts:\n'
            } > "$E"
            while IFS=$'\t' read -r P M S FROM TO; do
              [[ "$P/$M" == "$PM" ]] || continue
              printf '      - name: "%s"\n        from: "%s"\n        to: "%s"\n' "$S" "$FROM" "$TO" >> "$E"
            done < /tmp/released.txt
            if [[ -f "$CL" ]]; then
              { head -1 "$CL"; cat "$E"; tail -n +2 "$CL"; } > "${CL}.tmp" && mv "${CL}.tmp" "$CL"
            else
              mkdir -p "$(dirname "$CL")"; { printf 'releases:\n'; cat "$E"; } > "$CL"
            fi
          done

          # projects.json (root) and <project>/modules.json
          PROJS="$(ls -d "${GHP_DIR}"/*/ 2>/dev/null | xargs -n1 basename | grep -vE '^_' | grep -vE '\.' || true)"
          echo "[$(printf '%s\n' $PROJS | awk 'NF{printf (NR>1?",":"")"\""$0"\""}')]" > "${GHP_DIR}/projects.json"
          for P in $PROJS; do
            MODS="$(ls -d "${GHP_DIR}/${P}"/*/ 2>/dev/null | xargs -n1 basename | grep -vE '^_' || true)"
            echo "[$(printf '%s\n' $MODS | awk 'NF{printf (NR>1?",":"")"\""$0"\""}')]" > "${GHP_DIR}/${P}/modules.json"
          done

          # copy registry html from the merged commit (best-effort)
          for f in index.html project-index.html module-index.html; do
            git show "${{ steps.ref.outputs.sha }}:$f" > "/tmp/$f" 2>/dev/null || true
          done
          [[ -f /tmp/index.html ]] && cp /tmp/index.html "${GHP_DIR}/index.html" || true
          for P in $PROJS; do
            [[ -f /tmp/project-index.html ]] && cp /tmp/project-index.html "${GHP_DIR}/${P}/index.html" || true
            for M in $(ls -d "${GHP_DIR}/${P}"/*/ 2>/dev/null | xargs -n1 basename | grep -vE '^_'); do
              [[ -f /tmp/module-index.html ]] && cp /tmp/module-index.html "${GHP_DIR}/${P}/${M}/index.html" || true
            done
          done

          git -C "${GHP_DIR}" add .
          git -C "${GHP_DIR}" commit -m "gh-pages: changelog + discovery (${RELEASE})" || echo "nothing to commit"
          git -C "${GHP_DIR}" push origin gh-pages

      # ---------------------------------------------------------------------
      # Version-sync: write the released version into each chart's Chart.yaml on master,
      # then tag that commit with the version. master Chart.yaml and the tag always match
      # what was published. Done after packaging/publishing, before the version tag is cut.
      # Tag format: <project>/<module>/<version> (single-chart module) or
      #             <project>/<module>/<service>/<version> (service chart).
      # ---------------------------------------------------------------------
      - name: Sync chart versions to master & tag
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          WT=_master_sync
          SYNCED=""
          # released.txt lines: project<TAB>module<TAB>name<TAB>from<TAB>to  (name==module for single-chart)
          for attempt in 1 2 3 4 5; do
            git worktree remove -f "$WT" 2>/dev/null || true
            git fetch origin master -q
            git worktree add --force --detach "$WT" origin/master
            changed=0
            while IFS=$'\t' read -r P M N FROM TO; do
              [[ -n "$P" && -n "$M" && -n "$N" && -n "$TO" ]] || continue
              if [[ "$N" == "$M" ]]; then CH="$WT/${CHARTS_DIR}/${P}/${M}/Chart.yaml"
              else CH="$WT/${CHARTS_DIR}/${P}/${M}/${N}/Chart.yaml"; fi
              [[ -f "$CH" ]] || { echo "::warning::missing on master: $CH"; continue; }
              CUR="$(yq -r '.version' "$CH")"
              if [[ "$CUR" != "$TO" ]]; then export TO; yq -i '.version = env(TO)' "$CH"; changed=1; fi
            done < /tmp/released.txt
            if [[ "$changed" == "0" ]]; then
              echo "master Chart.yaml already at target versions."
              SYNCED="$(git -C "$WT" rev-parse HEAD)"; break
            fi
            git -C "$WT" add -A
            git -C "$WT" commit -q -m "chore(release): set chart versions [$(cut -f1-3 /tmp/released.txt | tr '\t' '/' | paste -sd',' -)]"
            if git -C "$WT" push origin HEAD:master 2>/tmp/pusherr.log; then
              SYNCED="$(git -C "$WT" rev-parse HEAD)"; echo "version bump pushed to master."; break
            fi
            echo "push to master failed (attempt $attempt):"; cat /tmp/pusherr.log || true
            sleep 3
          done
          [[ -n "$SYNCED" ]] || { echo "::error::could not sync chart versions to master (branch protection may block the bot push)"; exit 1; }
          while IFS=$'\t' read -r P M N FROM TO; do
            [[ -n "$P" && -n "$M" && -n "$N" && -n "$TO" ]] || continue
            if [[ "$N" == "$M" ]]; then TAG="${P}/${M}/${TO}"; else TAG="${P}/${M}/${N}/${TO}"; fi
            git tag -f -a "$TAG" "$SYNCED" -m "Release $TAG"
            echo "tag: $TAG -> $SYNCED"
          done < /tmp/released.txt
          git push -f origin --tags
          git worktree remove -f "$WT" 2>/dev/null || true
