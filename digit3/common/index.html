<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module - DIGIT Helm Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg:#0b1220; --border:#2a3444; --text:#e8edf5; --muted:#8b95a5; --line:#273243; --link:#4ea1ff;
      --code:#0f1c2d; --badge-blue:#2c8fe8; --badge-green:#2ea043; --badge-orange:#d18616; --badge-purple:#8b5cf6;
      --accent:#ff8b6a; --card-bg:#0d1829; --card-border:#1e2d3d; --card-hover:#111f33;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:28px; }
    .frame { width:min(1360px,100%); margin:0 auto; border:1px solid var(--border); border-radius:18px; background:linear-gradient(180deg,#08111d,#07101a); overflow:hidden; box-shadow:0 12px 36px rgba(0,0,0,.28); }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 22px 0 22px; border-bottom:1px solid var(--border); }
    .tab { display:flex; align-items:center; gap:12px; padding:0 0 16px 0; font-weight:700; font-size:18px; position:relative; }
    .tab::after { content:""; position:absolute; left:-10px; bottom:-1px; width:150px; height:3px; border-radius:3px; background:var(--accent); }
    .book { width:24px; height:24px; opacity:.9; } .icons svg { width:22px; height:22px; stroke:#d9e0ea; opacity:.88; } .icons { padding-bottom:12px; }
    .content { padding:40px 48px 56px 48px; }
    .breadcrumb { font-size:15px; color:var(--muted); margin-bottom:18px; }
    .breadcrumb a { color:var(--link); text-decoration:none; } .breadcrumb a:hover { text-decoration:underline; }
    h1 { font-size:46px; line-height:1.1; font-weight:800; letter-spacing:-0.03em; margin-bottom:8px; }
    h2 { margin:40px 0 12px 0; font-size:28px; font-weight:800; }
    hr { border:none; border-top:1px solid var(--line); margin:16px 0 22px 0; }
    p { margin:0 0 18px 0; font-size:17px; line-height:1.7; }
    a { color:var(--link); text-underline-offset:3px; }
    .badges { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 24px 0; }
    .badge { display:inline-flex; align-items:center; border-radius:6px; font-size:14px; color:#fff; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
    .badge .label { background:#4c5563; padding:6px 10px; } .badge .value { padding:6px 12px; }
    .badge .value.blue { background:var(--badge-blue); } .badge .value.green { background:var(--badge-green); } .badge .value.orange { background:var(--badge-orange); }
    .codeblock { background:var(--code); padding:22px 26px; margin:14px 0 22px 0; border-radius:8px; overflow:auto; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:15px; color:#77b9ff; white-space:pre; }
    .inline { display:inline-block; background:#2b3440; color:#f0f4fa; border-radius:6px; padding:3px 8px; font-size:14px; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    .stats { display:flex; gap:32px; flex-wrap:wrap; margin:20px 0 28px 0; padding:20px 26px; background:rgba(255,255,255,.02); border:1px solid var(--card-border); border-radius:12px; }
    .stat { text-align:center; } .stat-num { font-size:30px; font-weight:800; color:var(--link); } .stat-label { font-size:14px; color:var(--muted); margin-top:4px; }
    .charts-table { width:100%; border-collapse:collapse; margin:8px 0 8px 0; border:1px solid var(--card-border); border-radius:12px; overflow:hidden; }
    .charts-table th { text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:14px 20px; background:rgba(255,255,255,.03); border-bottom:1px solid var(--card-border); }
    .charts-table td { padding:16px 20px; border-bottom:1px solid var(--card-border); font-size:15px; vertical-align:top; }
    .charts-table tr:last-child td { border-bottom:none; }
    .charts-table tr:hover td { background:var(--card-hover); }
    .chart-name-cell { font-weight:700; white-space:nowrap; }
    .type-tag { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:4px; background:rgba(255,255,255,.08); color:var(--muted); margin-left:8px; }
    .chart-desc-cell { color:var(--muted); line-height:1.5; }
    .dep-list { margin-top:6px; font-size:13px; color:var(--muted); } .dep-list span { color:#77b9ff; }
    .meta-badge { display:inline-flex; align-items:center; border-radius:4px; font-size:12px; color:#fff; overflow:hidden; }
    .meta-badge .m-label { background:#3a4453; padding:3px 7px; } .meta-badge .m-value { padding:3px 8px; }
    .m-value.v-blue { background:#1e6fbf; } .m-value.v-green { background:#1a7f35; }
    .empty-state { padding:22px 26px; color:var(--muted); font-style:italic; border:1px solid var(--card-border); border-radius:12px; }
    .changelog { margin:8px 0 8px 0; }
    .release-entry { border:1px solid var(--card-border); border-radius:12px; padding:18px 22px; margin-bottom:14px; background:var(--card-bg); }
    .release-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    .release-title { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; flex-wrap:wrap; }
    .release-type-badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:5px; color:#fff; }
    .release-type-badge.major { background:#b60205; } .release-type-badge.minor { background:#bf8700; } .release-type-badge.patch { background:#1a7f35; }
    .release-meta { font-size:13px; color:var(--muted); display:flex; gap:14px; } .release-meta .author { color:#77b9ff; }
    .release-charts { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
    .release-chart-row { display:flex; align-items:center; gap:12px; font-size:14px; }
    .release-chart-name { font-weight:600; min-width:160px; }
    .version-arrow { display:inline-flex; align-items:center; gap:8px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
    .version-arrow .old { color:var(--muted); } .version-arrow .arrow { color:var(--accent); } .version-arrow .new { color:#2ea043; font-weight:600; }
    .loader { display:flex; align-items:center; gap:12px; padding:22px 26px; color:var(--muted); font-size:15px; }
    .spinner { width:20px; height:20px; border:2px solid var(--card-border); border-top-color:var(--link); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:900px) { body{padding:14px;} .content{padding:22px 16px 30px;} h1{font-size:30px;} .charts-table{display:block;overflow-x:auto;} .release-chart-name{min-width:unset;} }
  </style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="tab">
        <svg class="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5v-13A2.5 2.5 0 0 1 6.5 2z"></path><path d="M12 6.5v11"></path></svg>
        <span>Helm Charts Registry</span>
      </div>
      <div class="icons"><a href="https://github.com/egovernments/helm-charts" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg></a></div>
    </div>
    <div class="content">
      <div class="breadcrumb"><a href="/">Registry</a> / <a id="crumb-project-link" href="#">project</a> / <span id="crumb-module">module</span></div>
      <h1 id="page-title">Module</h1>
      <hr>
      <div class="badges" id="module-badges"></div>
      <p id="module-desc">Charts in this module.</p>

      <div class="stats">
        <div class="stat"><div class="stat-num" id="stat-charts">-</div><div class="stat-label">Charts</div></div>
        <div class="stat"><div class="stat-num" id="stat-releases">-</div><div class="stat-label">Releases</div></div>
        <div class="stat"><div class="stat-num" id="stat-latest-date" style="font-size:18px">-</div><div class="stat-label">Latest Release</div></div>
      </div>

      <h2>Install</h2><hr>
      <div class="codeblock"><code id="install-code">Loading...</code></div>

      <h2>Charts</h2><hr>
      <div id="charts-section"><div class="loader"><div class="spinner"></div> Loading charts from index.yaml...</div></div>

      <h2>Release History</h2><hr>
      <div id="changelog-section"><div class="loader"><div class="spinner"></div> Loading changelog...</div></div>
    </div>
  </div>

  <script>
    const HOST = 'helm.digit.org';
    const REPO_BASE = 'https://github.com/egovernments/helm-charts';

    function ctx() {
      const parts = window.location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
      const module = parts[parts.length - 1] || 'unknown';
      const project = parts[parts.length - 2] || 'unknown';
      return { project, module };
    }
    function parseIndex(t) {
      const d = jsyaml.load(t); if (!d || !d.entries) return [];
      const out = [];
      for (const [name, vers] of Object.entries(d.entries)) {
        if (!Array.isArray(vers) || !vers.length) continue;
        const l = vers[0];
        out.push({ name:l.name||name, version:l.version||'0.0.0', appVersion:l.appVersion||'', description:l.description||'', type:l.type||'application', dependencies:l.dependencies||[], allVersions:vers.map(v=>v.version) });
      }
      return out.sort((a,b)=>a.name.localeCompare(b.name));
    }
    function parseChangelog(t) { const d = jsyaml.load(t); return (d && Array.isArray(d.releases)) ? d.releases : []; }

    function renderCharts(charts) {
      if (!charts.length) return '<div class="empty-state">No charts published yet for this module.</div>';
      const rows = charts.map(c => {
        const lib = c.type === 'library';
        let ver = `<div class="meta-badge"><span class="m-label">chart</span><span class="m-value v-blue">${c.version}</span></div>`;
        if (c.appVersion) ver += ` <div class="meta-badge"><span class="m-label">app</span><span class="m-value v-green">${c.appVersion}</span></div>`;
        let deps = '';
        if (c.dependencies && c.dependencies.length) deps = `<div class="dep-list">Deps: ${c.dependencies.map(d=>`<span>${d.name} (${d.version})</span>`).join(', ')}</div>`;
        return `<tr><td class="chart-name-cell">${c.name}${lib?'<span class="type-tag">library</span>':''}</td><td class="chart-desc-cell">${c.description||''}${deps}</td><td>${ver}</td><td style="color:var(--muted);text-align:center">${c.allVersions?c.allVersions.length:1}</td></tr>`;
      }).join('');
      return `<table class="charts-table"><thead><tr><th>Chart</th><th>Description</th><th>Latest Version</th><th>Releases</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderChangelog(releases) {
      if (!releases.length) return '<div class="empty-state">No release history recorded yet.</div>';
      return '<div class="changelog">' + releases.map(r => {
        const ref = r.ref || '';
        const m = /^PR-(\d+)$/.exec(ref);
        const refHtml = m ? `<a href="${REPO_BASE}/pull/${m[1]}">#${m[1]}</a>` : (ref ? `<span>${ref}</span>` : '');
        const rtype = (r.release_type || 'patch').toLowerCase();
        const charts = (r.charts || []).map(c => `
          <div class="release-chart-row"><span class="release-chart-name">${c.name}</span>
          <span class="version-arrow"><span class="old">${c.from||'new'}</span><span class="arrow">&rarr;</span><span class="new">${c.to}</span></span></div>`).join('');
        return `<div class="release-entry">
          <div class="release-header">
            <div class="release-title"><span class="release-type-badge ${rtype}">${rtype}</span>${refHtml}<span>${r.title||'Release'}</span></div>
            <div class="release-meta"><span>${r.date||''}</span><span>by <span class="author">@${r.author||'github-actions'}</span></span></div>
          </div>${charts?`<div class="release-charts">${charts}</div>`:''}</div>`;
      }).join('') + '</div>';
    }

    async function main() {
      const { project, module } = ctx();
      const repoName = `${project}-${module}`;
      const repoUrl = `https://${HOST}/${project}/${module}`;
      document.title = `${project}/${module} - DIGIT Helm Charts`;
      document.getElementById('page-title').textContent = module;
      document.getElementById('crumb-module').textContent = module;
      const pl = document.getElementById('crumb-project-link'); pl.textContent = project; pl.href = `/${project}/`;
      document.getElementById('module-desc').textContent = `Charts in module "${module}" of project "${project}". Independent Helm repository at ${repoUrl}.`;
      document.getElementById('install-code').textContent =
        `helm repo add ${repoName} ${repoUrl}\nhelm repo update\nhelm install my-release ${repoName}/<chart-name> -n <namespace> -f values.yaml`;

      const [idx, cl] = await Promise.allSettled([
        fetch('./index.yaml').then(r=>{ if(!r.ok) throw new Error(); return r.text(); }),
        fetch('./changelog.yaml').then(r=>{ if(!r.ok) throw new Error(); return r.text(); })
      ]);
      const charts = idx.status === 'fulfilled' ? parseIndex(idx.value) : [];
      const releases = cl.status === 'fulfilled' ? parseChangelog(cl.value) : [];
      document.getElementById('charts-section').innerHTML = renderCharts(charts);
      document.getElementById('changelog-section').innerHTML = renderChangelog(releases);
      document.getElementById('stat-charts').textContent = charts.length;
      document.getElementById('stat-releases').textContent = releases.length;
      document.getElementById('stat-latest-date').textContent = releases.length ? (releases[0].date || 'N/A') : 'N/A';
      document.getElementById('module-badges').innerHTML =
        `<div class="badge"><span class="label">Project</span><span class="value blue">${project}</span></div>
         <div class="badge"><span class="label">Module</span><span class="value orange">${module}</span></div>
         <div class="badge"><span class="label">Charts</span><span class="value green">${charts.length}</span></div>`;
    }
    main();
  </script>
</body>
</html>
